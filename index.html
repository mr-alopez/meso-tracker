<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<title>Meso 01</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#e3e7ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111519" media="(prefers-color-scheme: dark)">
<style>
  :root{
    color-scheme:light;
    --ink:#14181d;
    --ink-2:#4a555f;
    --ink-3:#5c656e;   /* 5.57 on card, 4.77 on paper; #7d8892 was 3.39/2.91, under AA */
    --paper:#e3e7ea;
    --card:#f6f8f9;
    --line:#c6ced4;
    --line-2:#dde3e7;
    --signal:#1b5e8c;
    --logged:#146b52;
    --deload:#8a4a1f;
    --banner-bg:#f3ece6;
    --banner-ink:#6b4526;
    --cue-bg:#eceff1;
    --card-2:#eceff1;
    --field:#fff;
    --field-logged:#eef1f2;
    --placeholder:#a8b1b8;
    --active-bg:#e7eef5;
    --video:#c4302b;
    --rest:#5f4b9e;
    /* Effort ramp: one hue, three intensities, low -> high. Deliberately NOT
       a valence gradient - "right" is not the correct answer, and colouring
       it as the good one would bias the self-report toward it over time.
       --eff-3 IS --deload, so the scale lands in the family the amber owns. */
    --eff-1:#f2dcc4; --eff-1-ink:#5c3d1c;
    --eff-2:#d99552; --eff-2-ink:#33200c;
    --eff-3:#8a4a1f; --eff-3-ink:#fbf1e7;
    /* The only red on the card: pain is the one control meaning something is
       wrong, and the one that overrides the matrix. */
    --alarm:#b3261e;
    --mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono","Courier New",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  /* Dark palette. Applied when the system prefers dark (unless the user forced
     light), and when the user forced dark. Same tokens, same accent semantics:
     blue = prescribed, green = logged, amber = deload. The block appears twice
     because CSS can't share it between a media query and an attribute selector
     without a build step — keep both copies identical. */
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --ink:#f2f6f9;
      --ink-2:#c2ccd5;
      --ink-3:#a2adb8;
      --paper:#131920;
      --card:#212932;
      --line:#55626d;
      --line-2:#333d46;
      --signal:#93c8ee;
      --logged:#45b894;
      --deload:#dba569;
      --banner-bg:#2e2318;
      --banner-ink:#e6c9a6;
      --cue-bg:#2a333c;
      --card-2:#1b222a;
      --field:#171d24;
      --field-logged:#262f38;
      --placeholder:#6d7985;
      --active-bg:#2c3742;
      --video:#ff5f5f;
      --rest:#b49ae8;
      --eff-1:#3d3427; --eff-1-ink:#e6d3ba;
      --eff-2:#8a5f31; --eff-2-ink:#fdf2e4;
      --eff-3:#dba569; --eff-3-ink:#1a222b;
      --alarm:#ff6b6b;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ink:#f2f6f9;
    --ink-2:#c2ccd5;
    --ink-3:#a2adb8;
    --paper:#131920;
    --card:#212932;
    --line:#55626d;
    --line-2:#333d46;
    --signal:#93c8ee;
    --logged:#45b894;
    --deload:#dba569;
    --banner-bg:#2e2318;
    --banner-ink:#e6c9a6;
    --cue-bg:#2a333c;
    --card-2:#1b222a;
    --field:#171d24;
    --field-logged:#262f38;
    --placeholder:#6d7985;
    --active-bg:#2c3742;
    --video:#ff5f5f;
    --rest:#b49ae8;
    --eff-1:#3d3427; --eff-1-ink:#e6d3ba;
    --eff-2:#8a5f31; --eff-2-ink:#fdf2e4;
    --eff-3:#dba569; --eff-3-ink:#1a222b;
    --alarm:#ff6b6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* None of this is prose to be selected - it is a control surface, and a
     touch-and-hold that starts a selection is a tap that did not do what it
     was for. The old card drag reached for exactly this with a .no-select
     class it put on <body> for the duration of a drag. When that drag was
     replaced, the reorder sheet inherited none of the protection, and holding
     a row selected the exercise name rather than picking the row up.

     Fields are the exception: a note cannot be edited if it cannot be
     selected. */
  body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  input,textarea{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
  /* One card per gesture. scroll-snap-stop:always stops a hard fling at each
     card rather than letting it sail past several.

     MANDATORY, with a second snap point per card. Mandatory alone was wrong: a
     card taller than the usable height had only one snap position, its own top,
     so the FELT row and the note at its foot could not be reached at all -
     scrollIntoView on them moved the container zero pixels at 375x667. But
     proximity, which fixed that, is too weak to hold a hard fling: it let the
     list rest at any of eleven positions inside a single card instead of two.

     So the fix belongs on the card, not on the container. .notebtn is the last
     element in a card, and aligning its END to the end of the snapport gives
     every card a second resting place that shows its bottom. Measured at
     375x667: mandatory alone rests at 2 positions and cannot reach FELT;
     proximity rests at 11; this rests at 4, and reaches everything. The extra
     positions carry no scroll-snap-stop, so a fling still stops one card at a
     time - only a deliberate slow drag can come to rest on one.
     The header carries its own snap point, or the top of the page would not be
     a valid resting position and mandatory would drag you off the week and day
     selector onto the first card. scroll-margin-top clears the sticky
     dashboard: snap points align to the top of the viewport, so without it a
     card lands behind the bar and loses its name. */
  /* snap-stop as well, or a flick upward sails past the top and you can never
     come to rest on the week and day selector. */
  header{scroll-snap-align:start;scroll-snap-stop:always}
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.4}
  /* The page scrolls inside .wrap, not the document. Snapping - and
     scroll-snap-stop especially - is far more reliable in a real scroll
     container than on the root scroller in Chrome Android, which was letting
     flicks sail past cards the spec says they should stop at. */
  .wrap{max-width:560px;margin:0 auto;height:100dvh;overflow-y:auto;
    overscroll-behavior-y:contain;scroll-snap-type:y mandatory}

  /* ---- header: compact, scrolls away. The dashboard below it is what sticks. ---- */
  header{background:var(--paper);padding:8px 14px 0}
  .brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
  .brand{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
  .rir{font-family:var(--mono);font-size:13px;color:var(--ink-2);letter-spacing:.02em}
  .rir b{color:var(--signal);font-size:13px}
  .hright{display:flex;align-items:baseline;gap:10px}
  .themeBtn{appearance:none;border:none;background:var(--card);color:var(--ink-2);
    font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    padding:6px 8px;border-radius:5px;cursor:pointer;min-width:52px}
  .seg{display:flex;gap:6px;margin-bottom:6px}
  .seg button{flex:1;appearance:none;border:none;background:var(--card);color:var(--ink-2);
    font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    padding:10px 0;border-radius:5px;cursor:pointer}
  /* Selection stays an inverted fill. The dashboard has no selected state to
     borrow from, and nothing reads as "chosen" more plainly than this. */
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .seg.weeks button[aria-pressed="true"].dl{background:var(--deload)}
  /* Struck through rather than merely dimmed: the current day is already the
     filled tab, so dimming alone would not read as "set aside" on it. */
  .seg.days button.skipped{opacity:.55;text-decoration:line-through;text-decoration-thickness:1px}
  .daymeta{font-size:13px;color:var(--ink-3);padding:0 0 8px;font-family:var(--mono)}
  /* Start and End: the two moments that bracket a session, so they get the only
     full-width controls in the app. Same panel language as everything else -
     filled, 5px corners, no border - just louder and wider. --signal to begin
     because it is the accent that already means "this is the live thing", and
     --logged to finish because green already means done everywhere else. */
  .bigbtn{display:block;width:100%;appearance:none;border:none;border-radius:5px;cursor:pointer;
    font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    padding:17px 12px;-webkit-tap-highlight-color:transparent}
  .startBtn{background:var(--signal);color:var(--paper);margin:2px 0 9px}
  .endBtn{background:var(--logged);color:var(--paper)}
  /* Quieter than End: occasional, and unrelated to the clock. */
  .reportBtn{background:var(--card-2);color:var(--ink-2);letter-spacing:.1em;margin-top:8px}
  .endwrap{padding:4px 14px 10px;scroll-snap-align:start;scroll-snap-stop:always;scroll-margin-top:78px}
  .bigbtn:active{transform:scale(.985)}
  .bigbtn .btime{opacity:.72;letter-spacing:.08em}

  /* ---- sticky dashboard: session · rest · sets left ---- */
  /* Three platforms, not a ruled table. Dividing lines are table grammar -
     they promise columns that relate down a grid, and there is one row of
     three unrelated readouts. Separate panels also let the two that are
     buttons look like buttons while the sets count, which is not tappable,
     simply sits there. Gutters keep the right-hand panel off the screen edge,
     where running flush read as truncated even though nothing was clipped.
     Both stopwatches share one column width; the tighter horizontal padding
     is what keeps a h:mm:ss session from crowding its panel. */
  .dash{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr 1fr auto;
    gap:6px;background:var(--paper);padding:5px 14px}
  .dcell{appearance:none;border:none;background:var(--card);color:var(--ink);font-family:var(--mono);
    border-radius:5px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:6px 8px;min-height:56px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .dcell.count{cursor:default}
  .dlabel{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
    white-space:nowrap}
  .dval{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .dcell.on .dval, .dcell.on .dlabel{color:var(--signal)}
  .dcell.paused .dval, .dcell.paused .dlabel{color:var(--deload)}
  #restBtn.on .dval, #restBtn.on .dlabel{color:var(--rest)}
  .dcell.count .dval{color:var(--logged)}
  .dcell.count.done .dlabel{color:var(--logged)}

  /* ---- deload banner ---- */
  .banner{margin:12px 14px 0;padding:10px 12px;border-left:3px solid var(--deload);background:var(--banner-bg);
    font-size:13px;color:var(--banner-ink)}

  /* ---- exercise card ---- */
  .card{background:var(--card);border:1px solid var(--line-2);border-top:2px solid var(--ink);
    margin:14px 14px 0;padding:12px 12px 4px;
    scroll-snap-align:start;scroll-snap-stop:always;scroll-margin-top:78px}
  .card.done{border-top-color:var(--logged)}
  /* Set aside for today: dimmed and named as such, but every row is left in
     place so restoring it costs one tap and loses nothing. */
  .card.skipped{opacity:.55;border-top-color:var(--ink-3)}
  .card.skipped .say, .card.skipped .cuewrap{display:none}
  .card.skipped .todo{border-left-color:var(--line-2)}
  .exhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  /* The only control in the header: a 44px target you can find by feel. It
     opens the reorder sheet rather than starting a drag of its own. */
  .grip{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    appearance:none;border:none;background:transparent;padding:0;cursor:pointer}
  .grip svg{width:13px;height:21px;fill:var(--line);display:block}

  /* ---- reorder sheet ----
     Dragging the real cards put the target off screen. A card is 450-660px
     against 667-812px of phone, so moving an exercise three places meant
     hauling it through some 2000px of edge-scrolling list at something you
     could not see - which is what made placing one hard. The old code says as
     much in its own comments: the vacated slot had to be collapsed to 56px
     "or the neighbours around it stay off screen".

     Here the whole day is a list of 58px rows. Every destination is visible at
     once, the longest drag is about 300px, and there is no hold to wait out:
     inside a sheet that exists only to reorder, touching the handle means
     dragging. */
  #roList{margin-bottom:4px}
  .rorow{display:flex;align-items:center;gap:10px;background:var(--card-2);
    border:1px solid var(--line-2);border-radius:2px;margin-bottom:6px;padding-right:12px}
  .rorow.ro-skip{opacity:.55}
  .rorow.ro-drag{border-color:var(--signal);position:relative;z-index:1;
    box-shadow:0 8px 22px rgba(8,11,14,.45)}
  .rohint{font-family:var(--mono);font-size:13px;color:var(--ink-3);margin:-4px 0 10px}
  /* Reads as its own zone rather than as dots floating at the edge of the row,
     because it is the only part of the row where touch-action is none - a
     touch a few pixels to the right of it belongs to the browser, not to us. */
  .rogrip{flex:none;width:48px;height:58px;display:flex;align-items:center;justify-content:center;
    background:var(--field);border-right:1px solid var(--line-2);border-radius:2px 0 0 2px;
    touch-action:none;cursor:grab}
  /* Two things the handle got wrong at first. It was painted in --line, the
     faintest token in the palette, so it read as a divider rather than a
     control - nothing on the row said "drag me". And the <svg> inside it was
     the hit-test target, which is the element touch-action is resolved
     against; pointer-events:none hands the gesture to the handle itself. */
  .rogrip svg{width:13px;height:21px;fill:var(--ink-3);display:block;pointer-events:none}
  .roline{min-width:0;flex:1}
  .rotag{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-3)}
  .roname{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Arrows as well as dragging. A drag is one gesture for a long move, but it
     is also the gesture a phone is worst at: sweaty hands, a moving target,
     and a browser that may claim the swipe as a scroll. A tap cannot be
     misread, and it places exactly. */
  .roup,.rodown{flex:none;width:38px;height:58px;appearance:none;border:none;background:transparent;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .roup svg,.rodown svg{width:15px;height:15px;stroke:var(--ink-2);stroke-width:2.5;fill:none;
    stroke-linecap:square;pointer-events:none}
  .rodown svg{transform:rotate(180deg)}
  .roup[disabled],.rodown[disabled]{opacity:.25;cursor:default}
  /* Snapping off while typing. The browser scrolls the focused field into view and
     mandatory snapping then re-snaps to the nearest card, tugging the field
     back under the bar or off the bottom - which is the field being "a hair
     cut off" once the keyboard is up. */
  .wrap.typing{scroll-snap-type:none}
  /* Video and swap ride the muscle-tag line. That line was nearly empty and
     the buttons cost no row of their own there, which is what paid for the
     larger type below. The tag ellipsises rather than wraps, so no label can
     push them off. */
  .tagrow{display:flex;align-items:center;gap:6px;min-width:0}
  .exmain{min-width:0;flex:1}
  .tagrow .tag{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .swapBtn,.vidBtn{appearance:none;border:none;background:transparent;
    width:34px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
    text-decoration:none}
  .swapBtn svg{width:14px;height:14px;stroke:var(--ink-3);stroke-width:2;fill:none;stroke-linecap:square}
  .vidBtn svg{width:13px;height:13px;fill:var(--video)}
  .card.swapped .swapBtn svg{stroke:var(--signal)}

  /* ---- swap sheet ---- */
  .sheetBack{position:fixed;inset:0;background:rgba(8,11,14,.45);z-index:70}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-width:560px;margin:0 auto;
    background:var(--card);border-top:2px solid var(--ink);max-height:85vh;overflow-y:auto;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
  .sheetTitle{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-2);margin-bottom:10px}
  .opt{display:block;width:100%;text-align:left;appearance:none;background:transparent;border:1px solid var(--line-2);
    border-radius:2px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-family:var(--sans);color:var(--ink)}
  .opt .oname{font-size:15px;font-weight:700}
  .opt .ometa{font-family:var(--mono);font-size:13px;color:var(--ink-3);margin-top:2px}
  .opt .ospinal{font-family:var(--mono);font-size:13px;color:var(--deload);margin-top:2px}
  .opt[aria-pressed="true"]{border-color:var(--signal);outline:1px solid var(--signal);outline-offset:-1px}
  .opt[aria-pressed="true"] .oname::after{content:" · current";color:var(--signal);
    font-size:13px;font-family:var(--mono);font-weight:600}
  .opt.skipOpt{margin-top:14px;border-color:var(--deload)}
  .opt.skipOpt .oname{color:var(--deload)}
  /* Sole option in the day sheet, so no separating margin above it. */
  .opt.daySkipOpt{border-color:var(--deload)}
  .opt.daySkipOpt .oname{color:var(--deload)}
  .tag{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  /* The name was 19px while the active set's number is 21px - the title read
     smaller than the data under it. It leads the card, so it leads the scale. */
  .exname{font-size:23px;font-weight:700;letter-spacing:-.015em;margin:2px 0 2px;line-height:1.15}
  /* Prescription and suggestion are one statement - what to do today - and had
     been sitting either side of the cue, which answers a different question on a
     different clock. The suggestion leads because it is the part that moves. */
  .todo{display:flex;align-items:flex-start;
    border-left:2px solid var(--signal);padding:7px 0 7px 9px;margin-bottom:10px}
  .todo.warn{border-left-color:var(--deload)}
  .todoline{min-width:0;flex:1}
  .say{font-family:var(--mono);font-size:21px;color:var(--ink);line-height:1.3}
  .todo.warn .say{color:var(--deload)}
  /* Sets, reps and RIR are what he works to, not metadata about the card, and
     they were the smallest thing on it. Instruction size, same as the cue. */
  .prescribe{font-family:var(--mono);font-size:17px;color:var(--ink-3);margin-top:3px}
  /* Subordinate to the instruction above it, and collapsed once the exercise has
     history in this block - which is what "New." was reaching for, computed
     rather than typed. See cue-policy.md §3. */
  .cue{font-size:17px;color:var(--ink-2);background:var(--cue-bg);border-left:2px solid var(--line);
    padding:7px 9px;margin:0 0 10px}
  details.cuewrap{margin:0 0 10px}
  details.cuewrap .cue{margin:6px 0 0}
  details.cuewrap > summary{list-style:none;cursor:pointer;font-family:var(--mono);font-size:15px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:3px 0}
  details.cuewrap > summary::-webkit-details-marker{display:none}
  details.cuewrap > summary::after{content:" +";color:var(--line)}
  details.cuewrap[open] > summary::after{content:" \2212";color:var(--line)}

  /* ---- set rows ---- */
  .hdr{display:grid;grid-template-columns:28px 1fr 1fr 46px;gap:8px;align-items:center;
    font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-bottom:4px}
  .row{display:grid;grid-template-columns:28px 1fr 1fr 46px;gap:8px;align-items:center;
    padding:5px 0;border-top:1px solid var(--line-2)}

  /* Active set: the next one due. Grows a little and takes a blue edge; the
     inactive rows keep their 44px touch targets rather than shrinking. */
  /* Full-bleed to the card edges. The active row is marked by its tint, its
     larger fields and its blue set number - a left-edge bar on top of those
     anchored one side only and made the column read staggered. */
  .row.active{background:var(--active-bg);margin:0 -12px;padding:5px 12px}
  .row.active .setno{color:var(--signal);font-weight:700}
  .row.active input[type=number]{padding:14px 8px;font-size:21px}
  .row.active .chk{height:48px}
  @media (prefers-reduced-motion:no-preference){
    .row{transition:background .15s}
    .row input[type=number]{transition:padding .15s,font-size .15s}
  }
  /* The weight/reps columns carry a 15px ghost line under the input (2px
     padding + 13px min-height); offset the other columns by the same amount
     so everything centers on the input row, not the input+ghost stack. */
  .setno{font-family:var(--mono);font-size:15px;color:var(--ink-3);text-align:center;margin-bottom:17px}
  .fieldwrap{position:relative}
  /* Sans, not mono, for the logged numbers. Each sits centred in its own grid
     cell, so nothing needed monospace to align - the grid already did that -
     and mono faces run lighter and narrower, which is the thinness that made
     them hard to read at a glance mid-set. tabular-nums keeps the digits even.
     Mono stays on the clocks, where digits change in place and would jitter. */
  input[type=number]{width:100%;appearance:none;-moz-appearance:textfield;border:1px solid var(--line);
    background:var(--field);border-radius:2px;padding:11px 8px 11px;font-family:var(--sans);font-size:19px;
    font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);text-align:center;
    scroll-margin-top:86px;scroll-margin-bottom:24px}
  /* The start/last hint was never styled, so it inherited a dim browser grey.
     It stays clearly dimmer than a typed value: a hint must never be mistaken
     for a logged number. Brighter on the active row, which is the one you read. */
  input[type=number]::placeholder{color:var(--placeholder);font-weight:600}
  .row.active input[type=number]::placeholder{color:var(--ink-3)}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input:focus{outline:2px solid var(--signal);outline-offset:-1px;border-color:var(--signal)}
  .ghost{display:block;font-family:var(--mono);font-size:13px;color:var(--ink-3);text-align:center;padding-top:2px;min-height:15px}
  .chk{width:46px;height:44px;border:1px solid var(--line);background:var(--field);border-radius:2px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;margin-bottom:17px}
  .chk svg{width:18px;height:18px;stroke:var(--line);stroke-width:3;fill:none;stroke-linecap:square}
  .chk[aria-pressed="true"]{background:var(--logged);border-color:var(--logged)}
  .chk[aria-pressed="true"] svg{stroke:#fff}
  .row.logged input{color:var(--ink-2);background:var(--field-logged)}

  .row.noweight{box-shadow:inset 0 0 0 1px var(--deload)}
  .row.noweight .setno{color:var(--deload)}
  .row.noweight .ghost{color:var(--deload)}

  /* The Done button only has to dismiss the keyboard - the note saves as you
     type - so it stays out of the way until the field is actually in use.
     visibility rather than display keeps its space reserved, or the textarea
     would resize under your thumb mid-sentence. */
  /* On the card the note is a DISPLAY, not a field. Typing into a one-line
     band at the foot of a card meant writing blind: the keyboard covers most of
     what has been written, and the band grew a line at a time under the thumb.
     Tapping it opens the sheet, where there is room to see the whole thing. */
  /* The card's second snap point - see the scroll-snap note at the top. The
     margin is the card's own bottom padding, so the position lands on the edge
     of the card rather than shaving it. */
  .notebtn{scroll-snap-align:end;scroll-margin-bottom:4px;
    display:block;width:100%;text-align:left;appearance:none;background:transparent;
    border:none;border-top:1px solid var(--line-2);margin-top:6px;padding:11px 2px;
    font-family:var(--sans);font-size:15px;line-height:1.45;color:var(--placeholder);
    cursor:pointer;white-space:pre-wrap;overflow-wrap:anywhere}
  .notebtn.has{color:var(--ink-2)}
  .noteEdit{width:100%;min-height:180px;border:1px solid var(--line-2);border-radius:2px;
    background:var(--field);color:var(--ink);font-family:var(--sans);font-size:17px;
    line-height:1.45;padding:11px;resize:none}
  .noteEdit:focus{outline:1px solid var(--signal);outline-offset:-1px}
  /* Sticky, because both sheets that use it can outgrow the sheet: six rows of
     reorder already scroll at 667px, and the note editor loses most of its
     height to the keyboard. Done should never be the thing you have to scroll
     for. */
  .sheetDone{position:sticky;bottom:0;display:block;width:100%;appearance:none;
    border:1px solid var(--line-2);background:var(--card-2);color:var(--ink);border-radius:2px;
    margin-top:10px;padding:13px;font-family:var(--mono);font-size:15px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;cursor:pointer}

  /* ---- progression suggestion + feedback ---- */
  .fbrow{display:flex;align-items:center;gap:5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line-2)}
  .fb{appearance:none;border:none;background:var(--card-2);color:var(--ink-3);
    font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:13px 10px;border-radius:4px;cursor:pointer}
  /* Only the chosen value carries colour. Three lit buttons on a card that
     already holds a cue box and a play control is noise. */
  .fb[data-fb="easy"][aria-pressed="true"]  {background:var(--eff-1);color:var(--eff-1-ink)}
  .fb[data-fb="right"][aria-pressed="true"] {background:var(--eff-2);color:var(--eff-2-ink)}
  .fb[data-fb="brutal"][aria-pressed="true"]{background:var(--eff-3);color:var(--eff-3-ink)}
  /* Pain is not a fourth effort value - it is an independent boolean that can be
     set alongside any of them. Pushed out of the group behind a rule and drawn
     as a checkbox rather than a peer button, so the row stops reading pick-one. */
  .fbsep{width:1px;align-self:stretch;background:var(--line-2);margin-left:auto;flex:none}
  .fbpain{display:flex;align-items:center;gap:7px;background:transparent;padding:13px 2px 13px 9px;
    color:var(--ink-3)}
  .fbpain::before{content:"";width:15px;height:15px;flex:none;border-radius:3px;
    border:1.5px solid var(--line);background:transparent}
  .fbpain[aria-pressed="true"]{color:var(--alarm);background:transparent}
  .fbpain[aria-pressed="true"]::before{background:var(--alarm);border-color:var(--alarm);
    box-shadow:inset 0 0 0 2.5px var(--card)}

  /* ---- volume sheet ---- */
  /* The tail of the page needs snap points too: under mandatory snapping a
     resting position must BE one, so without these the scroll springs back
     to the last card and the volume table and footer - export, import,
     reset - can never be reached. */
  .vol,.foot{scroll-snap-align:start;scroll-snap-stop:always;scroll-margin-top:78px}
  .vol{margin:18px 14px 0;border-top:1px solid var(--line)}
  .vol summary{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-2);padding:12px 0;cursor:pointer;list-style:none}
  .vol summary::-webkit-details-marker{display:none}
  .vol summary::after{content:" +";color:var(--ink-3)}
  .vol[open] summary::after{content:" –"}
  .voltbl{display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;font-family:var(--mono);font-size:13px;padding-bottom:14px}
  .voltbl div{padding:3px 0;border-bottom:1px solid var(--line-2)}
  .voltbl .h{color:var(--ink-3);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
  .bar{height:6px;background:var(--signal);display:inline-block;vertical-align:middle}
  .foot{padding:22px 14px 96px;font-size:13px;color:var(--ink-3);line-height:1.5}
  .build{margin-top:16px;font-family:var(--mono);font-size:13px;color:var(--ink-3);opacity:.7;
    letter-spacing:.04em;display:block;appearance:none;background:none;border:none;padding:6px 0;
    text-align:left;cursor:pointer;border-bottom:1px dashed var(--line-2);-webkit-tap-highlight-color:transparent}
  .foot button{background:none;border:none;color:var(--ink-3);font-size:13px;text-decoration:underline;padding:0;cursor:pointer;font-family:var(--sans)}
  .saving{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    font-family:var(--mono);font-size:13px;letter-spacing:.08em;padding:7px 14px;border-radius:2px;opacity:0;
    transition:opacity .18s;pointer-events:none;z-index:40}
  .saving.on{opacity:1}
  @media (prefers-reduced-motion:no-preference){.bigbtn{transition:transform .12s}}
  /* Kills animation as well as transition - the earlier version only stopped
     transitions, which would have let any keyframe through. */
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>

<div class="wrap">
  <header>
    <div class="brandrow">
      <div class="brand">Meso Tracker</div>
      <div class="hright">
        <div class="rir" id="rirLabel"></div>
        <button class="themeBtn" id="themeBtn" aria-label="Color theme">auto</button>
      </div>
    </div>
    <div class="seg weeks" id="weekSeg"></div>
    <div class="seg days" id="daySeg"></div>
    <div class="daymeta"><span id="dayFocus"></span></div>
    <button class="bigbtn startBtn" id="startBtn" hidden>▸ Start session</button>
  </header>
  <div class="dash">
    <button class="dcell" id="sessBtn" aria-label="Session stopwatch: tap to start or stop">
      <span class="dlabel">Session</span><span class="dval" id="sessVal">0:00</span>
    </button>
    <button class="dcell" id="restBtn" aria-label="Rest stopwatch: tap to start or stop">
      <span class="dlabel">Rest</span><span class="dval" id="restVal">0:00</span>
    </button>
    <div class="dcell count" id="setsCell">
      <span class="dlabel">Sets left</span><span class="dval" id="setsLeft">0</span>
    </div>
  </div>
  <div id="bannerSlot"></div>
  <div id="days"></div>
  <div class="endwrap">
    <button class="bigbtn endBtn" id="endBtn"></button>
    <button class="bigbtn reportBtn" id="reportBtn">Send report to a chat</button>
  </div>
  <details class="vol">
    <summary>Weekly sets by muscle</summary>
    <div class="voltbl" id="volTbl"></div>
  </details>
  <div class="foot">
    Log working sets only — keep warm-ups off the sheet. Hit the top of the rep range on every set at the
    target RIR and add load next week; otherwise repeat the weight and chase reps.
    <br><br>
    <button id="exportBtn">Export data</button> ·
    <button id="importBtn">Import data</button> ·
    <button id="resetBtn">Clear all logged data</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <button class="build" id="buildLine"></button>
  </div>
</div>
<div class="saving" id="toast">SAVED</div>
<div id="swapSheet" hidden>
  <div class="sheetBack"></div>
  <div class="sheet">
    <div class="sheetTitle" id="swapTitle"></div>
    <div id="swapOpts"></div>
  </div>
</div>

// Apply a forced theme before first paint so dark mode doesn't flash light.
try{
  const t = JSON.parse(localStorage.getItem("meso-tracker"))?.settings?.theme;
  if(t==="dark"||t==="light") document.documentElement.dataset.theme = t;
}catch(e){}

      equipment:["machine"], unit:"", spinalLoad:"low" }
  ]
};
/* The loads that actually exist on the gym's dumbbell rack. Uniform fives except for
   the 12, which is what makes a single step wrong (see spec §2). Nothing below 10 is
   listed because nothing below 10 gets used. */
LIBRARY.racks = { dumbbell: [10,12,15,20,25,30,35,40,45,50,55,60,65,70,75,80] };

const LIB_EX = new Map(LIBRARY.exercises.map(e=>[e.id,e]));

/* ---- program ----
   Set counts per week, starting loads, and rep/cue overrides are the training
   plan and live here. Everything else about an exercise (name, muscle, unit,
   equipment, slot, spinal load) resolves from LIBRARY by id. Rep precedence:
   PROGRAM reps override > library exercise reps > slot defaultReps. A PROGRAM
   cue overrides the library cue. */
/* sec.13: a block is a PROGRAM plus its logged data, so PROGRAMS is keyed by
   block id and PROGRAM is rebound when the viewed block changes. The app NEVER
   generates one - a second block cannot be created until a PROGRAM for it is
   authored here, which is what makes sec.13.1's create action unavailable. */
const PROGRAMS = {};
let PROGRAM;

PROGRAMS.meso01 = {
  weeks: [
    {n:1, rir:"3", note:null},
    {n:2, rir:"2", note:null},
    {n:3, rir:"1", note:null},
    {n:4, rir:"4–5", note:"Deload. Sets are cut roughly in half and load drops to about 65–70% of week 3. Move well, leave everything in the tank, keep the runs easy."}
  ],
  days: [
    {key:"mon", label:"Mon", focus:"Push", ex:[
      {id:"inc_db_press", sets:[3,3,4,2], start:25},
      {id:"db_shoulder_press", sets:[3,3,3,2], start:25},
      {id:"machine_flye", sets:[2,3,3,1], start:70},
      {id:"cable_pushdown_bar", sets:[3,3,3,2], start:60},
      {id:"db_lateral_raise", sets:[3,3,4,2], start:10},
      {id:"cable_facepull", sets:[3,3,4,2], start:50}
    ]},
    {key:"wed", label:"Wed", focus:"Pull · quads", ex:[
      {id:"bb_squat_high", sets:[3,3,3,2], start:85},
      {id:"lat_pulldown", sets:[3,3,4,2], start:null},
      {id:"row_chest_supported", sets:[3,3,3,2], start:null},
      {id:"ez_preacher_curl", sets:[3,3,3,2], start:45},
      {id:"db_curl_incline", sets:[3,3,3,2], start:15},
      {id:"leg_extension", sets:[2,2,3,1], start:45},
      {id:"pushup", sets:[2,2,2,1], start:0, reps:"2 shy of failure"}
    ]},
    {key:"fri", label:"Fri", focus:"Shoulders · hamstrings", ex:[
      {id:"db_upright_row", sets:[3,3,3,2], start:20, reps:"10–15"},
      {id:"cable_rear_delt_flye", sets:[3,3,4,2], start:null},
      {id:"row_db_single", sets:[3,3,3,2], start:null},
      {id:"machine_flye", sets:[3,3,3,2], start:70},
      {id:"bb_good_morning", sets:[3,3,3,2], start:65},
      {id:"leg_curl_seated", sets:[2,2,3,1], start:null},
      {id:"ez_curl_wide", sets:[3,3,3,2], start:40},
      {id:"pushup", sets:[2,2,2,1], start:0, reps:"2 shy of failure"}
    ]}
  ]
};

// Bound before load() runs so nothing can read an undefined PROGRAM.
PROGRAM = PROGRAMS.meso01;

// The library entry actually occupying a program slot on a given day —
// the swap replacement if one is stored (and still exists), else the original.
function effectiveLib(dayKey, programId){
  const sw = (LOG.swaps[dayKey] || {})[programId];
  return LIB_EX.get(sw && LIB_EX.has(sw) ? sw : programId);
}

/* A PROGRAM entry resolved against the library into everything the UI needs.
   When the slot is swapped, the replacement brings its own reps/cue/start:
   the PROGRAM overrides were written for the original exercise, so they only
   apply while the original occupies the slot. Set counts always come from
   PROGRAM — the training plan owns volume regardless of what fills the slot. */
function resolveEx(p, dayKey){
  const lib = effectiveLib(dayKey, p.id);
  const swapped = lib.id !== p.id;
  /* The slot a substitute FILLS, not the slot it belongs to. Identical for
     every same-slot swap, and it only diverges under a sec.14 neighbourhood -
     leg_press is quad_squat by taxonomy but fills quad_isolation. sec.14 rules
     that it substitutes "at the slot's 15-20 reps as a finisher", so the rep
     range has to follow the slot being filled; its own slot would hand it
     8-12 and make it a different exercise than the one ruled acceptable. */
  const origin = LIB_EX.get(p.id);
  const fills = (origin && origin.slot) || lib.slot;
  return {
    programId: p.id, id: lib.id, swapped,
    // §13.2: PROGRAM start wins; a seed fills only where PROGRAM is silent.
    sets: p.sets, start: swapped ? null : (p.start ?? LOG.seeds?.[p.id] ?? null),
    name: lib.name, muscle: lib.muscle, unit: lib.unit,
    slot: fills, equipment: lib.equipment, spinalLoad: lib.spinalLoad,
    loadSense: lib.loadSense,          // absent → the engine defaults it to "weight"
    reps: (!swapped ? p.reps : null) ?? lib.reps ?? LIBRARY.slots[fills].defaultReps,
    cue: (!swapped ? p.cue : null) ?? lib.cue ?? null
  };
}

/* ---- storage ----
   Everything lives under one localStorage key as a versioned envelope:
   { schemaVersion, updatedAt, settings, timers, mesos: { <mesoId>: { sets, notes, order, swaps } } }
   settings: { theme: "auto" | "light" | "dark", week, day } — week and day
   are where you left off, so a launch resumes instead of resetting to week 1.
   timers:   { sessionStart, sessionAccum, sessionDay, restStart } — UI state,
   not training data. The session clock pauses, so elapsed is
   sessionAccum + (sessionStart ? now - sessionStart : 0): banked time plus the
   current run. sessionStart null with sessionAccum > 0 means paused.
   sets:  "week|day|exercise id|setIdx" -> {weight, reps, done}  (weight/reps: number or null)
   daySkips: "week|day" -> true. A whole session set aside. It is a blanket
   over the day rather than a bulk write of the map below: the individual
   skips underneath are left untouched, so putting the day back restores
   exactly what was already set aside, and the blanket still covers an
   exercise that gets swapped while the day is skipped.
   skips:   "week|day|exercise id" -> true. An exercise deliberately set aside
   for that day: its sets stop counting toward the day being finished, and it
   keeps no data, so the following week reads through it to the last week that
   has some (spec sec.1 reference week).
   warmups: "week|day|exercise id|idx" -> {weight, reps}. No longer read or
   written - the warm-up section came out after a block of going unused. The
   map is kept rather than migrated away because whatever was recorded in it
   is logged evidence, and tidying a dead key is not worth destroying that.
   notes: "week|day|exercise id" -> string
   order: dayKey -> [program exercise ids], drag-to-reorder override of PROGRAM order
   swaps: dayKey -> { programExId: replacementExId }, same-slot substitutions.
   feedback: "week|day|exercise id" -> {effort, pain}; effort "easy"|"right"|"brutal".
   Feedback is optional and additive: absence is treated as "right" at READ
   time only — stored absence and a stored explicit "right" stay distinct.
   Sets/notes key by the EFFECTIVE (displayed) id, so each exercise keeps its
   own history and swapping back restores it; order and swaps key by the
   PROGRAM id, which names the slot occupant and never changes.
   Keyed by stable library exercise id (since v4; names before that), so
   renames, reorders and swaps never mislabel old logs.
   Bump SCHEMA_VERSION and add MIGRATIONS[oldVersion] when the shape changes. */
const STORE_KEY = "meso-tracker";
const SCHEMA_VERSION = 13;
const SPEC_VERSION = "1.9";      // load-progression-spec.md; bump both together
const FIRST_MESO = "meso01";
// The block being viewed. Equal to settings.activeMeso except while looking at
// a closed block, which sec.13.6 makes read-only rather than merely non-default.
let VIEW_MESO = FIRST_MESO;
const activeMeso = () => STORE.settings.activeMeso || FIRST_MESO;
const viewingActive = () => VIEW_MESO === activeMeso();

/* v3 -> v4: exact display-name -> library-id table for every exercise that has
   ever appeared in PROGRAM. No fuzzy matching — a key segment either matches a
   row here verbatim or the key is left untouched (with a console warning). */
const NAME_TO_ID = {
  "Incline Dumbbell Press":            "inc_db_press",
  "Dumbbell Shoulder Press (Seated)":  "db_shoulder_press",
  "Machine Flye":                      "machine_flye",
  "Cable Triceps Pushdown (Bar)":      "cable_pushdown_bar",
  "Dumbbell Lateral Raise":            "db_lateral_raise",
  "Cable Rope Facepull":               "cable_facepull",
  "Barbell Squat (High Bar)":          "bb_squat_high",
  "Lat Pulldown":                      "lat_pulldown",
  "Chest-Supported Row":               "row_chest_supported",
  "EZ Bar Preacher Curl":              "ez_preacher_curl",
  "Dumbbell Curl (Incline)":           "db_curl_incline",
  "Leg Extension":                     "leg_extension",
  "Push-Up":                           "pushup",
  "Dumbbell Upright Row":              "db_upright_row",
  "Cable Rear Delt Flye":              "cable_rear_delt_flye",
  "Single-Arm Dumbbell Row":           "row_db_single",
  "Barbell Good Morning (High Bar)":   "bb_good_morning",
  "Seated Leg Curl":                   "leg_curl_seated",
  "EZ Bar Curl (Wide Grip)":           "ez_curl_wide"
};

// MIGRATIONS[n] upgrades a store from schemaVersion n to n+1.
const MIGRATIONS = {
  // v2 added per-day exercise order overrides
  1: s => { Object.values(s.mesos).forEach(m => { m.order = m.order || {}; }); return s; },
  // v3 added app settings (theme)
  2: s => { s.settings = s.settings || {theme:"auto"}; return s; },
  // v4 rekeyed sets/notes/order from display names to library ids
  3: s => {
    backupRaw(JSON.stringify(s));
    const warn = k => { if(!LIB_EX.has(k)) console.warn(`meso-tracker v3→v4: no id mapping for "${k}" — left as-is`); };
    const rekey = (obj, nameAt) => {
      const out = {};
      Object.entries(obj || {}).forEach(([k,v])=>{
        const p = k.split("|");
        if(p.length > nameAt && NAME_TO_ID[p[nameAt]]){
          p[nameAt] = NAME_TO_ID[p[nameAt]];
          out[p.join("|")] = v;
        }else{
          if(p.length > nameAt) warn(p[nameAt]);
          out[k] = v;
        }
      });
      return out;
    };
    Object.values(s.mesos).forEach(m=>{
      m.sets  = rekey(m.sets, 2);
      m.notes = rekey(m.notes, 2);
      Object.keys(m.order || {}).forEach(d=>{
        m.order[d] = m.order[d].map(n => { if(NAME_TO_ID[n]) return NAME_TO_ID[n]; warn(n); return n; });
      });
    });
    return s;
  },
  // v5 added per-day same-slot exercise swaps
  4: s => { Object.values(s.mesos).forEach(m => { m.swaps = m.swaps || {}; }); return s; },
  // v6 added per-exercise progression feedback. Purely additive: an empty
  // container only — no defaults backfilled, logged sets untouched.
  5: s => {
    backupRaw(JSON.stringify(s));
    Object.values(s.mesos).forEach(m => { m.feedback = m.feedback || {}; });
    return s;
  },
  // v7 added the session and rest stopwatches. Envelope-level UI state, not
  // training data: two timestamps or null, nothing per-meso touched.
  6: s => { s.timers = s.timers || {sessionStart:null, restStart:null}; return s; },
  // v8 made the session clock pausable, which a lone start timestamp cannot
  // express: banked time and the day it belongs to are additive fields.
  7: s => {
    const t = s.timers = s.timers || {};
    if(t.sessionStart === undefined) t.sessionStart = null;
    if(t.restStart === undefined) t.restStart = null;
    t.sessionAccum = t.sessionAccum || 0;
    // A v7 session already running has no day stamp; derive it from its own
    // start, or it would keep counting straight through tomorrow.
    if(!t.sessionDay && t.sessionStart){
      const d = new Date(t.sessionStart), z = v => String(v).padStart(2,"0");
      t.sessionDay = d.getFullYear() + "-" + z(d.getMonth()+1) + "-" + z(d.getDate());
    }
    t.sessionDay = t.sessionDay || null;
    return s;
  },
  // v9 added warm-up sets in their own map, so they never reach the
  // progression engine, the set counter or the active-set marker.
  8: s => { Object.values(s.mesos).forEach(m => { m.warmups = m.warmups || {}; }); return s; },
  // v10 remembers the week and day you were last on.
  9: s => {
    s.settings = s.settings || {};
    if(s.settings.week === undefined) s.settings.week = 1;
    if(s.settings.day === undefined) s.settings.day = "mon";
    return s;
  },
  // v11 added skipped exercises.
  10: s => { Object.values(s.mesos).forEach(m => { m.skips = m.skips || {}; }); return s; },
  // v12 added skipped days. Purely additive: an absent map is an empty one,
  // so nothing already logged changes meaning.
  11: s => { Object.values(s.mesos).forEach(m => { m.daySkips = m.daySkips || {}; }); return s; },
  /* v13 opened the door to more than one block (sec.13). The existing meso keeps
     its id, names the PROGRAM it was always running, and becomes the active one.
     Additive: a single-block store means exactly what it meant before. */
  12: s => {
    s.settings = s.settings || {};
    s.settings.activeMeso = s.settings.activeMeso || "meso01";
    Object.entries(s.mesos).forEach(([id, m]) => {
      m.program = m.program || id;
      m.seeds = m.seeds || {};
    });
    return s;
  }
};

function freshStore(){
  return {schemaVersion:SCHEMA_VERSION, updatedAt:null, settings:{theme:"auto"},
          timers:{sessionStart:null, sessionAccum:0, sessionDay:null, restStart:null}, mesos:{}};
}

function migrate(store){
  while(store.schemaVersion < SCHEMA_VERSION){
    const step = MIGRATIONS[store.schemaVersion];
    if(!step){ backupRaw(JSON.stringify(store)); return freshStore(); }
    store = step(store);
    store.schemaVersion++;
  }
  return store;
}

// Parked, never overwritten by the app — recoverable by hand if something goes wrong.
function backupRaw(raw){ try{ localStorage.setItem(STORE_KEY+".backup", raw); }catch(e){} }

const storage = {
  async get(){
    const raw = localStorage.getItem(STORE_KEY);
    if(raw === null) return freshStore();
    let s = null;
    try{ s = JSON.parse(raw); }catch(e){}
    if(!s || typeof s !== "object" || typeof s.schemaVersion !== "number"){
      backupRaw(raw);
      return freshStore();
    }
    return migrate(s);
  },
  async set(store){
    store.updatedAt = new Date().toISOString();
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  }
};

let STORE = freshStore();
let LOG = {sets:{}, notes:{}};
let W = 1, D = "mon";

const $ = id => document.getElementById(id);
const cell = (w,d,exId,s) => `${w}|${d}|${exId}|${s}`;

let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await storage.set(STORE);
      const t=$("toast"); t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),900);
    }catch(err){
      const t=$("toast"); t.textContent="NOT SAVED — RETRY"; t.classList.add("on");
      setTimeout(()=>{t.classList.remove("on");t.textContent="SAVED";},2200);
    }
  }, 500);
}

async function load(){
  STORE = await storage.get();
  STORE.settings = STORE.settings || {theme:"auto"};
  // Resume where we left off, refusing anything the PROGRAM no longer contains.
  const dayKeys = PROGRAM.days.map(d => d.key);
  const savedW = Number(STORE.settings.week);
  W = (savedW >= 1 && savedW <= PROGRAM.weeks.length) ? savedW : 1;
  D = dayKeys.includes(STORE.settings.day) ? STORE.settings.day : dayKeys[0];

  STORE.timers = STORE.timers || {sessionStart:null, sessionAccum:0, sessionDay:null, restStart:null};
  // A session belongs to a day, so yesterday's never greets you paused today.
  if(STORE.timers.sessionDay && STORE.timers.sessionDay !== todayKey()){
    STORE.timers.sessionStart = null; STORE.timers.sessionAccum = 0; STORE.timers.sessionDay = null;
  }
  // A rest clock still running hours later was forgotten, not rested.
  if(STORE.timers.restStart && Date.now() - STORE.timers.restStart > 6*3600*1000) STORE.timers.restStart = null;
  STORE.settings.activeMeso = STORE.settings.activeMeso || FIRST_MESO;
  if(!STORE.mesos[activeMeso()]) STORE.mesos[activeMeso()] = freshBlock(FIRST_MESO);
  bindBlock(activeMeso());
  LOG.sets = LOG.sets || {};
  LOG.notes = LOG.notes || {};
  LOG.order = LOG.order || {};
  LOG.swaps = LOG.swaps || {};
  LOG.feedback = LOG.feedback || {};
  LOG.warmups = LOG.warmups || {};
  LOG.skips = LOG.skips || {};
  LOG.daySkips = LOG.daySkips || {};
  LOG.seeds = LOG.seeds || {};
}

function freshBlock(programId){
  return {program: programId, sets:{}, notes:{}, order:{}, swaps:{}, feedback:{},
          warmups:{}, skips:{}, daySkips:{}, seeds:{}};
}

/* Point LOG and PROGRAM at one block. Everything downstream reads through
   these two, which is what keeps sec.13.3's boundary structural: weekSets can
   only ever be assembled from the block currently bound. */
/* §13.1 create block N+1. Order is fixed by the spec: add, seed, carry over,
   activate - and nothing in any prior block is read for anything but seeding,
   nor written at any step.

   Returns a reason rather than throwing, because the caller is a UI action that
   §13.1 requires to be unavailable when no PROGRAM has been authored. */
function createBlock(newId, programId){
  if(STORE.mesos[newId])   return {ok:false, why:"a block with that id already exists"};
  if(!PROGRAMS[programId]) return {ok:false, why:"no PROGRAM has been authored for that block"};
  const prog = PROGRAMS[programId];
  const from = STORE.mesos[activeMeso()];
  const blk  = freshBlock(programId);

  // §13.2. Sets key by week|day|exerciseId, and the spec seeds on exercise id
  // ALONE - the new PROGRAM may well place it on a different day - so bucket
  // the outgoing block by week and id, ignoring which day it was logged on.
  const byWeekEx = {};
  Object.entries((from && from.sets) || {}).forEach(([k, v]) => {
    const [w, , exId] = k.split("|");
    (byWeekEx[`${w}|${exId}`] = byWeekEx[`${w}|${exId}`] || []).push(v);
  });
  const named = {};
  prog.days.forEach(d => d.ex.forEach(e => { named[e.id] = e.start ?? null; }));
  Object.keys(named).forEach(id => {
    if(named[id] != null) return;               // PROGRAM named one; nothing to seed
    const weeks = {};
    for(let w = 1; w <= 3; w++) weeks[w] = byWeekEx[`${w}|${id}`] || [];
    const seed = seedLoad(weeks, null);
    if(seed != null) blk.seeds[id] = seed;
  });

  // §13.4. order is the only thing that carries: keep the relative order of ids
  // the new PROGRAM still contains, then append its new ones in PROGRAM order.
  prog.days.forEach(d => {
    const progIds = d.ex.map(e => e.id);
    const prev = ((from && from.order) || {})[d.key] || [];
    const kept = prev.filter(id => progIds.includes(id));
    const merged = [...kept, ...progIds.filter(id => !kept.includes(id))];
    if(merged.join("|") !== progIds.join("|")) blk.order[d.key] = merged;
  });

  STORE.mesos[newId] = blk;
  STORE.settings.activeMeso = newId;
  bindBlock(newId);
  W = 1; D = PROGRAM.days[0].key;
  STORE.settings.week = W; STORE.settings.day = D;
  save();
  return {ok:true, id:newId, seeded:Object.keys(blk.seeds).length,
          carriedOrder:Object.keys(blk.order).length};
}

/* §13.6. Viewing a closed block never writes to it. The disabled attribute on
   the fields is the visible half; this is the half that catches every other
   write path - check-off, swap, skip, note, feedback - since the
   rationale is that a mis-tap must not silently corrupt earlier evidence. */
function refuseIfClosed(){ return !viewingActive(); }

function bindBlock(id){
  const blk = STORE.mesos[id];
  if(!blk) return false;
  const prog = PROGRAMS[blk.program] || PROGRAMS[FIRST_MESO];
  if(!prog) return false;
  VIEW_MESO = id; LOG = blk; PROGRAM = prog;
  return true;
}

/* ---- load progression rule engine ----
   Encodes load-progression-spec.md verbatim — SPEC_VERSION names which
   revision. Pure function: plain data
   in, the §5.1 contract out — {class, outcome, load, text}. No DOM, no
   storage, no globals; callable from a console.
   §5.1 invariant: `class` is non-null if and only if `outcome` came from the
   §8 matrix. Every path that short-circuits inside §6 returns class null.
   `weekSets` maps week number → that week's logged sets; the suggestion for
   week N reads week N−1, and §7/§7.1's deload cascades walk weeks 3, 2, 1.
   `step` must already include any per-exercise override. */
const WEEK_RIR_TEXT = {1:"3", 2:"2", 3:"1", 4:"4–5"};

/* §13.2 seeding. Pure: the outgoing block's weeks 1-3 for ONE exercise id,
   plus whatever the new PROGRAM names as that exercise's start.

   Authoring beats inference, so a PROGRAM start short-circuits before any
   look-back. Week 4 is never read - seeding off a deload would open the new
   block roughly 30% light. Empty loading weeks are walked back through the way
   §1's reference week walks.

   A mixed-load week has no `workingLoad` by §1's definition, so it yields no
   seed rather than a guess. v1.9 does not cover that case; this is the literal
   reading, not an invented rule. */
function seedLoad(outgoingWeekSets, programStart){
  if(programStart !== null && programStart !== undefined) return programStart;
  for(let w = 3; w >= 1; w--){
    const q = ((outgoingWeekSets && outgoingWeekSets[w]) || [])
      .filter(s => typeof s.reps === "number" && s.reps > 0);
    if(!q.length) continue;
    const loads = [...new Set(q.map(s => s.weight))];
    return loads.length === 1 ? loads[0] : null;
  }
  return null;
}

/* §1 reference week: the most recent prior week that actually holds sets. Normally
   the week before, but it steps back past ones skipped or never logged rather than
   treating the exercise as new. It steps back only where nothing was RECORDED: a skip
   does not hide sets already logged (v1.8, decided). A partially logged week that was
   then skipped is still the reference, and resolves to INCOMPLETE. Shared with the caller so that prescribed and
   feedback are read from the same week the sets came from. */
function referenceWeek(weekSets, currentWeek){
  for(let w = currentWeek - 1; w >= 1; w--){
    const q = ((weekSets && weekSets[w]) || []).filter(s => typeof s.reps === "number" && s.reps > 0);
    if(q.length) return w;
  }
  return null;
}

function suggestLoad({weekSets, prescribed, range, step, rack, loadSense, feedback, currentWeek, startLoad, rir}){
  rir = rir ?? WEEK_RIR_TEXT[currentWeek] ?? "";
  const sense  = loadSense ?? "weight";                      // §1: absent → "weight"
  const effort = (feedback && feedback.effort) || "right";   // §1: absent → "right"
  const pain   = !!(feedback && feedback.pain);
  const bottom = range.bottom, top = range.top;
  /* §2: where a rack of real loads is given, the increment depends on which load you
     are holding - the dumbbells run 10, 12, 15, 20, so it is 2 from the 10s and 3 from
     the 12s. Derived here rather than assumed uniform, so the engine never suggests a
     dumbbell that does not exist. Falls back to the scalar step at either end. */
  const rackUp = l => { const r = (rack||[]).filter(v => v > l).sort((a,b)=>a-b); return r.length ? r[0]-l : null; };
  const rackDown = l => { const r = (rack||[]).filter(v => v < l).sort((a,b)=>b-a); return r.length ? l-r[0] : null; };
  const rackAtOrBelow = v => { const r = (rack||[]).filter(x => x <= v).sort((a,b)=>b-a); return r.length ? r[0] : null; };

  // §1: a set qualifies on reps > 0; the done checkbox is ignored.
  const qual = w => ((weekSets && weekSets[w]) || []).filter(s => typeof s.reps === "number" && s.reps > 0);
  /* §1 workingLoad: the weight value, if identical across all qualifying sets.
     A set with no weight recorded has no weight value, so undefined normalises
     to null here rather than comparing equal to another undefined - which had
     the engine treat "no weight at all" as a real, shared load and do
     arithmetic on it (`undefined + 5` -> NaN). */
  const oneLoad = q => {
    if(!q.length) return null;
    const w0 = q[0].weight ?? null;
    return q.every(s => (s.weight ?? null) === w0) ? w0 : null;
  };

  const ref = referenceWeek(weekSets, currentWeek);   // §1: normally N-1, further back if skipped
  const q = ref ? qual(ref) : [];
  const n = q.length, first = q[0], last = q[n-1];
  const load = oneLoad(q);
  const mixedLoad = n > 0 && load === null;

  const ret = (outcome, text, l = null, cls = null) => ({class: cls, outcome, load: l, text});

  // §7 / §7.1 — one cascade, two terminal operations.
  const deloadBase = () => {
    for(const w of [3, 2, 1]){
      const l = oneLoad(qual(w));
      if(l !== null) return l;
    }
    return startLoad ?? null;
  };

  // ---- §5 dispatch: load sense first, before any data-shape rule ----

  if(sense === "none"){                                      // §6.1
    if(currentWeek === 4)  return ret("DELOAD_BW", "deload — stop 4–5 shy of failure");
    if(pain)               return ret("PAIN_BW", "pain flagged — go easier or swap the movement");
    if(n === 0)            return ret("NO_DATA_BW", "2 shy of failure");
    if(n < prescribed)     return ret("INCOMPLETE_BW", `beat ${last.reps} — ${n} of ${prescribed} sets logged`);
    return ret("BW_PROGRESS", `beat ${last.reps} on the last set`);
  }

  if(sense === "assist"){                                    // §6.2
    if(currentWeek === 4){
      const base = deloadBase();
      if(base === null)    return ret("DELOAD_ASSIST", "deload — more assistance, stop early");
      const dl = base + step;                                // §7.1
      return ret("DELOAD_ASSIST", `${dl} — ${rir} RIR, stop early`, dl);
    }
    if(pain)               return ret("PAIN_ASSIST", "pain flagged — more assistance or swap the movement");
    if(n === 0)            return ret("NO_DATA", `find it — ${top} reps, ${rir} in reserve`);
    if(mixedLoad)          return ret("MIXED", "pick one assist level and hold it");
    if(n < prescribed)     return ret("INCOMPLETE", `repeat ${load} assist — ${n} of ${prescribed} sets logged`, load);
  }

  if(sense === "weight"){                                    // §6.3
    if(currentWeek === 4){
      const base = deloadBase();
      if(base === null)    return ret("DELOAD", `about two-thirds of your usual — ${rir} RIR, stop early`);
      const target = base * 0.70;                                        // §7
      const dl = rackAtOrBelow(target) ?? Math.max(step, Math.floor(target / step) * step);
      return ret("DELOAD", `${dl} — ${rir} RIR, stop early`, dl);
    }
    if(n === 0){
      if(startLoad != null) return ret("NO_DATA", `start ${startLoad}`, startLoad);
      return ret("NO_DATA", `find it — ${top} reps, ${rir} in reserve`);
    }
    if(pain)               return ret("PAIN", "pain flagged — go lighter or swap the movement");
    if(mixedLoad)          return ret("MIXED", "pick one weight and hold it");
    if(n < prescribed)     return ret("INCOMPLETE", `repeat ${load} — ${n} of ${prescribed} sets logged`, load);
  }

  // ---- §3 classification: sense-agnostic, reads reps only ----
  let cls = first.reps < bottom ? "P_FAIL"
          : last.reps  < bottom ? "P_DROP"
          : first.reps >= top   ? "P_PASS"
          : "P_HOLD";

  /* §4 — the two proportionality rules (this gate and §2's double-step
     clause) both compute from jumpPct, undefined for "none" and meaningless
     for "assist". One guard governs both, as the spec states it once. */
  const proportional = sense === "weight";
  const stepUp = (proportional && rackUp(load)) || step;      // §2: from this load, not in general
  const stepDown = (proportional && rackDown(load)) || step;
  let requiredReps = null, inc = stepUp;
  if(proportional){
    const jumpPct = stepUp / load;
    if(cls === "P_PASS"){
      /* This is §4 as of v1.9 - a rep-buffer requirement. Spec v2.0 REPLACES it
         with a landing check and is already merged into the document; it is not
         implemented here on purpose. A rule that newly permits 20% load jumps
         must not take effect in week 3 of a block at 1 RIR, so it ships with
         §13's block creation. Deferring costs nothing: week 4 makes no
         progression suggestions and week 1 of a new block is NO_DATA, so v2.0
         first changes a suggestion in Meso 02 week 2 either way.

         When it ships, this becomes:
             estimatedRepLoss = ceil(jumpPct / 0.03)
             landingFloor     = ceil(bottom / 2)
             if first.reps - estimatedRepLoss < landingFloor:
               requiredReps = landingFloor + estimatedRepLoss
               cls = requiredReps > top + 6 ? "P_UNPROGRESSABLE" : "P_GATED"
         and vectors 1, 4 and 33 change with it. SPEC_VERSION goes to "2.0". */
      requiredReps = bottom + Math.ceil(jumpPct / 0.03);
      if(requiredReps > top + 6)         cls = "P_UNPROGRESSABLE";
      else if(first.reps < requiredReps) cls = "P_GATED";
    }
    if(cls === "P_PASS" && jumpPct < 0.03 && first.reps >= top + 2)                    // §2
      inc = (rackUp(load + stepUp) ? stepUp + rackUp(load + stepUp) : 2 * stepUp);
  }

  // ---- §8 matrix: class × effort → outcome (P_FAIL ignores effort) ----
  const outcome =
      cls === "P_PASS"           ? (effort === "brutal" ? "HOLD_RIR" : "ADD")
    : cls === "P_GATED"          ? (effort === "brutal" ? "HOLD" : "HOLD_GATE")
    : cls === "P_UNPROGRESSABLE" ? "HOLD"
    : cls === "P_HOLD"           ? (effort === "easy" ? "HOLD_PUSH" : "HOLD")
    : cls === "P_DROP"           ? "HOLD"
    : "REDUCE";

  if(sense === "assist"){                                    // §6.2 matrix text
    switch(outcome){
      case "ADD":
        if(load === 0)       return ret("ADD", "unassisted — switch to Pull-Up", null, cls);
        if(load - inc <= 0)  return ret("ADD", `${load} ✓ → try it unassisted`, 0, cls);
        return ret("ADD", `${load} ✓ → drop assist to ${load - inc}`, load - inc, cls);
      case "REDUCE":    return ret("REDUCE", `add assist to ${load + step} — ${bottom}+ clean`, load + step, cls);
      case "HOLD_RIR":  return ret("HOLD_RIR", `repeat ${load} assist — same reps, more in reserve`, load, cls);
      case "HOLD_PUSH": return ret("HOLD_PUSH", `repeat ${load} assist — take it closer to ${rir} RIR`, load, cls);
      default:          return ret("HOLD", `repeat ${load} assist — chase ${top}+`, load, cls);
    }
  }
  switch(outcome){                                           // §8 text, sense weight
    case "ADD":       return ret("ADD", `${load} ✓ → try ${load + inc}`, load + inc, cls);
    case "HOLD_RIR":  return ret("HOLD_RIR", `repeat ${load} — same reps, more in reserve`, load, cls);
    case "HOLD_GATE": return ret("HOLD_GATE", `repeat ${load} — need ${requiredReps}+ before ${load + stepUp}`, load, cls);
    case "HOLD_PUSH": return ret("HOLD_PUSH", `repeat ${load} — take it closer to ${rir} RIR`, load, cls);
    case "REDUCE": {
      const down = Math.max(stepDown, load - stepDown);       // lands on a load that exists
      return ret("REDUCE", `drop to ${down} — ${bottom}+ clean`, down, cls);
    }
    default: return cls === "P_UNPROGRESSABLE"
      ? ret("HOLD", `${stepUp} is too big a jump here — hold ${load} and add reps`, load, cls)
      : ret("HOLD", `repeat ${load} — chase ${top}+`, load, cls);
  }
}

function dayObj(){ return PROGRAM.days.find(d=>d.key===D); }
function weekObj(){ return PROGRAM.weeks[W-1]; }

// Today's exercises, resolved against the library, in display order: the
// saved drag order if there is one, with any exercise not in it (added to
// PROGRAM later) appended in PROGRAM order.
function exList(){
  const d = dayObj();
  const list = d.ex.map(p=>resolveEx(p, d.key));
  const ord = LOG.order[d.key];
  if(!ord || !ord.length) return list;
  const byId = new Map(list.map(e=>[e.programId,e]));
  const out = [];
  ord.forEach(id=>{ if(byId.has(id)){ out.push(byId.get(id)); byId.delete(id); } });
  byId.forEach(e=>out.push(e));
  return out;
}

/* ---- wiring: stored data -> suggestLoad inputs ---- */
const REP_RANGE_RE = /^(\d+)\s*[–-]\s*(\d+)$/;
function parseRange(reps){
  const m = REP_RANGE_RE.exec(reps || "");
  return m ? {bottom:+m[1], top:+m[2]} : null;
}

// §2: smallest step physically available; a per-exercise step override wins.
const EQUIP_STEP = [["dumbbell",5],["barbell",5],["cable",10],["machine",10],
                    ["leg press",10],["hack squat",10],["assisted pull-up machine",10]];
function stepFor(ex){
  const lib = LIB_EX.get(ex.id);
  if(typeof lib.step === "number") return lib.step;
  for(const [eq, st] of EQUIP_STEP) if(ex.equipment.includes(eq)) return st;
  return 5;
}

// Suggestion for the current week from last week's data, same (day, exerciseId).
// A swapped-in exercise has no sets under its id -> NO_DATA; never inherited.
function suggestFor(ex){
  // Every week's logged sets for this exercise: the engine reads week W−1 for
  // the suggestion and walks 3/2/1 for the §7 and §7.1 deload cascades.
  const weekSets = {};
  PROGRAM.weeks.forEach(w => {
    const arr = [];
    for(let si = 0; si < ex.sets[w.n-1]; si++){
      const c = LOG.sets[cell(w.n, D, ex.id, si)];
      // A set logged for reps only has no `weight` key at all, so c.weight is
      // undefined rather than null. Undefined is not a weight value; normalise
      // it so it cannot be mistaken for one downstream.
      if(c) arr.push({weight: c.weight ?? null, reps: c.reps});
    }
    weekSets[w.n] = arr;
  });
  // prescribed and feedback must come from whichever week the sets did.
  const ref = referenceWeek(weekSets, W);
  return suggestLoad({
    weekSets,
    prescribed: ref ? ex.sets[ref-1] : 0,
    range: parseRange(ex.reps) || {bottom:0, top:0},
    step: stepFor(ex),
    rack: ex.equipment.includes("dumbbell") && typeof LIB_EX.get(ex.id).step !== "number"
      ? LIBRARY.racks.dumbbell : null,
    loadSense: ex.loadSense,
    feedback: ref ? (LOG.feedback[`${ref}|${D}|${ex.id}`] || null) : null,
    currentWeek: W,
    startLoad: ex.start,
    rir: weekObj().rir
  });
}

/* ---- where to open ----
   A day is done when every working set on it is checked off. On launch we
   step forward from wherever we left off,
   past days already finished, and stop at the first one with work left. We
   only ever move forward: a finished week 1 should not drag you back to it,
   and nothing left to do means stay put rather than wrap around.

   The advance happens at load rather than the moment the last set is checked,
   so finishing a session never yanks the screen away while you are still
   looking at what you just did. */
function dayComplete(w, dayKey){
  const day = PROGRAM.days.find(x => x.key === dayKey);
  if(!day) return false;
  return day.ex.every(p => {
    const ex = resolveEx(p, dayKey);
    if(isSkipped(w, dayKey, ex.id)) return true;   // deliberately set aside, not outstanding
    for(let si = 0; si < ex.sets[w-1]; si++)
      if(!LOG.sets[cell(w, dayKey, ex.id, si)]?.done) return false;
    return true;
  });
}

function openAtNextUnfinished(){
  const keys = PROGRAM.days.map(d => d.key);
  let w = W, i = keys.indexOf(D);
  if(i < 0) return;
  while(w <= PROGRAM.weeks.length){
    if(!dayComplete(w, keys[i])){ W = w; D = keys[i]; return; }
    if(++i >= keys.length){ i = 0; w++; }
  }
  // every day from here on is finished — leave the saved position alone
}

function rememberPlace(){
  STORE.settings.week = W;
  STORE.settings.day = D;
  save();
}

function renderHeader(){
  $("weekSeg").innerHTML = PROGRAM.weeks.map(w=>

  $("daySeg").innerHTML = PROGRAM.days.map(d=>
