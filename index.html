<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Meso 01</title>
<style>
  :root{
    color-scheme:light;
    --ink:#14181d;
    --ink-2:#4a555f;
    --ink-3:#7d8892;
    --paper:#e3e7ea;
    --card:#f6f8f9;
    --line:#c6ced4;
    --line-2:#dde3e7;
    --signal:#1b5e8c;
    --logged:#146b52;
    --deload:#8a4a1f;
    --banner-bg:#f3ece6;
    --banner-ink:#6b4526;
    --cue-bg:#eceff1;
    --field:#fff;
    --field-logged:#eef1f2;
    --placeholder:#a8b1b8;
    --mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono","Courier New",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  /* Dark palette. Applied when the system prefers dark (unless the user forced
     light), and when the user forced dark. Same tokens, same accent semantics:
     blue = prescribed, green = logged, amber = deload. The block appears twice
     because CSS can't share it between a media query and an attribute selector
     without a build step — keep both copies identical. */
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --ink:#e6eaed;
      --ink-2:#aab4bd;
      --ink-3:#8a95a0;
      --paper:#111519;
      --card:#1a2026;
      --line:#3d4750;
      --line-2:#272e35;
      --signal:#82b8de;
      --logged:#35977a;
      --deload:#c58e55;
      --banner-bg:#271e15;
      --banner-ink:#d9b48b;
      --cue-bg:#232a31;
      --field:#12161a;
      --field-logged:#20262d;
      --placeholder:#5d6873;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ink:#e6eaed;
    --ink-2:#aab4bd;
    --ink-3:#8a95a0;
    --paper:#111519;
    --card:#1a2026;
    --line:#3d4750;
    --line-2:#272e35;
    --signal:#82b8de;
    --logged:#35977a;
    --deload:#c58e55;
    --banner-bg:#271e15;
    --banner-ink:#d9b48b;
    --cue-bg:#232a31;
    --field:#12161a;
    --field-logged:#20262d;
    --placeholder:#5d6873;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4}
  .wrap{max-width:560px;margin:0 auto;padding:0 0 96px}

  /* ---- header ---- */
  header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 14px 0}
  .brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
  .brand{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
  .rir{font-family:var(--mono);font-size:12px;color:var(--ink-2);letter-spacing:.02em}
  .rir b{color:var(--signal);font-size:14px}
  .hright{display:flex;align-items:baseline;gap:10px}
  .themeBtn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink-2);
    font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    padding:5px 8px;border-radius:2px;cursor:pointer;min-width:52px}
  .seg{display:flex;gap:6px;margin-bottom:8px}
  .seg button{flex:1;appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink-2);
    font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    padding:9px 0;border-radius:2px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .seg.weeks button[aria-pressed="true"].dl{background:var(--deload);border-color:var(--deload)}
  .daymeta{font-size:12px;color:var(--ink-3);padding:0 0 10px;display:flex;justify-content:space-between;font-family:var(--mono)}

  /* ---- deload banner ---- */
  .banner{margin:12px 14px 0;padding:10px 12px;border-left:3px solid var(--deload);background:var(--banner-bg);
    font-size:13px;color:var(--banner-ink)}

  /* ---- exercise card ---- */
  .card{background:var(--card);border:1px solid var(--line-2);border-top:2px solid var(--ink);
    margin:14px 14px 0;padding:12px 12px 4px}
  .card.done{border-top-color:var(--logged)}
  .exhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:grab;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .grip{flex:none;padding:5px 2px 5px 12px}
  .grip svg{width:10px;height:16px;fill:var(--line);display:block}
  .card.drag-src{opacity:.35}
  .card.drag-ghost{position:fixed;z-index:60;margin:0;box-shadow:0 10px 28px rgba(20,24,29,.28);
    pointer-events:none;border-top-color:var(--signal)}
  .no-select, .no-select *{user-select:none;-webkit-user-select:none}
  .tag{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .exname{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:1px 0 2px}
  .prescribe{font-family:var(--mono);font-size:12px;color:var(--signal);margin-bottom:10px}
  .cue{font-size:12px;color:var(--ink-2);background:var(--cue-bg);border-left:2px solid var(--line);
    padding:6px 8px;margin:0 0 10px}

  /* ---- set rows ---- */
  .hdr{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center;
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-bottom:4px}
  .row{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center;
    padding:5px 0;border-top:1px solid var(--line-2)}
  .setno{font-family:var(--mono);font-size:13px;color:var(--ink-3);text-align:center}
  .fieldwrap{position:relative}
  input[type=number]{width:100%;appearance:none;-moz-appearance:textfield;border:1px solid var(--line);
    background:var(--field);border-radius:2px;padding:11px 8px 11px;font-family:var(--mono);font-size:17px;
    font-weight:600;color:var(--ink);text-align:center}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input:focus{outline:2px solid var(--signal);outline-offset:-1px;border-color:var(--signal)}
  .ghost{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-3);text-align:center;padding-top:2px;min-height:13px}
  .chk{width:46px;height:44px;border:1px solid var(--line);background:var(--field);border-radius:2px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0}
  .chk svg{width:18px;height:18px;stroke:var(--line);stroke-width:3;fill:none;stroke-linecap:square}
  .chk[aria-pressed="true"]{background:var(--logged);border-color:var(--logged)}
  .chk[aria-pressed="true"] svg{stroke:#fff}
  .row.logged input{color:var(--ink-2);background:var(--field-logged)}

  .note{width:100%;border:none;border-top:1px solid var(--line-2);background:transparent;padding:9px 2px;
    font-family:var(--sans);font-size:13px;color:var(--ink-2);resize:none;margin-top:6px}
  .note:focus{outline:none;color:var(--ink)}
  .note::placeholder{color:var(--placeholder)}

  /* ---- volume sheet ---- */
  .vol{margin:18px 14px 0;border-top:1px solid var(--line)}
  .vol summary{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-2);padding:12px 0;cursor:pointer;list-style:none}
  .vol summary::-webkit-details-marker{display:none}
  .vol summary::after{content:" +";color:var(--ink-3)}
  .vol[open] summary::after{content:" –"}
  .voltbl{display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;font-family:var(--mono);font-size:12px;padding-bottom:14px}
  .voltbl div{padding:3px 0;border-bottom:1px solid var(--line-2)}
  .voltbl .h{color:var(--ink-3);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  .bar{height:6px;background:var(--signal);display:inline-block;vertical-align:middle}
  .foot{padding:22px 14px 0;font-size:12px;color:var(--ink-3);line-height:1.5}
  .foot button{background:none;border:none;color:var(--ink-3);font-size:12px;text-decoration:underline;padding:0;cursor:pointer;font-family:var(--sans)}
  .saving{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:7px 14px;border-radius:2px;opacity:0;
    transition:opacity .18s;pointer-events:none;z-index:40}
  .saving.on{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brandrow">
      <div class="brand">Meso 01 · Rebalanced</div>
      <div class="hright">
        <div class="rir" id="rirLabel"></div>
        <button class="themeBtn" id="themeBtn" aria-label="Color theme">auto</button>
      </div>
    </div>
    <div class="seg weeks" id="weekSeg"></div>
    <div class="seg days" id="daySeg"></div>
    <div class="daymeta"><span id="dayFocus"></span><span id="daySets"></span></div>
  </header>
  <div id="bannerSlot"></div>
  <div id="days"></div>
  <details class="vol">
    <summary>Weekly sets by muscle</summary>
    <div class="voltbl" id="volTbl"></div>
  </details>
  <div class="foot">
    Log working sets only — keep warm-ups off the sheet. Hit the top of the rep range on every set at the
    target RIR and add load next week; otherwise repeat the weight and chase reps.
    <br><br>
    <button id="exportBtn">Export data</button> ·
    <button id="importBtn">Import data</button> ·
    <button id="resetBtn">Clear all logged data</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</div>
<div class="saving" id="toast">SAVED</div>

<script>
// Apply a forced theme before first paint so dark mode doesn't flash light.
try{
  const t = JSON.parse(localStorage.getItem("meso-tracker"))?.settings?.theme;
  if(t==="dark"||t==="light") document.documentElement.dataset.theme = t;
}catch(e){}

const PROGRAM = {
  weeks: [
    {n:1, rir:"3", note:null},
    {n:2, rir:"2", note:null},
    {n:3, rir:"1", note:null},
    {n:4, rir:"4–5", note:"Deload. Sets are cut roughly in half and load drops to about 65–70% of week 3. Move well, leave everything in the tank, keep the runs easy."}
  ],
  days: [
    {key:"mon", label:"Mon", focus:"Push · partner gym", ex:[
      {name:"Incline Dumbbell Press", muscle:"Chest", sets:[3,3,4,2], reps:"8–12", start:25, unit:"per DB",
       cue:"The upper-chest lift. Bench at about 30°, not 45° — higher angles hand the work to the front delt."},
      {name:"Dumbbell Shoulder Press (Seated)", muscle:"Shoulders", sets:[3,3,3,2], reps:"8–12", start:25, unit:"per DB",
       cue:"You were at 25s for 12, then dropping to 20s. Hold 25 for all sets this time and let reps climb."},
      {name:"Machine Flye", muscle:"Chest", sets:[2,3,3,1], reps:"10–15", start:70, unit:""},
      {name:"Cable Triceps Pushdown (Bar)", muscle:"Triceps", sets:[3,3,3,2], reps:"10–15", start:60, unit:""},
      {name:"Dumbbell Lateral Raise", muscle:"Shoulders", sets:[3,3,4,2], reps:"12–20", start:10, unit:"per DB",
       cue:"Replaces two of the three weekly upright row slots. Lead with the elbow, stop at shoulder height."},
      {name:"Cable Rope Facepull", muscle:"Rear delt", sets:[3,3,4,2], reps:"12–20", start:50, unit:"",
       cue:"Rope at forehead height. Pull to the face and rotate — this is the posterior delt work, not a row."}
    ]},
    {key:"wed", label:"Wed", focus:"Pull · quads", ex:[
      {name:"Barbell Squat (High Bar)", muscle:"Quads", sets:[3,3,3,2], reps:"8–12", start:85, unit:"",
       cue:"Three true working sets at one weight. Warm up to it — don't log the ramp."},
      {name:"Lat Pulldown", muscle:"Back", sets:[3,3,4,2], reps:"10–15", start:null, unit:"",
       cue:"New. Week 1 is for finding a weight you can hold for 12 clean reps with 3 in reserve."},
      {name:"Chest-Supported Row", muscle:"Back", sets:[3,3,3,2], reps:"10–15", start:null, unit:"",
       cue:"New. Chest pad takes the low back out of it on a day you've already squatted."},
      {name:"EZ Bar Preacher Curl", muscle:"Biceps", sets:[3,3,3,2], reps:"10–15", start:45, unit:"",
       cue:"You hit 17 reps at 40 — that's below a working weight. Start at 45."},
      {name:"Dumbbell Curl (Incline)", muscle:"Biceps", sets:[3,3,3,2], reps:"10–15", start:15, unit:"per DB"},
      {name:"Leg Extension", muscle:"Quads", sets:[2,2,3,1], reps:"15–20", start:45, unit:""},
      {name:"Push-Up", muscle:"Chest", sets:[2,2,2,1], reps:"2 shy of failure", start:0, unit:"bodyweight",
       cue:"Log reps only. Leave the weight field empty."}
    ]},
    {key:"fri", label:"Fri", focus:"Shoulders · hamstrings", ex:[
      {name:"Dumbbell Upright Row", muscle:"Shoulders", sets:[3,3,3,2], reps:"10–15", start:20, unit:"per DB",
       cue:"Your one upright row slot for the week. If the forearms still quit first, swap in a lateral raise."},
      {name:"Cable Rear Delt Flye", muscle:"Rear delt", sets:[3,3,4,2], reps:"12–20", start:null, unit:"",
       cue:"New. Light and high-rep — the second posterior delt exposure of the week."},
      {name:"Single-Arm Dumbbell Row", muscle:"Back", sets:[3,3,3,2], reps:"10–15", start:null, unit:"per DB",
       cue:"New. Gives back a second session instead of one big Wednesday."},
      {name:"Machine Flye", muscle:"Chest", sets:[3,3,3,2], reps:"10–15", start:70, unit:""},
      {name:"Barbell Good Morning (High Bar)", muscle:"Hamstrings", sets:[3,3,3,2], reps:"10–12", start:65, unit:""},
      {name:"Seated Leg Curl", muscle:"Hamstrings", sets:[2,2,3,1], reps:"12–15", start:null, unit:""},
      {name:"EZ Bar Curl (Wide Grip)", muscle:"Biceps", sets:[3,3,3,2], reps:"10–15", start:40, unit:""},
      {name:"Push-Up", muscle:"Chest", sets:[2,2,2,1], reps:"2 shy of failure", start:0, unit:"bodyweight",
       cue:"Log reps only. Leave the weight field empty."}
    ]}
  ]
};

/* ---- storage ----
   Everything lives under one localStorage key as a versioned envelope:
   { schemaVersion, updatedAt, settings, mesos: { <mesoId>: { sets, notes, order } } }
   settings: { theme: "auto" | "light" | "dark" }
   sets:  "week|day|exercise name|setIdx" -> {weight, reps, done}  (weight/reps: number or null)
   notes: "week|day|exercise name" -> string
   order: dayKey -> [exercise names], drag-to-reorder override of PROGRAM order
   Keyed by exercise name, not list position, so reordering or swapping
   exercises in PROGRAM never mislabels old logs.
   Bump SCHEMA_VERSION and add MIGRATIONS[oldVersion] when the shape changes. */
const STORE_KEY = "meso-tracker";
const SCHEMA_VERSION = 3;
const MESO_ID = "meso01";

// MIGRATIONS[n] upgrades a store from schemaVersion n to n+1.
const MIGRATIONS = {
  // v2 added per-day exercise order overrides
  1: s => { Object.values(s.mesos).forEach(m => { m.order = m.order || {}; }); return s; },
  // v3 added app settings (theme)
  2: s => { s.settings = s.settings || {theme:"auto"}; return s; }
};

function freshStore(){ return {schemaVersion:SCHEMA_VERSION, updatedAt:null, settings:{theme:"auto"}, mesos:{}}; }

function migrate(store){
  while(store.schemaVersion < SCHEMA_VERSION){
    const step = MIGRATIONS[store.schemaVersion];
    if(!step){ backupRaw(JSON.stringify(store)); return freshStore(); }
    store = step(store);
    store.schemaVersion++;
  }
  return store;
}

// Parked, never overwritten by the app — recoverable by hand if something goes wrong.
function backupRaw(raw){ try{ localStorage.setItem(STORE_KEY+".backup", raw); }catch(e){} }

const storage = {
  async get(){
    const raw = localStorage.getItem(STORE_KEY);
    if(raw === null) return freshStore();
    let s = null;
    try{ s = JSON.parse(raw); }catch(e){}
    if(!s || typeof s !== "object" || typeof s.schemaVersion !== "number"){
      backupRaw(raw);
      return freshStore();
    }
    return migrate(s);
  },
  async set(store){
    store.updatedAt = new Date().toISOString();
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  }
};

let STORE = freshStore();
let LOG = {sets:{}, notes:{}};
let W = 1, D = "mon";

const $ = id => document.getElementById(id);
const cell = (w,d,exName,s) => `${w}|${d}|${exName}|${s}`;

let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await storage.set(STORE);
      const t=$("toast"); t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),900);
    }catch(err){
      const t=$("toast"); t.textContent="NOT SAVED — RETRY"; t.classList.add("on");
      setTimeout(()=>{t.classList.remove("on");t.textContent="SAVED";},2200);
    }
  }, 500);
}

async function load(){
  STORE = await storage.get();
  STORE.settings = STORE.settings || {theme:"auto"};
  if(!STORE.mesos[MESO_ID]) STORE.mesos[MESO_ID] = {sets:{}, notes:{}, order:{}};
  LOG = STORE.mesos[MESO_ID];
  LOG.sets = LOG.sets || {};
  LOG.notes = LOG.notes || {};
  LOG.order = LOG.order || {};
}

function dayObj(){ return PROGRAM.days.find(d=>d.key===D); }
function weekObj(){ return PROGRAM.weeks[W-1]; }

// Today's exercises in display order: the saved drag order if there is one,
// with any exercise not in it (added to PROGRAM later) appended in PROGRAM order.
function exList(){
  const d = dayObj();
  const ord = LOG.order[d.key];
  if(!ord || !ord.length) return d.ex;
  const byName = new Map(d.ex.map(e=>[e.name,e]));
  const out = [];
  ord.forEach(n=>{ if(byName.has(n)){ out.push(byName.get(n)); byName.delete(n); } });
  byName.forEach(e=>out.push(e));
  return out;
}

function renderHeader(){
  $("weekSeg").innerHTML = PROGRAM.weeks.map(w=>
    `<button data-w="${w.n}" class="${w.n===4?'dl':''}" aria-pressed="${w.n===W}">Wk ${w.n}</button>`).join("");
  $("daySeg").innerHTML = PROGRAM.days.map(d=>
    `<button data-d="${d.key}" aria-pressed="${d.key===D}">${d.label}</button>`).join("");
  $("rirLabel").innerHTML = `Target RIR <b>${weekObj().rir}</b>`;
  $("dayFocus").textContent = dayObj().focus;
  const total = dayObj().ex.reduce((a,e)=>a+e.sets[W-1],0);
  $("daySets").textContent = `${total} working sets`;

  $("bannerSlot").innerHTML = weekObj().note ? `<div class="banner">${weekObj().note}</div>` : "";
}

function renderDay(){
  $("days").innerHTML = exList().map((ex,ei)=>{
    const n = ex.sets[W-1];
    const rows = Array.from({length:n},(_,si)=>{
      const c = LOG.sets[cell(W,D,ex.name,si)] || {};
      const prev = W>1 ? (LOG.sets[cell(W-1,D,ex.name,si)] || null) : null;
      let ghost = "";
      if(prev && (prev.weight||prev.reps)) ghost = `last ${prev.weight||"–"}×${prev.reps||"–"}`;
      else if(W===1 && ex.start) ghost = `start ${ex.start}`;
      else if(W===1 && ex.start===null) ghost = `find it`;
      return `<div class="row ${c.done?'logged':''}" data-r="${ei}-${si}">
        <div class="setno">${si+1}</div>
        <div class="fieldwrap">
          <input type="number" inputmode="decimal" step="0.5" data-f="w" data-e="${ei}" data-s="${si}"
            value="${c.weight??""}" placeholder="${ex.start!==null&&ex.start!==0?ex.start:""}">
          <span class="ghost">${ghost}</span>
        </div>
        <div class="fieldwrap">
          <input type="number" inputmode="numeric" data-f="r" data-e="${ei}" data-s="${si}" value="${c.reps??""}">
          <span class="ghost"></span>
        </div>
        <button class="chk" data-e="${ei}" data-s="${si}" aria-pressed="${!!c.done}" aria-label="Mark set ${si+1} done">
          <svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"/></svg>
        </button>
      </div>`;
    }).join("");
    const allDone = Array.from({length:n},(_,si)=>LOG.sets[cell(W,D,ex.name,si)]?.done).every(Boolean);
    const noteVal = LOG.notes[`${W}|${D}|${ex.name}`] || "";
    return `<div class="card ${allDone?'done':''}" data-ex="${ex.name}">
      <div class="exhead">
        <div>
          <div class="tag">${ex.muscle}</div>
          <div class="exname">${ex.name}</div>
        </div>
        <div class="grip" aria-hidden="true"><svg viewBox="0 0 10 16">
          <circle cx="2.5" cy="2" r="1.6"/><circle cx="7.5" cy="2" r="1.6"/>
          <circle cx="2.5" cy="8" r="1.6"/><circle cx="7.5" cy="8" r="1.6"/>
          <circle cx="2.5" cy="14" r="1.6"/><circle cx="7.5" cy="14" r="1.6"/>
        </svg></div>
      </div>
      <div class="prescribe">${n} × ${ex.reps}${ex.unit?` · ${ex.unit}`:""} · ${weekObj().rir} RIR</div>
      ${ex.cue?`<div class="cue">${ex.cue}</div>`:""}
      <div class="hdr"><div></div><div>Weight</div><div>Reps</div><div></div></div>
      ${rows}
      <textarea class="note" rows="1" data-note="${ei}" placeholder="Note…">${noteVal}</textarea>
    </div>`;
  }).join("");
}

function renderVolume(){
  const tally = {};
  PROGRAM.days.forEach(d=>d.ex.forEach(ex=>{
    tally[ex.muscle] = (tally[ex.muscle]||0) + ex.sets[W-1];
  }));
  const entries = Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  const max = Math.max(...entries.map(e=>e[1]));
  $("volTbl").innerHTML = `<div class="h">Muscle</div><div class="h">Sets</div><div class="h"></div>` +
    entries.map(([m,v])=>`<div>${m}</div><div style="text-align:right">${v}</div>
      <div><span class="bar" style="width:${Math.round(v/max*72)}px"></span></div>`).join("");
}

function render(){ renderHeader(); renderDay(); renderVolume(); }

function toastMsg(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("on");
  setTimeout(()=>{t.classList.remove("on"); t.textContent="SAVED";},1400);
}

/* ---- theme ---- */
function applyTheme(){
  const t = STORE.settings.theme;
  if(t==="dark"||t==="light") document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  $("themeBtn").textContent = t;
}

/* ---- export / import ----
   Export downloads the whole envelope verbatim. Import validates and migrates
   a parsed copy first, then stashes the current envelope under .backup and
   swaps in the file — all-or-nothing, storage is never half-written. The
   file's own updatedAt is kept (storage.set would restamp it). */
function exportData(){
  const d = new Date();
  const pad = n => String(n).padStart(2,"0");
  const name = `meso-tracker-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;
  const url = URL.createObjectURL(new Blob([JSON.stringify(STORE,null,2)], {type:"application/json"}));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toastMsg("EXPORTED");
}

function describeEnvelope(s){
  let sets=0, notes=0;
  Object.values(s.mesos||{}).forEach(m=>{
    sets += Object.keys(m.sets||{}).length;
    notes += Object.keys(m.notes||{}).length;
  });
  return `${sets} logged sets, ${notes} notes` + (s.updatedAt ? `, saved ${s.updatedAt.slice(0,10)}` : "");
}

async function importData(text){
  let s;
  try{ s = JSON.parse(text); }
  catch(err){ alert("Import failed: the file isn't valid JSON."); return false; }
  if(!s || typeof s!=="object" || Array.isArray(s)){
    alert(`Import failed: expected a JSON object, got ${Array.isArray(s)?"an array":typeof s}.`); return false;
  }
  if(typeof s.schemaVersion!=="number"){
    alert("Import failed: no schemaVersion field — this doesn't look like a meso-tracker export."); return false;
  }
  if(s.schemaVersion > SCHEMA_VERSION){
    alert(`Import failed: the file is schema v${s.schemaVersion}, but this app only knows v${SCHEMA_VERSION}. Update the app, then import.`); return false;
  }
  if(!s.mesos || typeof s.mesos!=="object" || Array.isArray(s.mesos)){
    alert("Import failed: no mesos object — this doesn't look like a meso-tracker export."); return false;
  }
  for(let v=s.schemaVersion; v<SCHEMA_VERSION; v++){
    if(!MIGRATIONS[v]){ alert(`Import failed: no migration path from schema v${s.schemaVersion} to v${SCHEMA_VERSION}.`); return false; }
  }
  while(s.schemaVersion < SCHEMA_VERSION){
    s = MIGRATIONS[s.schemaVersion](s);
    s.schemaVersion++;
  }
  if(!confirm(`Replace what's on this device (${describeEnvelope(STORE)}) with the file (${describeEnvelope(s)})?\n\nThe current data is stashed under the backup key first.`)) return false;
  backupRaw(JSON.stringify(STORE));
  localStorage.setItem(STORE_KEY, JSON.stringify(s));
  await load();
  applyTheme();
  render();
  toastMsg("IMPORTED");
  return true;
}

$("importFile").addEventListener("change", async e=>{
  const f = e.target.files[0];
  e.target.value = "";
  if(f) importData(await f.text());
});

/* ---- hold-and-drag to reorder exercises ----
   Hold the exercise header ~1/3s, then drag. Before the hold completes the
   gesture stays a normal scroll; after it completes, touchmove is prevented
   (non-passive) so the browser never hijacks the drag as a scroll. A fixed-
   position clone follows the finger while the real card re-slots live. */
const HOLD_MS = 350, DRAG_SLOP = 12, EDGE = 70, EDGE_SPEED = 8;
let drag = null;

function commitOrder(){
  const now = [...$("days").querySelectorAll(".card")].map(c=>c.dataset.ex);
  if(now.join("|") !== exList().map(x=>x.name).join("|")){
    LOG.order[D] = now;
    save();
  }
}

function placeSrc(y){
  const wrap = $("days");
  let after = null;
  for(const c of wrap.querySelectorAll(".card")){
    if(c === drag.card) continue;
    const r = c.getBoundingClientRect();
    if(y > r.top + r.height/2) after = c;
  }
  if(after) after.after(drag.card); else wrap.prepend(drag.card);
}

function beginDrag(){
  if(!drag) return;
  const r = drag.card.getBoundingClientRect();
  drag.grabDY = drag.startY - r.top;
  const g = drag.card.cloneNode(true);
  g.classList.add("drag-ghost");
  g.style.width = r.width+"px"; g.style.left = r.left+"px"; g.style.top = r.top+"px";
  document.body.appendChild(g);
  drag.ghost = g;
  drag.card.classList.add("drag-src");
  document.body.classList.add("no-select");
  drag.started = true;
  drag.lastY = drag.startY;
  if(navigator.vibrate) navigator.vibrate(15);
  drag.raf = requestAnimationFrame(dragTick);
}

function dragTick(){
  if(!drag || !drag.started) return;
  const y = drag.lastY;
  if(y < EDGE) window.scrollBy(0, -EDGE_SPEED);
  else if(y > innerHeight - EDGE) window.scrollBy(0, EDGE_SPEED);
  placeSrc(y);
  drag.raf = requestAnimationFrame(dragTick);
}

function dragMove(e){
  if(!drag || e.pointerId !== drag.pid) return;
  if(!drag.started){
    if(Math.hypot(e.clientX-drag.startX, e.clientY-drag.startY) > DRAG_SLOP) endDrag(false);
    return;
  }
  drag.lastY = e.clientY;
  drag.ghost.style.top = (e.clientY - drag.grabDY)+"px";
  placeSrc(e.clientY);
}

function dragUp(e){ if(drag && e.pointerId === drag.pid) endDrag(true); }
function dragCancel(e){ if(drag && e.pointerId === drag.pid) endDrag(false); }
function preventScroll(e){ if(drag && drag.started) e.preventDefault(); }

function endDrag(commit){
  clearTimeout(drag.timer);
  cancelAnimationFrame(drag.raf);
  if(drag.ghost) drag.ghost.remove();
  drag.card.classList.remove("drag-src");
  document.body.classList.remove("no-select");
  document.removeEventListener("pointermove", dragMove);
  document.removeEventListener("pointerup", dragUp);
  document.removeEventListener("pointercancel", dragCancel);
  document.removeEventListener("touchmove", preventScroll);
  const started = drag.started;
  drag = null;
  if(started){
    if(commit) commitOrder();
    renderDay();   // commit or not, redraw from the stored order
  }
}

$("days").addEventListener("pointerdown", e=>{
  if(!e.isPrimary || !e.target.closest(".exhead")) return;
  drag = {card: e.target.closest(".card"), pid: e.pointerId,
          startX: e.clientX, startY: e.clientY, started: false,
          timer: setTimeout(beginDrag, HOLD_MS)};
  document.addEventListener("pointermove", dragMove);
  document.addEventListener("pointerup", dragUp);
  document.addEventListener("pointercancel", dragCancel);
  document.addEventListener("touchmove", preventScroll, {passive:false});
});

// Android fires a context menu on long-press; keep it off the drag handle.
$("days").addEventListener("contextmenu", e=>{
  if(e.target.closest(".exhead")) e.preventDefault();
});

document.addEventListener("click", e=>{
  const wb = e.target.closest("#weekSeg button");
  if(wb){ W = +wb.dataset.w; render(); window.scrollTo(0,0); return; }
  const db = e.target.closest("#daySeg button");
  if(db){ D = db.dataset.d; render(); window.scrollTo(0,0); return; }
  const chk = e.target.closest(".chk");
  if(chk){
    const k = cell(W,D,exList()[chk.dataset.e].name,chk.dataset.s);
    LOG.sets[k] = LOG.sets[k] || {};
    LOG.sets[k].done = !LOG.sets[k].done;
    save(); renderDay();
    return;
  }
  if(e.target.id==="themeBtn"){
    const cycle = ["auto","dark","light"];
    STORE.settings.theme = cycle[(cycle.indexOf(STORE.settings.theme)+1)%3];
    applyTheme(); save();
    return;
  }
  if(e.target.id==="exportBtn"){ exportData(); return; }
  if(e.target.id==="importBtn"){ $("importFile").click(); return; }
  if(e.target.id==="resetBtn"){
    if(confirm("Clear every logged weight, rep and note in this meso? The program itself stays.")){
      LOG.sets = {}; LOG.notes = {}; save(); render();
    }
  }
});

document.addEventListener("input", e=>{
  const inp = e.target;
  if(inp.dataset.f){
    const k = cell(W,D,exList()[inp.dataset.e].name,inp.dataset.s);
    LOG.sets[k] = LOG.sets[k] || {};
    LOG.sets[k][inp.dataset.f==="w"?"weight":"reps"] = inp.value==="" ? null : Number(inp.value);
    save();
  }
  if(inp.dataset.note!==undefined){
    const k = `${W}|${D}|${exList()[inp.dataset.note].name}`;
    if(inp.value) LOG.notes[k] = inp.value; else delete LOG.notes[k];
    inp.style.height="auto"; inp.style.height=inp.scrollHeight+"px";
    save();
  }
});

(async ()=>{ await load(); applyTheme(); render(); })();
</script>
</body>
</html>
