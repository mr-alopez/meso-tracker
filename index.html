<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<title>Meso 01</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#e3e7ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111519" media="(prefers-color-scheme: dark)">
<style>
  :root{
    color-scheme:light;
    --ink:#14181d;
    --ink-2:#4a555f;
    --ink-3:#7d8892;
    --paper:#e3e7ea;
    --card:#f6f8f9;
    --line:#c6ced4;
    --line-2:#dde3e7;
    --signal:#1b5e8c;
    --logged:#146b52;
    --deload:#8a4a1f;
    --banner-bg:#f3ece6;
    --banner-ink:#6b4526;
    --cue-bg:#eceff1;
    --field:#fff;
    --field-logged:#eef1f2;
    --placeholder:#a8b1b8;
    --active-bg:#e7eef5;
    --video:#c4302b;
    --rest:#5f4b9e;
    --mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono","Courier New",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  /* Dark palette. Applied when the system prefers dark (unless the user forced
     light), and when the user forced dark. Same tokens, same accent semantics:
     blue = prescribed, green = logged, amber = deload. The block appears twice
     because CSS can't share it between a media query and an attribute selector
     without a build step — keep both copies identical. */
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --ink:#f2f6f9;
      --ink-2:#c2ccd5;
      --ink-3:#a2adb8;
      --paper:#131920;
      --card:#212932;
      --line:#55626d;
      --line-2:#333d46;
      --signal:#93c8ee;
      --logged:#45b894;
      --deload:#dba569;
      --banner-bg:#2e2318;
      --banner-ink:#e6c9a6;
      --cue-bg:#2a333c;
      --field:#171d24;
      --field-logged:#262f38;
      --placeholder:#6d7985;
      --active-bg:#2c3742;
      --video:#ff5f5f;
      --rest:#b49ae8;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ink:#f2f6f9;
    --ink-2:#c2ccd5;
    --ink-3:#a2adb8;
    --paper:#131920;
    --card:#212932;
    --line:#55626d;
    --line-2:#333d46;
    --signal:#93c8ee;
    --logged:#45b894;
    --deload:#dba569;
    --banner-bg:#2e2318;
    --banner-ink:#e6c9a6;
    --cue-bg:#2a333c;
    --field:#171d24;
    --field-logged:#262f38;
    --placeholder:#6d7985;
    --active-bg:#2c3742;
    --video:#ff5f5f;
    --rest:#b49ae8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* One card per gesture. "mandatory" means every scroll comes to rest on a
     snap point, and scroll-snap-stop:always stops a hard fling at each card
     rather than letting it sail past several. Oversized cards are safe: the
     spec makes any position covering the snapport valid, so a card taller than
     the screen can still be scrolled through.
     The header carries its own snap point, or the top of the page would not be
     a valid resting position and mandatory would drag you off the week and day
     selector onto the first card. scroll-margin-top clears the sticky
     dashboard: snap points align to the top of the viewport, so without it a
     card lands behind the bar and loses its name. */
  /* snap-stop as well, or a flick upward sails past the top and you can never
     come to rest on the week and day selector. */
  header{scroll-snap-align:start;scroll-snap-stop:always}
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.4}
  /* The page scrolls inside .wrap, not the document. Snapping - and
     scroll-snap-stop especially - is far more reliable in a real scroll
     container than on the root scroller in Chrome Android, which was letting
     flicks sail past cards the spec says they should stop at. */
  .wrap{max-width:560px;margin:0 auto;height:100dvh;overflow-y:auto;
    overscroll-behavior-y:contain;scroll-snap-type:y mandatory}

  /* ---- header: compact, scrolls away. The dashboard below it is what sticks. ---- */
  header{background:var(--paper);padding:8px 14px 0}
  .brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
  .brand{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
  .rir{font-family:var(--mono);font-size:12px;color:var(--ink-2);letter-spacing:.02em}
  .rir b{color:var(--signal);font-size:13px}
  .hright{display:flex;align-items:baseline;gap:10px}
  .themeBtn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink-2);
    font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    padding:5px 8px;border-radius:2px;cursor:pointer;min-width:52px}
  .seg{display:flex;gap:6px;margin-bottom:7px}
  .seg button{flex:1;appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink-2);
    font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    padding:10px 0;border-radius:2px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .seg.weeks button[aria-pressed="true"].dl{background:var(--deload);border-color:var(--deload)}
  .daymeta{font-size:12px;color:var(--ink-3);padding:0 0 8px;font-family:var(--mono)}

  /* ---- sticky dashboard: session · rest · sets left ---- */
  /* Both stopwatches share one column width; the tighter horizontal padding
     is what keeps a h:mm:ss session from crowding its cell. */
  .dash{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr 1fr auto;
    gap:1px;background:var(--line-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .dcell{appearance:none;border:none;background:var(--paper);color:var(--ink);font-family:var(--mono);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:9px 4px;min-height:68px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .dcell.count{cursor:default}
  .dlabel{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
    white-space:nowrap}
  .dval{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .dcell.on .dval, .dcell.on .dlabel{color:var(--signal)}
  .dcell.paused .dval, .dcell.paused .dlabel{color:var(--deload)}
  #restBtn.on .dval, #restBtn.on .dlabel{color:var(--rest)}
  .dcell.count .dval{color:var(--logged)}
  .dcell.count.done .dlabel{color:var(--logged)}

  /* ---- deload banner ---- */
  .banner{margin:12px 14px 0;padding:10px 12px;border-left:3px solid var(--deload);background:var(--banner-bg);
    font-size:13px;color:var(--banner-ink)}

  /* ---- exercise card ---- */
  .card{background:var(--card);border:1px solid var(--line-2);border-top:2px solid var(--ink);
    margin:14px 14px 0;padding:12px 12px 4px;
    scroll-snap-align:start;scroll-snap-stop:always;scroll-margin-top:78px}
  .card.done{border-top-color:var(--logged)}
  .exhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:grab;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .grip{flex:none;padding:5px 2px 5px 12px}
  .grip svg{width:10px;height:16px;fill:var(--line);display:block}
  /* The slot the card came from, as a slim dashed gap rather than a faded
     full-height card. At 600-750px tall a faded card is invisible: the gap has
     to be short enough that the neighbours around it stay on screen. */
  .card.drag-src{height:56px;min-height:0;padding:0;overflow:hidden;opacity:1;
    background:transparent;border:2px dashed var(--signal)}
  .card.drag-src > *{visibility:hidden}
  /* What follows the finger is a compact chip, not a clone of a screen-sized
     card - a full clone covers the very gap it is meant to reveal. */
  .drag-ghost{position:fixed;z-index:60;margin:0;pointer-events:none;
    background:var(--card);border:1px solid var(--line-2);border-top:2px solid var(--signal);
    border-radius:2px;padding:9px 12px;box-shadow:0 10px 28px rgba(8,11,14,.45)}
  .no-select, .no-select *{user-select:none;-webkit-user-select:none}
  /* Snapping off while dragging. Reordering the DOM makes a mandatory-snap
     container re-snap, which shifts the scroll, which changes which cards sit
     under the finger - so the insert-after search ran to the last card and the
     exercise shot to the bottom. */
  .wrap.dragging{scroll-snap-type:none}
  /* Same while typing. The browser scrolls the focused field into view and
     mandatory snapping then re-snaps to the nearest card, tugging the field
     back under the bar or off the bottom - which is the field being "a hair
     cut off" once the keyboard is up. */
  .wrap.typing{scroll-snap-type:none}
  .headbtns{display:flex;align-items:center;gap:5px;flex:none}
  .swapBtn,.vidBtn{appearance:none;border:1px solid var(--line-2);background:transparent;border-radius:2px;
    width:34px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
    text-decoration:none}
  .swapBtn svg{width:14px;height:14px;stroke:var(--ink-3);stroke-width:2;fill:none;stroke-linecap:square}
  .vidBtn svg{width:13px;height:13px;fill:var(--video)}
  .card.swapped .swapBtn{border-color:var(--signal)}
  .card.swapped .swapBtn svg{stroke:var(--signal)}

  /* ---- swap sheet ---- */
  .sheetBack{position:fixed;inset:0;background:rgba(8,11,14,.45);z-index:70}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-width:560px;margin:0 auto;
    background:var(--card);border-top:2px solid var(--ink);max-height:70vh;overflow-y:auto;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
  .sheetTitle{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-2);margin-bottom:10px}
  .opt{display:block;width:100%;text-align:left;appearance:none;background:transparent;border:1px solid var(--line-2);
    border-radius:2px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-family:var(--sans);color:var(--ink)}
  .opt .oname{font-size:15px;font-weight:700}
  .opt .ometa{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:2px}
  .opt .ospinal{font-family:var(--mono);font-size:11px;color:var(--deload);margin-top:2px}
  .opt[aria-pressed="true"]{border-color:var(--signal);outline:1px solid var(--signal);outline-offset:-1px}
  .opt[aria-pressed="true"] .oname::after{content:" · current";color:var(--signal);
    font-size:11px;font-family:var(--mono);font-weight:600}
  .tag{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .exname{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:1px 0 2px}
  .prescribe{font-family:var(--mono);font-size:13px;color:var(--signal);margin-bottom:10px}
  .cue{font-size:13px;color:var(--ink-2);background:var(--cue-bg);border-left:2px solid var(--line);
    padding:7px 9px;margin:0 0 10px}

  /* ---- set rows ---- */
  .hdr{display:grid;grid-template-columns:28px 1fr 1fr 46px;gap:8px;align-items:center;
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-bottom:4px}
  .row{display:grid;grid-template-columns:28px 1fr 1fr 46px;gap:8px;align-items:center;
    padding:5px 0;border-top:1px solid var(--line-2)}

  /* Active set: the next one due. Grows a little and takes a blue edge; the
     inactive rows keep their 44px touch targets rather than shrinking. */
  /* Full-bleed to the card edges: inset equally on both sides it read as
     stopping short on the right, because the blue bar anchors only the left. */
  .row.active{background:var(--active-bg);box-shadow:inset 3px 0 0 var(--signal);
    margin:0 -12px;padding:5px 12px}
  .row.active .setno{color:var(--signal);font-weight:700}
  .row.active input[type=number]{padding:14px 8px;font-size:21px}
  .row.active .chk{height:48px}
  @media (prefers-reduced-motion:no-preference){
    .row{transition:background .15s}
    .row input[type=number]{transition:padding .15s,font-size .15s}
  }
  /* The weight/reps columns carry a 15px ghost line under the input (2px
     padding + 13px min-height); offset the other columns by the same amount
     so everything centers on the input row, not the input+ghost stack. */
  .setno{font-family:var(--mono);font-size:14px;color:var(--ink-3);text-align:center;margin-bottom:17px}
  .fieldwrap{position:relative}
  /* Sans, not mono, for the logged numbers. Each sits centred in its own grid
     cell, so nothing needed monospace to align - the grid already did that -
     and mono faces run lighter and narrower, which is the thinness that made
     them hard to read at a glance mid-set. tabular-nums keeps the digits even.
     Mono stays on the clocks, where digits change in place and would jitter. */
  input[type=number]{width:100%;appearance:none;-moz-appearance:textfield;border:1px solid var(--line);
    background:var(--field);border-radius:2px;padding:11px 8px 11px;font-family:var(--sans);font-size:19px;
    font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);text-align:center;
    scroll-margin-top:86px;scroll-margin-bottom:24px}
  /* The start/last hint was never styled, so it inherited a dim browser grey.
     It stays clearly dimmer than a typed value: a hint must never be mistaken
     for a logged number. Brighter on the active row, which is the one you read. */
  input[type=number]::placeholder{color:var(--placeholder);font-weight:600}
  .row.active input[type=number]::placeholder{color:var(--ink-3)}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input:focus{outline:2px solid var(--signal);outline-offset:-1px;border-color:var(--signal)}
  .ghost{display:block;font-family:var(--mono);font-size:12px;color:var(--ink-3);text-align:center;padding-top:2px;min-height:15px}
  .chk{width:46px;height:44px;border:1px solid var(--line);background:var(--field);border-radius:2px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;margin-bottom:17px}
  .chk svg{width:18px;height:18px;stroke:var(--line);stroke-width:3;fill:none;stroke-linecap:square}
  .chk[aria-pressed="true"]{background:var(--logged);border-color:var(--logged)}
  .chk[aria-pressed="true"] svg{stroke:#fff}
  .row.logged input{color:var(--ink-2);background:var(--field-logged)}

  /* Warm-up sets: amber, since amber already means sub-maximal here (deload,
     paused). Quieter than the working rows and carrying no checkbox, because a
     warm-up is a record rather than a task. */
  .warmbar{display:flex;gap:1px;background:var(--line-2);margin:2px 0 0}
  .wtoggle{flex:1;appearance:none;border:none;border-left:3px solid var(--deload);
    background:var(--banner-bg);color:var(--deload);font-family:var(--mono);font-size:11px;
    font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-align:left;
    padding:10px;cursor:pointer}
  .wplus{appearance:none;border:none;background:var(--banner-bg);color:var(--deload);
    font-family:var(--mono);font-size:20px;font-weight:700;line-height:1;width:46px;
    cursor:pointer;padding:0}
  .row.warm{border-top:none}
  .row.warm .setno{color:var(--deload)}
  .row.warm input[type=number]{border-color:var(--line-2)}

  /* The Done button only has to dismiss the keyboard - the note saves as you
     type - so it stays out of the way until the field is actually in use.
     visibility rather than display keeps its space reserved, or the textarea
     would resize under your thumb mid-sentence. */
  .noterow{display:flex;align-items:flex-end;gap:8px;border-top:1px solid var(--line-2);margin-top:6px}
  .noteDone{flex:none;visibility:hidden;appearance:none;border:1px solid var(--line-2);
    background:transparent;color:var(--ink-2);font-family:var(--mono);font-size:11px;font-weight:600;
    letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;border-radius:2px;cursor:pointer;
    margin-bottom:6px}
  .noterow:focus-within .noteDone{visibility:visible}
  .note{width:100%;border:none;background:transparent;padding:9px 2px;
    font-family:var(--sans);font-size:14px;color:var(--ink-2);resize:none}
  .note:focus{outline:none;color:var(--ink)}
  .note::placeholder{color:var(--placeholder)}

  /* ---- progression suggestion + feedback ---- */
  .suggest{font-family:var(--mono);font-size:13px;color:var(--ink-2);border-left:2px solid var(--signal);
    padding:6px 9px;margin:0 0 10px}
  .suggest.warn{border-left-color:var(--deload)}
  .fbrow{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line-2)}
  .fbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}
  .fb{appearance:none;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);
    font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:11px 12px;border-radius:2px;cursor:pointer}
  .fb[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .fbpain{margin-left:auto}
  .fbpain[aria-pressed="true"]{background:var(--deload);border-color:var(--deload);color:#fff}

  /* ---- volume sheet ---- */
  /* The tail of the page needs snap points too: under mandatory snapping a
     resting position must BE one, so without these the scroll springs back
     to the last card and the volume table and footer - export, import,
     reset - can never be reached. */
  .vol,.foot{scroll-snap-align:start;scroll-snap-stop:always;scroll-margin-top:78px}
  .vol{margin:18px 14px 0;border-top:1px solid var(--line)}
  .vol summary{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-2);padding:12px 0;cursor:pointer;list-style:none}
  .vol summary::-webkit-details-marker{display:none}
  .vol summary::after{content:" +";color:var(--ink-3)}
  .vol[open] summary::after{content:" –"}
  .voltbl{display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;font-family:var(--mono);font-size:12px;padding-bottom:14px}
  .voltbl div{padding:3px 0;border-bottom:1px solid var(--line-2)}
  .voltbl .h{color:var(--ink-3);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  .bar{height:6px;background:var(--signal);display:inline-block;vertical-align:middle}
  .foot{padding:22px 14px 96px;font-size:12px;color:var(--ink-3);line-height:1.5}
  .foot button{background:none;border:none;color:var(--ink-3);font-size:12px;text-decoration:underline;padding:0;cursor:pointer;font-family:var(--sans)}
  .saving{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:7px 14px;border-radius:2px;opacity:0;
    transition:opacity .18s;pointer-events:none;z-index:40}
  .saving.on{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brandrow">
      <div class="brand">Meso 01 · Rebalanced</div>
      <div class="hright">
        <div class="rir" id="rirLabel"></div>
        <button class="themeBtn" id="themeBtn" aria-label="Color theme">auto</button>
      </div>
    </div>
    <div class="seg weeks" id="weekSeg"></div>
    <div class="seg days" id="daySeg"></div>
    <div class="daymeta"><span id="dayFocus"></span></div>
  </header>
  <div class="dash">
    <button class="dcell" id="sessBtn" aria-label="Session stopwatch: tap to start or stop">
      <span class="dlabel">Session</span><span class="dval" id="sessVal">0:00</span>
    </button>
    <button class="dcell" id="restBtn" aria-label="Rest stopwatch: tap to start or stop">
      <span class="dlabel">Rest</span><span class="dval" id="restVal">0:00</span>
    </button>
    <div class="dcell count" id="setsCell">
      <span class="dlabel">Sets left</span><span class="dval" id="setsLeft">0</span>
    </div>
  </div>
  <div id="bannerSlot"></div>
  <div id="days"></div>
  <details class="vol">
    <summary>Weekly sets by muscle</summary>
    <div class="voltbl" id="volTbl"></div>
  </details>
  <div class="foot">
    Log working sets only — keep warm-ups off the sheet. Hit the top of the rep range on every set at the
    target RIR and add load next week; otherwise repeat the weight and chase reps.
    <br><br>
    <button id="exportBtn">Export data</button> ·
    <button id="importBtn">Import data</button> ·
    <button id="resetBtn">Clear all logged data</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</div>
<div class="saving" id="toast">SAVED</div>
<div id="swapSheet" hidden>
  <div class="sheetBack"></div>
  <div class="sheet">
    <div class="sheetTitle" id="swapTitle"></div>
    <div id="swapOpts"></div>
  </div>
</div>

<script>
// Apply a forced theme before first paint so dark mode doesn't flash light.
try{
  const t = JSON.parse(localStorage.getItem("meso-tracker"))?.settings?.theme;
  if(t==="dark"||t==="light") document.documentElement.dataset.theme = t;
}catch(e){}

/* ---- exercise library ----
   INLINED COPY of exercises.json — the JSON file in the repo is the source of
   truth. Edit exercises.json first, then mirror the change here. Inlined
   because fetch() of a local JSON file is blocked under file:// and this page
   must work opened directly from disk. */
const LIBRARY = {
  version: 1,
  slots: {
    chest_incline_press: { label:"Incline press", defaultReps:"8–12" },
    chest_flat_press:    { label:"Flat press",    defaultReps:"8–12" },

// The library entry actually occupying a program slot on a given day —
// the swap replacement if one is stored (and still exists), else the original.
function effectiveLib(dayKey, programId){
  const sw = (LOG.swaps[dayKey] || {})[programId];
  return LIB_EX.get(sw && LIB_EX.has(sw) ? sw : programId);
}

/* A PROGRAM entry resolved against the library into everything the UI needs.
   When the slot is swapped, the replacement brings its own reps/cue/start:
   the PROGRAM overrides were written for the original exercise, so they only
   apply while the original occupies the slot. Set counts always come from
   PROGRAM — the training plan owns volume regardless of what fills the slot. */
function resolveEx(p, dayKey){
  const lib = effectiveLib(dayKey, p.id);
  const swapped = lib.id !== p.id;
  return {
    programId: p.id, id: lib.id, swapped,
    sets: p.sets, start: swapped ? null : p.start,
    name: lib.name, muscle: lib.muscle, unit: lib.unit,
    slot: lib.slot, equipment: lib.equipment, spinalLoad: lib.spinalLoad,
    loadSense: lib.loadSense,          // absent → the engine defaults it to "weight"
    reps: (!swapped ? p.reps : null) ?? lib.reps ?? LIBRARY.slots[lib.slot].defaultReps,
    cue: (!swapped ? p.cue : null) ?? lib.cue ?? null
  };
}

/* ---- storage ----
   Everything lives under one localStorage key as a versioned envelope:
   { schemaVersion, updatedAt, settings, timers, mesos: { <mesoId>: { sets, notes, order, swaps } } }
   settings: { theme: "auto" | "light" | "dark", week, day } — week and day
   are where you left off, so a launch resumes instead of resetting to week 1.
   timers:   { sessionStart, sessionAccum, sessionDay, restStart } — UI state,
   not training data. The session clock pauses, so elapsed is
   sessionAccum + (sessionStart ? now - sessionStart : 0): banked time plus the
   current run. sessionStart null with sessionAccum > 0 means paused.
   sets:  "week|day|exercise id|setIdx" -> {weight, reps, done}  (weight/reps: number or null)
   warmups: "week|day|exercise id|idx" -> {weight, reps}. Deliberately a
   separate map: suggestLoad reads sets only, and a ramp recorded as working
   sets is exactly what the spec's MIXED rule exists to reject.
   notes: "week|day|exercise id" -> string
   order: dayKey -> [program exercise ids], drag-to-reorder override of PROGRAM order
   swaps: dayKey -> { programExId: replacementExId }, same-slot substitutions.
   feedback: "week|day|exercise id" -> {effort, pain}; effort "easy"|"right"|"brutal".
   Feedback is optional and additive: absence is treated as "right" at READ
   time only — stored absence and a stored explicit "right" stay distinct.
   Sets/notes key by the EFFECTIVE (displayed) id, so each exercise keeps its
   own history and swapping back restores it; order and swaps key by the
   PROGRAM id, which names the slot occupant and never changes.
   Keyed by stable library exercise id (since v4; names before that), so
   renames, reorders and swaps never mislabel old logs.
   Bump SCHEMA_VERSION and add MIGRATIONS[oldVersion] when the shape changes. */
const STORE_KEY = "meso-tracker";
const SCHEMA_VERSION = 10;
const MESO_ID = "meso01";

/* v3 -> v4: exact display-name -> library-id table for every exercise that has
   ever appeared in PROGRAM. No fuzzy matching — a key segment either matches a
   row here verbatim or the key is left untouched (with a console warning). */
const NAME_TO_ID = {
  "Incline Dumbbell Press":            "inc_db_press",
  "Dumbbell Shoulder Press (Seated)":  "db_shoulder_press",
  "Machine Flye":                      "machine_flye",
  "Cable Triceps Pushdown (Bar)":      "cable_pushdown_bar",
  "Dumbbell Lateral Raise":            "db_lateral_raise",
  "Cable Rope Facepull":               "cable_facepull",
  "Barbell Squat (High Bar)":          "bb_squat_high",
  "Lat Pulldown":                      "lat_pulldown",
  "Chest-Supported Row":               "row_chest_supported",
  "EZ Bar Preacher Curl":              "ez_preacher_curl",
  "Dumbbell Curl (Incline)":           "db_curl_incline",
  "Leg Extension":                     "leg_extension",
  "Push-Up":                           "pushup",
  "Dumbbell Upright Row":              "db_upright_row",
  "Cable Rear Delt Flye":              "cable_rear_delt_flye",
  "Single-Arm Dumbbell Row":           "row_db_single",
  "Barbell Good Morning (High Bar)":   "bb_good_morning",
  "Seated Leg Curl":                   "leg_curl_seated",
  "EZ Bar Curl (Wide Grip)":           "ez_curl_wide"
};

// MIGRATIONS[n] upgrades a store from schemaVersion n to n+1.
const MIGRATIONS = {
  // v2 added per-day exercise order overrides
  1: s => { Object.values(s.mesos).forEach(m => { m.order = m.order || {}; }); return s; },
  // v3 added app settings (theme)
  2: s => { s.settings = s.settings || {theme:"auto"}; return s; },
  // v4 rekeyed sets/notes/order from display names to library ids
  3: s => {
    backupRaw(JSON.stringify(s));
    const warn = k => { if(!LIB_EX.has(k)) console.warn(`meso-tracker v3→v4: no id mapping for "${k}" — left as-is`); };
    const rekey = (obj, nameAt) => {
      const out = {};
      Object.entries(obj || {}).forEach(([k,v])=>{
        const p = k.split("|");
        if(p.length > nameAt && NAME_TO_ID[p[nameAt]]){
          p[nameAt] = NAME_TO_ID[p[nameAt]];
          out[p.join("|")] = v;
        }else{
          if(p.length > nameAt) warn(p[nameAt]);
          out[k] = v;
        }
      });
      return out;
    };
    Object.values(s.mesos).forEach(m=>{
      m.sets  = rekey(m.sets, 2);
      m.notes = rekey(m.notes, 2);
      Object.keys(m.order || {}).forEach(d=>{
        m.order[d] = m.order[d].map(n => { if(NAME_TO_ID[n]) return NAME_TO_ID[n]; warn(n); return n; });
      });
    });
    return s;
  },
  // v5 added per-day same-slot exercise swaps
  4: s => { Object.values(s.mesos).forEach(m => { m.swaps = m.swaps || {}; }); return s; },
  // v6 added per-exercise progression feedback. Purely additive: an empty
  // container only — no defaults backfilled, logged sets untouched.
  5: s => {
    backupRaw(JSON.stringify(s));
    Object.values(s.mesos).forEach(m => { m.feedback = m.feedback || {}; });
    return s;
  },
  // v7 added the session and rest stopwatches. Envelope-level UI state, not
  // training data: two timestamps or null, nothing per-meso touched.
  6: s => { s.timers = s.timers || {sessionStart:null, restStart:null}; return s; },
  // v8 made the session clock pausable, which a lone start timestamp cannot
  // express: banked time and the day it belongs to are additive fields.
  7: s => {
    const t = s.timers = s.timers || {};
    if(t.sessionStart === undefined) t.sessionStart = null;
    if(t.restStart === undefined) t.restStart = null;
    t.sessionAccum = t.sessionAccum || 0;
    // A v7 session already running has no day stamp; derive it from its own
    // start, or it would keep counting straight through tomorrow.
    if(!t.sessionDay && t.sessionStart){
      const d = new Date(t.sessionStart), z = v => String(v).padStart(2,"0");
      t.sessionDay = d.getFullYear() + "-" + z(d.getMonth()+1) + "-" + z(d.getDate());
    }
    t.sessionDay = t.sessionDay || null;
    return s;
  },
  // v9 added warm-up sets in their own map, so they never reach the
  // progression engine, the set counter or the active-set marker.
  8: s => { Object.values(s.mesos).forEach(m => { m.warmups = m.warmups || {}; }); return s; },
  // v10 remembers the week and day you were last on.
  9: s => {
    s.settings = s.settings || {};
    if(s.settings.week === undefined) s.settings.week = 1;
    if(s.settings.day === undefined) s.settings.day = "mon";
    return s;
  }
};

function freshStore(){
  return {schemaVersion:SCHEMA_VERSION, updatedAt:null, settings:{theme:"auto"},
          timers:{sessionStart:null, sessionAccum:0, sessionDay:null, restStart:null}, mesos:{}};
}

function migrate(store){
  while(store.schemaVersion < SCHEMA_VERSION){
    const step = MIGRATIONS[store.schemaVersion];
    if(!step){ backupRaw(JSON.stringify(store)); return freshStore(); }
    store = step(store);
    store.schemaVersion++;
  }
  return store;
}

// Parked, never overwritten by the app — recoverable by hand if something goes wrong.
function backupRaw(raw){ try{ localStorage.setItem(STORE_KEY+".backup", raw); }catch(e){} }

const storage = {
  async get(){
    const raw = localStorage.getItem(STORE_KEY);
    if(raw === null) return freshStore();
    let s = null;
    try{ s = JSON.parse(raw); }catch(e){}
    if(!s || typeof s !== "object" || typeof s.schemaVersion !== "number"){
      backupRaw(raw);
      return freshStore();
    }
    return migrate(s);
  },
  async set(store){
    store.updatedAt = new Date().toISOString();
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  }
};

let STORE = freshStore();
let LOG = {sets:{}, notes:{}};
let W = 1, D = "mon";

const $ = id => document.getElementById(id);
const cell = (w,d,exId,s) => `${w}|${d}|${exId}|${s}`;

let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await storage.set(STORE);
      const t=$("toast"); t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),900);
    }catch(err){
      const t=$("toast"); t.textContent="NOT SAVED — RETRY"; t.classList.add("on");
      setTimeout(()=>{t.classList.remove("on");t.textContent="SAVED";},2200);
    }
  }, 500);
}

async function load(){
  STORE = await storage.get();
  STORE.settings = STORE.settings || {theme:"auto"};
  // Resume where we left off, refusing anything the PROGRAM no longer contains.
  const dayKeys = PROGRAM.days.map(d => d.key);
  const savedW = Number(STORE.settings.week);
  W = (savedW >= 1 && savedW <= PROGRAM.weeks.length) ? savedW : 1;
  D = dayKeys.includes(STORE.settings.day) ? STORE.settings.day : dayKeys[0];

  STORE.timers = STORE.timers || {sessionStart:null, sessionAccum:0, sessionDay:null, restStart:null};
  // A session belongs to a day, so yesterday's never greets you paused today.
  if(STORE.timers.sessionDay && STORE.timers.sessionDay !== todayKey()){
    STORE.timers.sessionStart = null; STORE.timers.sessionAccum = 0; STORE.timers.sessionDay = null;
  }
  // A rest clock still running hours later was forgotten, not rested.
  if(STORE.timers.restStart && Date.now() - STORE.timers.restStart > 6*3600*1000) STORE.timers.restStart = null;
  if(!STORE.mesos[MESO_ID]) STORE.mesos[MESO_ID] = {sets:{}, notes:{}, order:{}, swaps:{}, feedback:{}, warmups:{}};
  LOG = STORE.mesos[MESO_ID];
  LOG.sets = LOG.sets || {};
  LOG.notes = LOG.notes || {};
  LOG.order = LOG.order || {};
  LOG.swaps = LOG.swaps || {};
  LOG.feedback = LOG.feedback || {};
  LOG.warmups = LOG.warmups || {};
}

/* ---- load progression rule engine ----
   Encodes load-progression-spec.md v1.4 verbatim. Pure function: plain data
   in, the §5.1 contract out — {class, outcome, load, text}. No DOM, no
   storage, no globals; callable from a console.
   §5.1 invariant: `class` is non-null if and only if `outcome` came from the
   §8 matrix. Every path that short-circuits inside §6 returns class null.
   `weekSets` maps week number → that week's logged sets; the suggestion for
   week N reads week N−1, and §7/§7.1's deload cascades walk weeks 3, 2, 1.
   `step` must already include any per-exercise override. */
const WEEK_RIR_TEXT = {1:"3", 2:"2", 3:"1", 4:"4–5"};

function suggestLoad({weekSets, prescribed, range, step, loadSense, feedback, currentWeek, startLoad, rir}){
  rir = rir ?? WEEK_RIR_TEXT[currentWeek] ?? "";
  const sense  = loadSense ?? "weight";                      // §1: absent → "weight"
  const effort = (feedback && feedback.effort) || "right";   // §1: absent → "right"
  const pain   = !!(feedback && feedback.pain);
  const bottom = range.bottom, top = range.top;

  // §1: a set qualifies on reps > 0; the done checkbox is ignored.
  const qual = w => ((weekSets && weekSets[w]) || []).filter(s => typeof s.reps === "number" && s.reps > 0);
  const oneLoad = q => q.length && q.every(s => s.weight === q[0].weight) ? q[0].weight : null;

  const q = qual(currentWeek - 1);
  const n = q.length, first = q[0], last = q[n-1];
  const load = oneLoad(q);
  const mixedLoad = n > 0 && load === null;

  const ret = (outcome, text, l = null, cls = null) => ({class: cls, outcome, load: l, text});

  // §7 / §7.1 — one cascade, two terminal operations.
  const deloadBase = () => {
    for(const w of [3, 2, 1]){
      const l = oneLoad(qual(w));
      if(l !== null) return l;
    }
    return startLoad ?? null;
  };

  // ---- §5 dispatch: load sense first, before any data-shape rule ----

  if(sense === "none"){                                      // §6.1
    if(currentWeek === 4)  return ret("DELOAD_BW", "deload — stop 4–5 shy of failure");
    if(pain)               return ret("PAIN_BW", "pain flagged — go easier or swap the movement");
    if(n === 0)            return ret("NO_DATA_BW", "2 shy of failure");
    if(n < prescribed)     return ret("INCOMPLETE_BW", `beat ${last.reps} — finish all ${prescribed} sets`);
    return ret("BW_PROGRESS", `beat ${last.reps} on the last set`);
  }

  if(sense === "assist"){                                    // §6.2
    if(currentWeek === 4){
      const base = deloadBase();
      if(base === null)    return ret("DELOAD_ASSIST", "deload — more assistance, stop early");
      const dl = base + step;                                // §7.1
      return ret("DELOAD_ASSIST", `${dl} — ${rir} RIR, stop early`, dl);
    }
    if(pain)               return ret("PAIN_ASSIST", "pain flagged — more assistance or swap the movement");
    if(n === 0)            return ret("NO_DATA", `find it — ${top} reps, ${rir} in reserve`);
    if(mixedLoad)          return ret("MIXED", "pick one assist level and hold it");
    if(n < prescribed)     return ret("INCOMPLETE", `repeat ${load} assist — finish all ${prescribed} sets`, load);
  }

  if(sense === "weight"){                                    // §6.3
    if(currentWeek === 4){
      const base = deloadBase();
      if(base === null)    return ret("DELOAD", `about two-thirds of your usual — ${rir} RIR, stop early`);
      const dl = Math.max(step, Math.floor(base * 0.70 / step) * step);   // §7
      return ret("DELOAD", `${dl} — ${rir} RIR, stop early`, dl);
    }
    if(n === 0){
      if(startLoad != null) return ret("NO_DATA", `start ${startLoad}`, startLoad);
      return ret("NO_DATA", `find it — ${top} reps, ${rir} in reserve`);
    }
    if(pain)               return ret("PAIN", "pain flagged — go lighter or swap the movement");
    if(mixedLoad)          return ret("MIXED", "pick one weight and hold it");
    if(n < prescribed)     return ret("INCOMPLETE", `repeat ${load} — finish all ${prescribed} sets`, load);
  }

  // ---- §3 classification: sense-agnostic, reads reps only ----
  let cls = first.reps < bottom ? "P_FAIL"
          : last.reps  < bottom ? "P_DROP"
          : first.reps >= top   ? "P_PASS"
          : "P_HOLD";

  /* §4 — the two proportionality rules (this gate and §2's double-step
     clause) both compute from jumpPct, undefined for "none" and meaningless
     for "assist". One guard governs both, as the spec states it once. */
  const proportional = sense === "weight";
  let requiredReps = null, inc = step;
  if(proportional){
    const jumpPct = step / load;
    if(cls === "P_PASS"){
      requiredReps = bottom + Math.ceil(jumpPct / 0.03);
      if(requiredReps > top + 6)         cls = "P_UNPROGRESSABLE";
      else if(first.reps < requiredReps) cls = "P_GATED";
    }
    if(cls === "P_PASS" && jumpPct < 0.03 && first.reps >= top + 2) inc = 2 * step;   // §2
  }

  // ---- §8 matrix: class × effort → outcome (P_FAIL ignores effort) ----
  const outcome =
      cls === "P_PASS"           ? (effort === "brutal" ? "HOLD_RIR" : "ADD")
    : cls === "P_GATED"          ? (effort === "brutal" ? "HOLD" : "HOLD_GATE")
    : cls === "P_UNPROGRESSABLE" ? "HOLD"
    : cls === "P_HOLD"           ? (effort === "easy" ? "HOLD_PUSH" : "HOLD")
    : cls === "P_DROP"           ? "HOLD"
    : "REDUCE";

  if(sense === "assist"){                                    // §6.2 matrix text
    switch(outcome){
      case "ADD":
        if(load === 0)       return ret("ADD", "unassisted — switch to Pull-Up", null, cls);
        if(load - inc <= 0)  return ret("ADD", `${load} ✓ → try it unassisted`, 0, cls);
        return ret("ADD", `${load} ✓ → drop assist to ${load - inc}`, load - inc, cls);
      case "REDUCE":    return ret("REDUCE", `add assist to ${load + step} — ${bottom}+ clean`, load + step, cls);
      case "HOLD_RIR":  return ret("HOLD_RIR", `repeat ${load} assist — same reps, more in reserve`, load, cls);
      case "HOLD_PUSH": return ret("HOLD_PUSH", `repeat ${load} assist — take it closer to ${rir} RIR`, load, cls);
      default:          return ret("HOLD", `repeat ${load} assist — chase ${top}+`, load, cls);
    }
  }
  switch(outcome){                                           // §8 text, sense weight
    case "ADD":       return ret("ADD", `${load} ✓ → try ${load + inc}`, load + inc, cls);
    case "HOLD_RIR":  return ret("HOLD_RIR", `repeat ${load} — same reps, more in reserve`, load, cls);
    case "HOLD_GATE": return ret("HOLD_GATE", `repeat ${load} — need ${requiredReps}+ before ${load + step}`, load, cls);
    case "HOLD_PUSH": return ret("HOLD_PUSH", `repeat ${load} — take it closer to ${rir} RIR`, load, cls);
    case "REDUCE": {
      const down = Math.max(step, load - step);
      return ret("REDUCE", `drop to ${down} — ${bottom}+ clean`, down, cls);
    }
    default: return cls === "P_UNPROGRESSABLE"
      ? ret("HOLD", `${step} is too big a jump here — hold ${load} and add reps`, load, cls)
      : ret("HOLD", `repeat ${load} — chase ${top}+`, load, cls);
  }
}

function dayObj(){ return PROGRAM.days.find(d=>d.key===D); }
function weekObj(){ return PROGRAM.weeks[W-1]; }

// Today's exercises, resolved against the library, in display order: the
// saved drag order if there is one, with any exercise not in it (added to
// PROGRAM later) appended in PROGRAM order.
function exList(){
  const d = dayObj();
  const list = d.ex.map(p=>resolveEx(p, d.key));
  const ord = LOG.order[d.key];
  if(!ord || !ord.length) return list;
  const byId = new Map(list.map(e=>[e.programId,e]));
  const out = [];
  ord.forEach(id=>{ if(byId.has(id)){ out.push(byId.get(id)); byId.delete(id); } });
  byId.forEach(e=>out.push(e));
  return out;
}

/* ---- wiring: stored data -> suggestLoad inputs ---- */
const REP_RANGE_RE = /^(\d+)\s*[–-]\s*(\d+)$/;
function parseRange(reps){
  const m = REP_RANGE_RE.exec(reps || "");
  return m ? {bottom:+m[1], top:+m[2]} : null;
}

// §2: smallest step physically available; a per-exercise step override wins.
const EQUIP_STEP = [["dumbbell",5],["barbell",5],["cable",10],["machine",10],
                    ["leg press",10],["hack squat",10],["assisted pull-up machine",10]];
function stepFor(ex){
  const lib = LIB_EX.get(ex.id);
  if(typeof lib.step === "number") return lib.step;
  for(const [eq, st] of EQUIP_STEP) if(ex.equipment.includes(eq)) return st;
  return 5;
}

// Suggestion for the current week from last week's data, same (day, exerciseId).
// A swapped-in exercise has no sets under its id -> NO_DATA; never inherited.
function suggestFor(ex){
  // Every week's logged sets for this exercise: the engine reads week W−1 for
  // the suggestion and walks 3/2/1 for the §7 and §7.1 deload cascades.
  const weekSets = {};
  PROGRAM.weeks.forEach(w => {
    const arr = [];
    for(let si = 0; si < ex.sets[w.n-1]; si++){
      const c = LOG.sets[cell(w.n, D, ex.id, si)];
      if(c) arr.push({weight: c.weight, reps: c.reps});
    }
    weekSets[w.n] = arr;
  });
  return suggestLoad({
    weekSets,
    prescribed: W > 1 ? ex.sets[W-2] : 0,
    range: parseRange(ex.reps) || {bottom:0, top:0},
    step: stepFor(ex),
    loadSense: ex.loadSense,
    feedback: LOG.feedback[`${W-1}|${D}|${ex.id}`] || null,
    currentWeek: W,
    startLoad: ex.start,
    rir: weekObj().rir
  });
}

/* ---- where to open ----
   A day is done when every working set on it is checked off; warm-ups are not
   sets and never count. On launch we step forward from wherever we left off,
   past days already finished, and stop at the first one with work left. We
   only ever move forward: a finished week 1 should not drag you back to it,
   and nothing left to do means stay put rather than wrap around.

   The advance happens at load rather than the moment the last set is checked,
   so finishing a session never yanks the screen away while you are still
   looking at what you just did. */
function dayComplete(w, dayKey){
  const day = PROGRAM.days.find(x => x.key === dayKey);
  if(!day) return false;
  return day.ex.every(p => {
    const ex = resolveEx(p, dayKey);
    for(let si = 0; si < ex.sets[w-1]; si++)
      if(!LOG.sets[cell(w, dayKey, ex.id, si)]?.done) return false;
    return true;
  });
}

function openAtNextUnfinished(){
  const keys = PROGRAM.days.map(d => d.key);
  let w = W, i = keys.indexOf(D);
  if(i < 0) return;
  while(w <= PROGRAM.weeks.length){
    if(!dayComplete(w, keys[i])){ W = w; D = keys[i]; return; }
    if(++i >= keys.length){ i = 0; w++; }
  }
  // every day from here on is finished — leave the saved position alone
}

function rememberPlace(){
  STORE.settings.week = W;
  STORE.settings.day = D;
  save();
}

function renderHeader(){
  $("weekSeg").innerHTML = PROGRAM.weeks.map(w=>
    `<button data-w="${w.n}" class="${w.n===4?'dl':''}" aria-pressed="${w.n===W}">Wk ${w.n}</button>`).join("");
  $("daySeg").innerHTML = PROGRAM.days.map(d=>
    `<button data-d="${d.key}" aria-pressed="${d.key===D}">${d.label}</button>`).join("");
  $("rirLabel").innerHTML = `Target RIR <b>${weekObj().rir}</b>`;

/* ---- warm-up sets ----
   Kept out of LOG.sets on purpose. suggestLoad, setsLeft and activeKey all
   read working sets only, so warm-ups cannot skew a suggestion, the count of
   sets remaining, or where the active marker sits. Open state and row count
   live in memory: they are view state, not training data. */
const warmKey = (w,d,exId,i) => `${w}|${d}|${exId}|${i}`;
const warmUi = ex => `${W}|${D}|${ex.id}`;
const warmOpenState = new Map();   // ui key -> bool; absent means "open if there is data"
const warmShown = new Map();       // ui key -> how many rows to draw

function warmCount(ex){
  let n = 0;
  for(let i = 0; i < 20; i++) if(LOG.warmups[warmKey(W,D,ex.id,i)]) n = i + 1;
  return n;
}
function warmIsOpen(ex){
  const k = warmUi(ex);
  return warmOpenState.has(k) ? warmOpenState.get(k) : warmCount(ex) > 0;
}
function warmRowCount(ex){
  return Math.max(warmCount(ex), warmShown.get(warmUi(ex)) || 1);
}

function warmSection(ex, ei){
  const open = warmIsOpen(ex), n = warmCount(ex);
  const bar = `<div class="warmbar">
        <button class="wtoggle" data-warm="${ei}" aria-expanded="${open}">Warm up${n ? ` · ${n}` : ""}</button>
        ${open ? `<button class="wplus" data-warmadd="${ei}" aria-label="Add a warm-up set">+</button>` : ""}
      </div>`;
  if(!open) return bar;
  const rows = Array.from({length: warmRowCount(ex)}, (_, i) => {
    const c = LOG.warmups[warmKey(W,D,ex.id,i)] || {};
    return `<div class="row warm">
        <div class="setno">W${i+1}</div>
        <div class="fieldwrap">
          <input type="number" inputmode="decimal" step="0.5" data-wf="w" data-e="${ei}" data-i="${i}"
            value="${c.weight ?? ""}">
          <span class="ghost"></span>
        </div>
        <div class="fieldwrap">
          <input type="number" inputmode="numeric" data-wf="r" data-e="${ei}" data-i="${i}"
            value="${c.reps ?? ""}">
          <span class="ghost"></span>
        </div>
        <div></div>
      </div>`;
  }).join("");
  return bar + rows;
}

      <div class="hdr"><div></div><div>Weight</div><div>Reps</div><div></div></div>
      ${warmSection(ex, ei)}
      ${rows}
      <div class="fbrow">
        <span class="fbl">felt</span>

          `<button class="fb" data-fb="${o}" data-e="${ei}" aria-pressed="${fb.effort===o}">${o}</button>`).join("")}

      </div>

      </div>
    </div>`;
  }).join("");
  paintActive();
}

function renderVolume(){
  const tally = {};
  PROGRAM.days.forEach(d=>d.ex.forEach(ex=>{
    const m = effectiveLib(d.key, ex.id).muscle;
    tally[m] = (tally[m]||0) + ex.sets[W-1];
  }));
  const entries = Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  const max = Math.max(...entries.map(e=>e[1]));
  $("volTbl").innerHTML = `<div class="h">Muscle</div><div class="h">Sets</div><div class="h"></div>` +
    entries.map(([m,v])=>`<div>${m}</div><div style="text-align:right">${v}</div>
      <div><span class="bar" style="width:${Math.round(v/max*72)}px"></span></div>`).join("");
}

/* ---- dashboard: two stopwatches and a live set count ----
   Each stopwatch stores a start timestamp and derives elapsed on every tick,
   so it stays correct across a phone lock or a PWA restart. Accumulating a
   counter instead would drift or freeze the moment the browser throttles us. */
const fmtClock = ms => {
  const t = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  const pad = v => String(v).padStart(2,"0");
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
};

function setsLeft(){
  let left = 0;
  exList().forEach(ex => {
    for(let si = 0; si < ex.sets[W-1]; si++)
      if(!LOG.sets[cell(W,D,ex.id,si)]?.done) left++;
  });
  return left;
}

const todayKey = () => {
  const d = new Date(), p = v => String(v).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
};

/* Session clock: idle -> running -> paused -> running. Tap cycles; a long
   press zeroes it. Elapsed is banked time plus the current run, so pausing
   never loses the reading and nothing accumulates tick by tick. */
const sessionElapsed = () => {
  const t = STORE.timers;
  return t.sessionAccum + (t.sessionStart ? Date.now() - t.sessionStart : 0);
};
const sessionState = () => {
  const t = STORE.timers;
  return t.sessionStart ? "running" : (t.sessionAccum > 0 ? "paused" : "idle");
};

function sessionPause(){
  const t = STORE.timers;
  if(!t.sessionStart) return;
  t.sessionAccum += Date.now() - t.sessionStart;
  t.sessionStart = null;
  save(); tickDash(); syncWakeLock();
}

function sessionToggle(){
  const t = STORE.timers;
  if(t.sessionStart) return sessionPause();
  t.sessionStart = Date.now();
  t.sessionDay = todayKey();
  save(); tickDash(); syncWakeLock();
}

function sessionZero(){
  const t = STORE.timers;
  t.sessionStart = null; t.sessionAccum = 0; t.sessionDay = null;
  save(); tickDash(); syncWakeLock();
}

function tickDash(){
  const t = STORE.timers, st = sessionState();
  $("sessVal").textContent = st === "idle" ? "0:00" : fmtClock(sessionElapsed());
  $("restVal").textContent = t.restStart ? fmtClock(Date.now() - t.restStart) : "0:00";
  $("sessBtn").classList.toggle("on", st === "running");
  $("sessBtn").classList.toggle("paused", st === "paused");
  $("sessBtn").querySelector(".dlabel").textContent = st === "paused" ? "Paused" : "Session";
  $("restBtn").classList.toggle("on", !!t.restStart);
}

function renderDash(){
  const n = setsLeft();
  $("setsLeft").textContent = n;
  $("setsCell").classList.toggle("done", n === 0);
  $("setsCell").querySelector(".dlabel").textContent = n === 0 ? "Day done" : "Sets left";
  tickDash();
}

setInterval(tickDash, 1000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) tickDash(); });

/* ---- active set: the next one due ----
   First unchecked set in display order, advancing as sets are completed.
   Focusing any input moves the marker there instead, so you can go back. */
let activeOverride = null;

function activeKey(){
  if(activeOverride) return activeOverride;
  const list = exList();
  for(let ei = 0; ei < list.length; ei++)
    for(let si = 0; si < list[ei].sets[W-1]; si++)
      if(!LOG.sets[cell(W,D,list[ei].id,si)]?.done) return `${ei}-${si}`;
  return null;
}

function paintActive(){
  const k = activeKey();
  $("days").querySelectorAll(".row").forEach(r => r.classList.toggle("active", r.dataset.r === k));
}

document.addEventListener("focusin", e => {
  const row = e.target.closest && e.target.closest(".row");
  if(row && row.dataset.r){
    /* Reaching for the set that is due ends the rest period - you are back to
       work - which saves stopping the clock as its own tap and a scroll. Note
       the check runs before the marker moves: touching an already logged row
       is a correction, not the next set, and leaves the clock running. */
    if(row.classList.contains("active") && STORE.timers.restStart){
      STORE.timers.restStart = null; save(); tickDash();
    }
    activeOverride = row.dataset.r; paintActive();
  }
  if(e.target.matches && e.target.matches("input,textarea")) scroller().classList.add("typing");
});
document.addEventListener("focusout", e => {
  if(!(e.target.matches && e.target.matches("input,textarea"))) return;
  // Deferred: moving between two fields fires focusout before the next focusin,
  // and dropping the class in between would let a snap fire mid-hop.
  setTimeout(() => {
    const a = document.activeElement;
    if(!a || !a.matches || !a.matches("input,textarea")) scroller().classList.remove("typing");
  }, 0);
});

function render(){ renderHeader(); renderDay(); renderVolume(); renderDash(); }

function toastMsg(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("on");
  setTimeout(()=>{t.classList.remove("on"); t.textContent="SAVED";},1400);
}

/* ---- theme ---- */
function applyTheme(){
  const t = STORE.settings.theme;
  if(t==="dark"||t==="light") document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  $("themeBtn").textContent = t;
}

/* ---- export / import ----
   Export downloads the whole envelope verbatim. Import validates and migrates
   a parsed copy first, then stashes the current envelope under .backup and
   swaps in the file — all-or-nothing, storage is never half-written. The
   file's own updatedAt is kept (storage.set would restamp it). */
function exportData(){
  const d = new Date();
  const pad = n => String(n).padStart(2,"0");
  const name = `meso-tracker-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;
  const url = URL.createObjectURL(new Blob([JSON.stringify(STORE,null,2)], {type:"application/json"}));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toastMsg("EXPORTED");
}

function describeEnvelope(s){
  let sets=0, notes=0;
  Object.values(s.mesos||{}).forEach(m=>{
    sets += Object.keys(m.sets||{}).length;
    notes += Object.keys(m.notes||{}).length;
  });
  return `${sets} logged sets, ${notes} notes` + (s.updatedAt ? `, saved ${s.updatedAt.slice(0,10)}` : "");
}

async function importData(text){
  let s;
  try{ s = JSON.parse(text); }
  catch(err){ alert("Import failed: the file isn't valid JSON."); return false; }
  if(!s || typeof s!=="object" || Array.isArray(s)){
    alert(`Import failed: expected a JSON object, got ${Array.isArray(s)?"an array":typeof s}.`); return false;
  }
  if(typeof s.schemaVersion!=="number"){
    alert("Import failed: no schemaVersion field — this doesn't look like a meso-tracker export."); return false;
  }
  if(s.schemaVersion > SCHEMA_VERSION){
    alert(`Import failed: the file is schema v${s.schemaVersion}, but this app only knows v${SCHEMA_VERSION}. Update the app, then import.`); return false;
  }
  if(!s.mesos || typeof s.mesos!=="object" || Array.isArray(s.mesos)){
    alert("Import failed: no mesos object — this doesn't look like a meso-tracker export."); return false;
  }
  for(let v=s.schemaVersion; v<SCHEMA_VERSION; v++){
    if(!MIGRATIONS[v]){ alert(`Import failed: no migration path from schema v${s.schemaVersion} to v${SCHEMA_VERSION}.`); return false; }
  }
  while(s.schemaVersion < SCHEMA_VERSION){
    s = MIGRATIONS[s.schemaVersion](s);
    s.schemaVersion++;
  }
  if(!confirm(`Replace what's on this device (${describeEnvelope(STORE)}) with the file (${describeEnvelope(s)})?\n\nThe current data is stashed under the backup key first.`)) return false;
  backupRaw(JSON.stringify(STORE));
  localStorage.setItem(STORE_KEY, JSON.stringify(s));
  await load();
  applyTheme();
  render();
  toastMsg("IMPORTED");
  return true;
}

$("importFile").addEventListener("change", async e=>{
  const f = e.target.files[0];
  e.target.value = "";
  if(f) importData(await f.text());
});

/* ---- hold-and-drag to reorder exercises ----
   Hold the exercise header ~1/3s, then drag. Before the hold completes the
   gesture stays a normal scroll; after it completes, touchmove is prevented
   (non-passive) so the browser never hijacks the drag as a scroll. A fixed-
   position clone follows the finger while the real card re-slots live. */
const HOLD_MS = 350, DRAG_SLOP = 12, EDGE = 70, EDGE_SPEED = 8;
const scroller = () => document.querySelector(".wrap");
let drag = null;

function commitOrder(){
  const now = [...$("days").querySelectorAll(".card")].map(c=>c.dataset.ex);
  if(now.join("|") !== exList().map(x=>x.id).join("|")){
    LOG.order[D] = now;
    save();
  }
}

/* Move at most one place per call, and only past an immediate neighbour's
   midpoint. Scanning every card for an absolute answer meant any layout shift
   - a collapsing slot, a clamped scroll - could re-slot the card several
   positions at once, which is what made an upward drag lurch downward first
   and buzz repeatedly while it settled. Neighbour-relative steps cannot
   cascade, and they cannot oscillate either: after a swap the card sits in the
   space the neighbour vacated, which is past that neighbour's new midpoint. */
function placeSrc(y){
  const cards = [...$("days").children].filter(c => c.classList.contains("card"));
  const i = cards.indexOf(drag.card);
  if(i < 0) return;
  const prev = cards[i-1], next = cards[i+1];
  if(prev){
    const r = prev.getBoundingClientRect();
    if(y < r.top + r.height/2){ prev.before(drag.card); dragStep(); return; }
  }
  if(next){
    const r = next.getBoundingClientRect();
    if(y > r.top + r.height/2){ next.after(drag.card); dragStep(); return; }
  }
}

// One short blip per position crossed. Paced by the finger now, not by the
// animation frame, so a slow drag ticks once per card rather than rattling.
function dragStep(){ if(navigator.vibrate) navigator.vibrate(10); }

function beginDrag(){
  if(!drag) return;
  const r = drag.card.getBoundingClientRect();
  const g = document.createElement("div");
  g.className = "drag-ghost";
  const line = (cls, txt) => { const d = document.createElement("div"); d.className = cls; d.textContent = txt; return d; };
  g.appendChild(line("tag", drag.card.querySelector(".tag").textContent));
  g.appendChild(line("exname", drag.card.querySelector(".exname").textContent));
  g.style.width = r.width+"px"; g.style.left = r.left+"px"; g.style.top = r.top+"px";
  document.body.appendChild(g);
  // Hang the chip from the middle so it sits under the finger rather than
  // wherever on a tall card the grab happened to land.
  drag.grabDY = g.getBoundingClientRect().height/2;
  g.style.top = (drag.startY - drag.grabDY)+"px";
  drag.ghost = g;
  // Freeze the list's height for the drag. Collapsing a 600px card to a 56px
  // slot removes enough content that a scrolled container clamps its scroll
  // position, and everything lurches under the finger.
  const days = $("days");
  days.style.minHeight = days.getBoundingClientRect().height + "px";
  drag.card.classList.add("drag-src");
  scroller().classList.add("dragging");
  document.body.classList.add("no-select");
  drag.started = true;
  drag.lastY = drag.startY;
  if(navigator.vibrate) navigator.vibrate(15);
  drag.raf = requestAnimationFrame(dragTick);
}

function dragTick(){
  if(!drag || !drag.started) return;
  const y = drag.lastY;
  // Re-slot from the frame loop only while the edge is actually scrolling the
  // list past a stationary finger. Otherwise the finger drives it, which is
  // what keeps one buzz meaning one card.
  let scrolling = false;
  if(y < EDGE){ scroller().scrollBy(0, -EDGE_SPEED); scrolling = true; }
  else if(y > innerHeight - EDGE){ scroller().scrollBy(0, EDGE_SPEED); scrolling = true; }
  if(scrolling) placeSrc(y);
  drag.raf = requestAnimationFrame(dragTick);
}

function dragMove(e){
  if(!drag || e.pointerId !== drag.pid) return;
  if(!drag.started){
    if(Math.hypot(e.clientX-drag.startX, e.clientY-drag.startY) > DRAG_SLOP) endDrag(false);
    return;
  }
  drag.lastY = e.clientY;
  drag.ghost.style.top = (e.clientY - drag.grabDY)+"px";
  placeSrc(e.clientY);
}

function dragUp(e){ if(drag && e.pointerId === drag.pid) endDrag(true); }
function dragCancel(e){ if(drag && e.pointerId === drag.pid) endDrag(false); }
function preventScroll(e){ if(drag && drag.started) e.preventDefault(); }

function endDrag(commit){
  clearTimeout(drag.timer);
  cancelAnimationFrame(drag.raf);
  if(drag.ghost) drag.ghost.remove();
  $("days").style.minHeight = "";
  drag.card.classList.remove("drag-src");
  scroller().classList.remove("dragging");
  document.body.classList.remove("no-select");
  document.removeEventListener("pointermove", dragMove);
  document.removeEventListener("pointerup", dragUp);
  document.removeEventListener("pointercancel", dragCancel);
  document.removeEventListener("touchmove", preventScroll);
  const started = drag.started;
  drag = null;
  if(started){
    if(commit) commitOrder();
    renderDay();   // commit or not, redraw from the stored order
  }
}

/* ---- exercise swap sheet ----
   Tap the card's swap button to list same-slot library alternatives. Choosing
   one stores swaps[day][programId] = replacementId; choosing the original
   removes the override. Logged sets are never touched — each exercise's
   history lives under its own id, so swapping back restores it. */
function openSwapSheet(ex){
  $("swapTitle").textContent = `${LIBRARY.slots[ex.slot].label} — swap for`;
  $("swapOpts").innerHTML = LIBRARY.exercises.filter(o=>o.slot===ex.slot).map(o=>{
    const spinal = o.spinalLoad !== ex.spinalLoad
      ? `<div class="ospinal">spinal load ${o.spinalLoad} (current: ${ex.spinalLoad})</div>` : "";
    return `<button class="opt" data-swap-to="${o.id}" data-program="${ex.programId}" aria-pressed="${o.id===ex.id}">
      <div class="oname">${o.name}</div>
      <div class="ometa">${o.equipment.join(" · ")}</div>
      ${spinal}
    </button>`;
  }).join("");
  $("swapSheet").hidden = false;
}

function closeSwapSheet(){ $("swapSheet").hidden = true; }

document.addEventListener("click", e=>{
  const sb = e.target.closest(".swapBtn");
  if(sb){ openSwapSheet(exList()[sb.dataset.e]); return; }
  const opt = e.target.closest(".opt");
  if(opt){
    const pid = opt.dataset.program, to = opt.dataset.swapTo;
    LOG.swaps[D] = LOG.swaps[D] || {};
    if(to === pid) delete LOG.swaps[D][pid];
    else LOG.swaps[D][pid] = to;
    if(!Object.keys(LOG.swaps[D]).length) delete LOG.swaps[D];
    save(); closeSwapSheet(); render();
    return;
  }
  if(e.target.closest(".sheetBack")){ closeSwapSheet(); return; }
});

$("days").addEventListener("pointerdown", e=>{
  if(!e.isPrimary || e.target.closest(".swapBtn,.vidBtn") || !e.target.closest(".exhead")) return;
  drag = {card: e.target.closest(".card"), pid: e.pointerId,
          startX: e.clientX, startY: e.clientY, started: false,
          timer: setTimeout(beginDrag, HOLD_MS)};
  document.addEventListener("pointermove", dragMove);
  document.addEventListener("pointerup", dragUp);
  document.addEventListener("pointercancel", dragCancel);
  document.addEventListener("touchmove", preventScroll, {passive:false});
});

// Android fires a context menu on long-press; keep it off the drag handle.
$("days").addEventListener("contextmenu", e=>{
  if(e.target.closest(".exhead")) e.preventDefault();
});

document.addEventListener("click", e=>{
  const wb = e.target.closest("#weekSeg button");
  if(wb){ W = +wb.dataset.w; activeOverride = null; rememberPlace(); render(); scroller().scrollTo(0,0); return; }
  const db = e.target.closest("#daySeg button");
  if(db){ D = db.dataset.d; activeOverride = null; rememberPlace(); render(); scroller().scrollTo(0,0); return; }
  // Session: tap cycles start / pause / resume. A long press zeroes it, and
  // swallows the click the browser fires afterwards.
  if(e.target.closest("#sessBtn")){
    if(sessLongFired){ sessLongFired = false; return; }
    sessionToggle(); return;
  }
  // Rest is binary — you are resting or you are not.
  if(e.target.closest("#restBtn")){
    STORE.timers.restStart = STORE.timers.restStart ? null : Date.now();
    save(); tickDash(); return;
  }
  const fbBtn = e.target.closest(".fb");
  if(fbBtn){
    const k = `${W}|${D}|${exList()[fbBtn.dataset.e].id}`;
    const cur = LOG.feedback[k] || {};
    const v = fbBtn.dataset.fb;
    if(v === "pain") cur.pain = !cur.pain;
    else if(cur.effort === v) delete cur.effort;   // tap active option again to clear
    else cur.effort = v;
    if(cur.effort === undefined && !cur.pain) delete LOG.feedback[k];
    else LOG.feedback[k] = cur;
    save(); renderDay();
    return;
  }
  const wt = e.target.closest(".wtoggle");
  if(wt){
    const ex = exList()[wt.dataset.warm];
    warmOpenState.set(warmUi(ex), !warmIsOpen(ex));
    renderDay(); return;
  }
  const wp = e.target.closest(".wplus");
  if(wp){
    const ex = exList()[wp.dataset.warmadd];
    warmShown.set(warmUi(ex), warmRowCount(ex) + 1);
    renderDay(); return;
  }
  const nd = e.target.closest(".noteDone");
  if(nd){ const ta = nd.parentNode.querySelector(".note"); if(ta) ta.blur(); return; }
  const chk = e.target.closest(".chk");
  if(chk){
    const k = cell(W,D,exList()[chk.dataset.e].id,chk.dataset.s);
    LOG.sets[k] = LOG.sets[k] || {};
    const nowDone = !LOG.sets[k].done;
    LOG.sets[k].done = nowDone;
    activeOverride = null;              // let the marker advance to the next set
    // Finishing a set is the moment rest begins, so it restarts from zero.
    // Unchecking is a correction, not a set, and starts nothing.
    if(nowDone) STORE.timers.restStart = Date.now();
    save(); renderDay(); renderDash();
    if(setsLeft() === 0){                 // day done: freeze the total, stop resting
      STORE.timers.restStart = null;
      sessionPause();                     // saves and repaints the dashboard
    }
    return;
  }
  if(e.target.id==="themeBtn"){
    const cycle = ["auto","dark","light"];
    STORE.settings.theme = cycle[(cycle.indexOf(STORE.settings.theme)+1)%3];
    applyTheme(); save();
    return;
  }
  if(e.target.id==="exportBtn"){ exportData(); return; }
  if(e.target.id==="importBtn"){ $("importFile").click(); return; }
  if(e.target.id==="resetBtn"){
    if(confirm("Clear every logged weight, rep and note in this meso? The program itself stays.")){
      LOG.sets = {}; LOG.notes = {}; LOG.warmups = {}; save(); render();
    }
  }
});

document.addEventListener("input", e=>{
  const inp = e.target;
  if(inp.dataset.wf){
    const k = warmKey(W, D, exList()[inp.dataset.e].id, inp.dataset.i);
    const rec = LOG.warmups[k] || {};
    rec[inp.dataset.wf === "w" ? "weight" : "reps"] = inp.value === "" ? null : Number(inp.value);
    if(rec.weight == null && rec.reps == null) delete LOG.warmups[k];   // emptied means gone
    else LOG.warmups[k] = rec;
    // Repaint just the bar count: a full re-render here would steal focus mid-entry.
    const bar = inp.closest(".card").querySelector(".wtoggle");
    const wc = warmCount(exList()[inp.dataset.e]);
    if(bar) bar.textContent = "Warm up" + (wc ? " · " + wc : "");
    save();
    return;
  }
  if(inp.dataset.f){
    const k = cell(W,D,exList()[inp.dataset.e].id,inp.dataset.s);
    LOG.sets[k] = LOG.sets[k] || {};
    LOG.sets[k][inp.dataset.f==="w"?"weight":"reps"] = inp.value==="" ? null : Number(inp.value);
    save();
  }
  if(inp.dataset.note!==undefined){
    const k = `${W}|${D}|${exList()[inp.dataset.note].id}`;
    if(inp.value) LOG.notes[k] = inp.value; else delete LOG.notes[k];
    inp.style.height="auto"; inp.style.height=inp.scrollHeight+"px";
    save();
  }
});

(async ()=>{ await load(); applyTheme(); openAtNextUnfinished(); render(); syncWakeLock(); })();

// Offline support. Serves from cache instantly, refreshes in the background;
// updates apply on the next launch. No-ops under file:// where SW is unsupported.
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

/* Keep the screen awake while the app is in front. The lock is released by
   the browser whenever the page hides, so it is re-taken on return; some
   browsers also want a user gesture, hence the retry on interaction.
   Unsupported browsers (Safari before 16.4) no-op rather than throw. */
let wakeLock = null;
async function keepAwake(){
  if(!("wakeLock" in navigator) || document.visibilityState !== "visible" || wakeLock) return;
  if(sessionState() !== "running") return;     // paused or idle: let the phone sleep
  try{
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
  }catch(e){ wakeLock = null; }
}
async function syncWakeLock(){
  if(sessionState() === "running") return keepAwake();
  if(wakeLock){ try{ await wakeLock.release(); }catch(e){} wakeLock = null; }
}
document.addEventListener("visibilitychange", keepAwake);
document.addEventListener("pointerdown", keepAwake);

/* Long press the session cell to zero it. Cancelled by lifting or by moving,
   so a scroll that starts on the dashboard cannot wipe your clock. */
let sessHold = null, sessLongFired = false, sessHoldAt = null;
const cancelSessHold = () => { clearTimeout(sessHold); sessHold = null; };
$("sessBtn").addEventListener("pointerdown", e => {
  if(!e.isPrimary) return;
  sessLongFired = false; sessHoldAt = {x:e.clientX, y:e.clientY};
  sessHold = setTimeout(() => {
    sessHold = null; sessLongFired = true;
    sessionZero();
    if(navigator.vibrate) navigator.vibrate(20);
  }, 550);
});
$("sessBtn").addEventListener("pointermove", e => {
  if(sessHold && sessHoldAt && Math.hypot(e.clientX-sessHoldAt.x, e.clientY-sessHoldAt.y) > 10) cancelSessHold();
});
["pointerup","pointerleave","pointercancel"].forEach(ev =>
  $("sessBtn").addEventListener(ev, cancelSessHold));
</script>
