}

function renderDay(){
  $("days").innerHTML = exList().map((ex,ei)=>{
    const n = ex.sets[W-1];
    // §13.6: fields in a closed block are disabled, not merely ignored.
    /* cue-policy.md §2: the push-up's "leave the weight field empty" was the
       interface asking to be fixed. loadSense "none" already means there is no
       load, so the field is disabled rather than explained. */
    const ro = (viewingActive() && ex.loadSense !== "none") ? "" : " disabled";
    const repsRo = viewingActive() ? "" : " disabled";
    const sug = suggestFor(ex);
    /* cue-policy.md §3: open while the exercise has no history in this block,
       closed once it has. This is the NO_DATA the engine already computes, so a
       carried-over exercise in a new block starts closed and a genuinely new one
       opens until it is logged - with nobody editing any text. */
    const cueOpen = /^NO_DATA/.test(sug.outcome);
    /* The weight field hints the load the engine is actually suggesting, not
       PROGRAM's start. `start` never changes across a block, so from week 2 the
       field greyed in the number he began at while the ghost under it read
       "last 30x12" and the suggestion read "repeat 30" - the one number in the
       type-here position was the only stale one on the card.

       §5.1's `load` is null wherever there is no single number to name - MIXED,
       PAIN, and find-it - and the hint is then empty rather than falling back
       to `start`, which would put the stale number straight back. */
    const hint = Number.isFinite(sug.load) ? sug.load : "";
    const rows = Array.from({length:n},(_,si)=>{
      const c = LOG.sets[cell(W,D,ex.id,si)] || {};
      const prev = W>1 ? (LOG.sets[cell(W-1,D,ex.id,si)] || null) : null;
      let ghost = "";
      if(prev && (prev.weight||prev.reps)) ghost = `last ${prev.weight||"–"}×${prev.reps||"–"}`;
      else if(W===1 && ex.start) ghost = `start ${ex.start}`;
      else if(W===1 && ex.start===null) ghost = `find it`;
      /* Done, weighted movement, still no weight - so there was no suggestion
         to confirm either (mixed loads, pain, or a first-timer with no start).
         Flag it here rather than let it go quiet for a week. */
      const noWeight = c.done && c.weight == null && ex.loadSense !== "none";
      return `<div class="row ${c.done?'logged':''} ${noWeight?'noweight':''}" data-r="${ei}-${si}">
        <div class="setno">${si+1}</div>
        <div class="fieldwrap">
          <input type="number" inputmode="decimal" step="0.5" data-f="w" data-e="${ei}" data-s="${si}"
            value="${c.weight??""}" placeholder="${hint}"${ro}>
          <span class="ghost">${noWeight ? "no weight" : ghost}</span>
        </div>
        <div class="fieldwrap">
          <input type="number" inputmode="numeric" data-f="r" data-e="${ei}" data-s="${si}" value="${c.reps??""}"${repsRo}>
          <span class="ghost"></span>
        </div>
        <button class="chk" data-e="${ei}" data-s="${si}" aria-pressed="${!!c.done}" aria-label="Mark set ${si+1} done">
          <svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"/></svg>
        </button>
      </div>`;
    }).join("");
    const allDone = Array.from({length:n},(_,si)=>LOG.sets[cell(W,D,ex.id,si)]?.done).every(Boolean);
    const noteVal = LOG.notes[`${W}|${D}|${ex.id}`] || "";
    const fb = LOG.feedback[`${W}|${D}|${ex.id}`] || {};
    const skipped = isSkipped(W, D, ex.id);
    return `<div class="card ${allDone?'done':''} ${ex.swapped?'swapped':''} ${skipped?'skipped':''}" data-ex="${ex.programId}" data-sug-load="${Number.isFinite(sug.load)?sug.load:""}">
      <div class="exhead">
        <div class="exmain">
          <div class="tagrow">
            <div class="tag">${skipped?'Skipped today':ex.muscle}</div>
            <a class="vidBtn" href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name + " form")}"
               target="_blank" rel="noopener noreferrer" aria-label="Search YouTube for ${ex.name} form">
              <svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg>
            </a>
            <button class="swapBtn" data-e="${ei}" aria-label="Swap ${ex.name} for another ${LIBRARY.slots[ex.slot].label.toLowerCase()} exercise">
              <svg viewBox="0 0 24 24"><path d="M4 7h13M14 3l4 4-4 4M20 17H7M10 13l-4 4 4 4"/></svg>
            </button>
          </div>
          <div class="exname">${ex.name}</div>
        </div>
        <button class="grip" type="button" aria-label="Reorder the exercises on this day"><svg viewBox="0 0 10 16">
          <circle cx="2.5" cy="2" r="1.6"/><circle cx="7.5" cy="2" r="1.6"/>
          <circle cx="2.5" cy="8" r="1.6"/><circle cx="7.5" cy="8" r="1.6"/>
          <circle cx="2.5" cy="14" r="1.6"/><circle cx="7.5" cy="14" r="1.6"/>
        </svg></button>
      </div>
      <div class="todo ${/^(DELOAD|PAIN)/.test(sug.outcome)?"warn":""}">
        <div class="todoline">
          <div class="say">${sug.text}</div>
          <div class="prescribe">${n} × ${ex.reps}${ex.unit?` · ${ex.unit}`:""} · ${weekObj().rir} RIR</div>
        </div>
      </div>
      ${ex.cue?`<details class="cuewrap" ${cueOpen?"open":""}><summary>How to do it</summary><div class="cue">${ex.cue}</div></details>`:""}
      <div class="hdr"><div></div><div>Weight</div><div>Reps</div><div></div></div>
      ${rows}
      <div class="fbrow">
        ${["easy","right","brutal"].map(o=>
          `<button class="fb" data-fb="${o}" data-e="${ei}" aria-pressed="${fb.effort===o}">${o}</button>`).join("")}
        <span class="fbsep"></span>
        <button class="fb fbpain" data-fb="pain" data-e="${ei}" aria-pressed="${!!fb.pain}">pain</button>
      </div>
      <button class="notebtn${noteVal?" has":""}" data-note="${ei}"
        aria-label="${noteVal?"Edit note":"Add a note"} for ${ex.name}">${noteVal?esc(noteVal):"Note…"}</button>
    </div>`;
  }).join("");
  paintActive();
}

function renderVolume(){
  const tally = {};
  PROGRAM.days.forEach(d=>d.ex.forEach(ex=>{
    const m = effectiveLib(d.key, ex.id).muscle;
    tally[m] = (tally[m]||0) + ex.sets[W-1];
  }));
  const entries = Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  const max = Math.max(...entries.map(e=>e[1]));
  $("volTbl").innerHTML = `<div class="h">Muscle</div><div class="h">Sets</div><div class="h"></div>` +
    entries.map(([m,v])=>`<div>${m}</div><div style="text-align:right">${v}</div>
      <div><span class="bar" style="width:${Math.round(v/max*72)}px"></span></div>`).join("");
}

/* ---- dashboard: two stopwatches and a live set count ----
   Each stopwatch stores a start timestamp and derives elapsed on every tick,
   so it stays correct across a phone lock or a PWA restart. Accumulating a
   counter instead would drift or freeze the moment the browser throttles us. */
const fmtClock = ms => {
  const t = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  const pad = v => String(v).padStart(2,"0");
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
};

const dayIsSkipped = (w, dayKey) => !!LOG.daySkips[`${w}|${dayKey}`];
// Every consumer of "is this set aside" already routes through here - card
// rendering, the sets-left count, dayComplete and the swap sheet - so a day
// skip needs to reach exactly one line to reach all of them.
const isSkipped = (w, dayKey, exId) =>
  dayIsSkipped(w, dayKey) || !!LOG.skips[`${w}|${dayKey}|${exId}`];

function setsLeft(){
  let left = 0;
  exList().forEach(ex => {
    if(isSkipped(W, D, ex.id)) return;          // set aside: not work still owed
    for(let si = 0; si < ex.sets[W-1]; si++)
      if(!LOG.sets[cell(W,D,ex.id,si)]?.done) left++;
  });
  return left;
}

const todayKey = () => {
  const d = new Date(), p = v => String(v).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
};

/* ---- session report ----
   Formats the session just logged for a chat. Sits entirely outside the engine:
   no rule, schema or stored data involvement - it reads what is already on
   screen and returns a string. Nothing is sent anywhere from here.

   Console-callable and deliberately not wired to a button yet. Per the design
   note's own implementation order, the format IS the feature: it has to read
   well pasted by hand before any plumbing is worth writing. */
/* A note is the one string on a card the user types himself, and it is now
   rendered as markup rather than parked inside a textarea. */
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function sessionReport(question){
  const id = activeMeso();
  const n = id.match(/\d+/);
  const mesoName = n ? `Meso ${n[0]}` : id;
  const day = dayObj();
  const out = [
    `${mesoName} · Week ${W} · ${day.label} (${day.focus}) · target ${weekObj().rir} RIR`, "",
    "How to read this: sets are weight×reps, working sets only. FELT is my own",
    "effort tap for that exercise — easy, right, or brutal, relative to the target",
    "RIR. PAIN means a joint complaint, not muscular difficulty. NEXT is what my",
    "tracker's progression rule suggests for next week; I can override it.", ""];

  exList().forEach(ex => {
    // Trimmed: notes are typed on a phone and carry a trailing space more often
    // than not, which survived into the report.
    const note = (LOG.notes[`${W}|${D}|${ex.id}`] || "").trim();
    /* Read on every branch, not just the logged one. A skip with no reason
       attached reads as a training decision - a chat given "Cable Row —
       skipped" inferred fatigue from it when the note on the card said he ran
       out of time. The note is the only place that distinction lives. */
    if(isSkipped(W, D, ex.id)){
      out.push(`${ex.name} — skipped`);
      if(note) out.push(`  note: ${note}`);
      out.push("");
      return;
    }
    const sets = [];
    for(let si = 0; si < ex.sets[W-1]; si++){
      const c = LOG.sets[cell(W, D, ex.id, si)];
      if(c && typeof c.reps === "number" && c.reps > 0)
        sets.push(`${c.weight ?? "–"}×${c.reps}`);
    }
    // Not in the note, added on its own reasoning: an exercise with nothing
    // logged is the same kind of absence as a skip, and silence would read to a
    // fresh eye as "not in the program". Flagged for a ruling.
    if(!sets.length){
      out.push(`${ex.name} — not logged`);
      if(note) out.push(`  note: ${note}`);
      out.push("");
      return;
    }

    out.push(`${ex.name} · ${ex.reps}`);
    const fb = LOG.feedback[`${W}|${D}|${ex.id}`] || {};
    // §1 reads an absent effort as "right" for evaluation only, never backfilled -
    // so the report must not claim he tapped one when he did not.
    const felt = fb.effort ? ` · felt ${fb.effort}` : "";
    const pain = fb.pain ? " · PAIN" : "";
    const unit = ex.unit === "per DB" ? " per DB" : "";
    out.push(`  ${sets.join(" ")}${unit}${felt}${pain}`);
    if(note) out.push(`  note: ${note}`);
    out.push(`  NEXT ${suggestFor(ex).text}`, "");
  });

  const mins = Math.round(sessionElapsed() / 60000);
  if(mins > 0) out.push("", `Session ${mins} min.`, "");
  if(question) out.push(question);
  const NL = String.fromCharCode(10);
  return out.join(NL).replace(new RegExp(NL + "{3,}", "g"), NL + NL).trim();
}

/* ---- start and end of a session ----
   Start is a one-shot: it only appears while the clock is idle, so scrolling
   back up mid-session cannot restart anything. The clock itself stays
   tap-to-cycle on the dashboard; this is the "begin" affordance, not a
   replacement for it.

   End PAUSES rather than zeroes. Duration lives only in the timer - it is UI
   state, never stored per day - so zeroing would destroy the one number the
   report wants, permanently and with no undo. Zeroing is still a long press on
   the session cell, which is where a destructive action belongs. */
/* Is there completed work on the day in view? This is what makes zeroing safe:
   Start is only offered on a day nothing has been logged for, so it can never
   discard the clock of a session already under way. */
function dayHasLoggedWork(){
  return exList().some(ex => {
    for(let si = 0; si < ex.sets[W-1]; si++)
      if(LOG.sets[cell(W, D, ex.id, si)]?.done) return true;
    return false;
  });
}

function renderSessionButtons(){
  const st = sessionState();
  const day = dayComplete(W, D);
  /* Offered whenever this day has not been begun and nothing is running - NOT
     only when the clock reads zero. The clock is global while a session belongs
     to a day, so after finishing Monday it sits PAUSED with time on it, which
     hid Start on every later day and left the dashboard cell - which RESUMES -
     as the only way to begin. That is where the carried-over total came from. */
  $("startBtn").hidden = !(st !== "running" && !day && !dayHasLoggedWork() && viewingActive());
  const eb = $("endBtn");
  /* Offered only while a session is running, because it is now the only thing
     that ends one. Nothing else stops the clock. */
  eb.hidden = !(st === "running" && viewingActive());
  eb.innerHTML = `End session <span class="btime">${Math.round(sessionElapsed()/60000)} min</span>`;
  /* The report reads logged sets, not the clock, so it stands on its own: during
     a session, after it, or days later. Hidden only when there is nothing to
     report. */
  $("reportBtn").hidden = !(viewingActive() && dayHasLoggedWork());
}

function startSession(){
  /* Zero first. Start means "this session begins now", so time banked by an
     earlier session is not part of it. Safe because the button is hidden the
     moment this day has any logged work. */
  const t = STORE.timers;
  t.sessionAccum = 0; t.sessionStart = Date.now(); t.sessionDay = todayKey();
  t.restStart = null;
  save(); syncWakeLock();
  renderSessionButtons(); renderDash();
  /* Instant, not smooth. Smooth scrolling is inert in this container - measured
     with snapping both on and off, and with reduced-motion false - while an
     instant jump lands exactly on the card's snap point. A decisive snap also
     suits the gesture better than a glide. */
  const first = $("days").querySelector(".card");
  if(first) first.scrollIntoView({block:"start"});
  if(navigator.vibrate) navigator.vibrate(12);
}

/* Clipboard FIRST, then the share sheet. If sharing is unavailable, cancelled,
   or fails, the report is already on the clipboard rather than gone - which is
   the design note's instinct, kept even though the URL half was dropped. */
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  // Older path, kept because it succeeds in a few places the async API refuses.
  try{
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  }catch(e){ return false; }
}

async function handOffReport(text){
  const copied = await copyText(text);
  if(navigator.share){
    try{ await navigator.share({text}); return "SHARED"; }
    catch(e){ /* cancelled, or no target took it: the copy above still stands */ }
  }
  return copied ? "REPORT COPIED" : "COULD NOT COPY";
}

/* §4 of the design note: the report must carry a specific question. A bare
   dump invites a general review, and a general review of a deliberately
   designed program is the least useful thing this button can produce. */
function endSession(){
  sessionPause();
  renderSessionButtons(); renderDash();
  if(navigator.vibrate) navigator.vibrate([12, 60, 12]);
}

function reportSheet(){
  const painEx = exList().find(ex => (LOG.feedback[`${W}|${D}|${ex.id}`] || {}).pain);
  const opts = [
    {q:"off",   name:"Something felt off",        meta:"pick the exercise next"},
    {q:"sug",   name:"Question a suggestion",     meta:"pick the exercise next"},
    {q:"time",  name:"Short on time next session",meta:"asks how many minutes"}
  ];
  // Only offered when a joint complaint was actually flagged - the question
  // says "flagged above", and it would be a lie otherwise.
  if(painEx) opts.push({q:"hurt", name:"Something hurt", meta:painEx.name});
  opts.push({q:"free", name:"Ask something else", meta:"type your own"});
  $("swapTitle").textContent = "Send the session with —";
  $("swapOpts").innerHTML = opts.map(o =>
    `<button class="opt qOpt" data-q="${o.q}">
      <div class="oname">${o.name}</div><div class="ometa">${o.meta}</div>
    </button>`).join("");
  $("swapSheet").hidden = false;
}

function openNoteSheet(ei){
  const ex = exList()[ei];
  const val = LOG.notes[`${W}|${D}|${ex.id}`] || "";
  $("swapTitle").textContent = `Note — ${ex.name}`;
  $("swapOpts").innerHTML =
    `<textarea class="noteEdit" data-note="${ei}" placeholder="What happened on this one?"></textarea>` +
    `<button class="sheetDone" type="button">Done</button>`;
  // Set as a value, never as markup: this is the one string the user types.
  const ta = $("swapOpts").querySelector(".noteEdit");
  ta.value = val;
  $("swapSheet").hidden = false;
  ta.focus();
  ta.setSelectionRange(val.length, val.length);   // caret at the end, not the start
}

function endExerciseSheet(kind){
  $("swapTitle").textContent = "Which exercise?";
  $("swapOpts").innerHTML = exList().map((ex, i) =>
    `<button class="opt qEx" data-q="${kind}" data-i="${i}">
      <div class="oname">${ex.name}</div>
    </button>`).join("");
}

async function finishSession(question){
  closeSwapSheet();
  const msg = await handOffReport(sessionReport(question));
  toastMsg(msg);
}

/* Session clock: idle -> running -> paused -> running. Tap cycles; a long
   press zeroes it. Elapsed is banked time plus the current run, so pausing
   never loses the reading and nothing accumulates tick by tick. */
const sessionElapsed = () => {
  const t = STORE.timers;
  return t.sessionAccum + (t.sessionStart ? Date.now() - t.sessionStart : 0);
};
const sessionState = () => {
  const t = STORE.timers;
  return t.sessionStart ? "running" : (t.sessionAccum > 0 ? "paused" : "idle");
};

function sessionPause(){
  const t = STORE.timers;
  if(!t.sessionStart) return;
  t.sessionAccum += Date.now() - t.sessionStart;
  t.sessionStart = null;
  save(); tickDash(); syncWakeLock();
}

function sessionToggle(){
  const t = STORE.timers;
  if(t.sessionStart) return sessionPause();
  t.sessionStart = Date.now();
  t.sessionDay = todayKey();
  save(); tickDash(); syncWakeLock();
}

function sessionZero(){
  const t = STORE.timers;
  t.sessionStart = null; t.sessionAccum = 0; t.sessionDay = null;
  save(); tickDash(); syncWakeLock();
}

/* Removing auto-pause left nothing to stop a clock he walked away from, so it
   would have run until the next day's staleness check cleared it. Two hours is
   his own bound - he is never at the gym longer, and calls two a stretch.

   It DISCARDS rather than caps. A session still running at two hours means End
   was never pressed, so the duration is unknown, not two hours. Capping would
   write a plausible-looking number that is wrong by however long he had already
   left, and that number would then feed the pace calibration the builder wants
   to derive from real sessions. An absent duration is honestly absent. */
const SESSION_MAX = 2 * 3600 * 1000;

function dropForgottenSession(){
  const t = STORE.timers;
  if(!t.sessionStart || sessionElapsed() <= SESSION_MAX) return false;
  t.sessionStart = null; t.sessionAccum = 0; t.sessionDay = null; t.restStart = null;
  save(); syncWakeLock();
  return true;
}

function tickDash(){
  // Fires at most once: afterwards there is no running session to find.
  if(dropForgottenSession()){ renderSessionButtons(); toastMsg("SESSION LEFT RUNNING — CLEARED"); }
  const t = STORE.timers, st = sessionState();
  $("sessVal").textContent = st === "idle" ? "0:00" : fmtClock(sessionElapsed());
  $("restVal").textContent = t.restStart ? fmtClock(Date.now() - t.restStart) : "0:00";
  $("sessBtn").classList.toggle("on", st === "running");
  $("sessBtn").classList.toggle("paused", st === "paused");
  $("sessBtn").querySelector(".dlabel").textContent = st === "paused" ? "Paused" : "Session";
  $("restBtn").classList.toggle("on", !!t.restStart);
}

function renderDash(){
  const n = setsLeft();
  const off = dayIsSkipped(W, D);
  $("setsLeft").textContent = n;
  // Green is the colour of work finished. A day you set aside reaches zero
  // without earning it, so it reads neutral.
  $("setsCell").classList.toggle("done", n === 0 && !off);
  $("setsCell").querySelector(".dlabel").textContent =
    n === 0 ? (off ? "Day skipped" : "Day done") : "Sets left";
  renderSessionButtons();
  tickDash();
}

setInterval(tickDash, 1000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) tickDash(); });

/* ---- active set: the next one due ----
   First unchecked set in display order, advancing as sets are completed.
   Focusing any input moves the marker there instead, so you can go back. */
let activeOverride = null;

function activeKey(){
  if(activeOverride) return activeOverride;
  const list = exList();
  for(let ei = 0; ei < list.length; ei++)
    for(let si = 0; si < list[ei].sets[W-1]; si++)
      if(!LOG.sets[cell(W,D,list[ei].id,si)]?.done) return `${ei}-${si}`;
  return null;
}

function paintActive(){
  const k = activeKey();
  $("days").querySelectorAll(".row").forEach(r => r.classList.toggle("active", r.dataset.r === k));
}

document.addEventListener("focusin", e => {
  const row = e.target.closest && e.target.closest(".row");
  if(row && row.dataset.r){
    /* Reaching for the set that is due ends the rest period - you are back to
       work - which saves stopping the clock as its own tap and a scroll. Note
       the check runs before the marker moves: touching an already logged row
       is a correction, not the next set, and leaves the clock running. */
    if(row.classList.contains("active") && STORE.timers.restStart){
      STORE.timers.restStart = null; save(); tickDash();
    }
    activeOverride = row.dataset.r; paintActive();
  }
  if(e.target.matches && e.target.matches("input,textarea")) scroller().classList.add("typing");
});
document.addEventListener("focusout", e => {
  if(!(e.target.matches && e.target.matches("input,textarea"))) return;
  // Deferred: moving between two fields fires focusout before the next focusin,
  // and dropping the class in between would let a snap fire mid-hop.
  setTimeout(() => {
    const a = document.activeElement;
    if(!a || !a.matches || !a.matches("input,textarea")) scroller().classList.remove("typing");
  }, 0);
});

function render(){ renderHeader(); renderDay(); renderVolume(); renderDash(); }

function toastMsg(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("on");
  setTimeout(()=>{t.classList.remove("on"); t.textContent="SAVED";},1400);
}

/* ---- theme ---- */
function applyTheme(){
  const t = STORE.settings.theme;
  if(t==="dark"||t==="light") document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  $("themeBtn").textContent = t;
}

/* ---- export / import ----
   Export downloads the whole envelope verbatim. Import validates and migrates
   a parsed copy first, then stashes the current envelope under .backup and
   swaps in the file — all-or-nothing, storage is never half-written. The
   file's own updatedAt is kept (storage.set would restamp it). */
function exportData(){
  const d = new Date();
  const pad = n => String(n).padStart(2,"0");
  const name = `meso-tracker-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;
  const url = URL.createObjectURL(new Blob([JSON.stringify(STORE,null,2)], {type:"application/json"}));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toastMsg("EXPORTED");
}

function describeEnvelope(s){
  let sets=0, notes=0;
  Object.values(s.mesos||{}).forEach(m=>{
    sets += Object.keys(m.sets||{}).length;
    notes += Object.keys(m.notes||{}).length;
  });
  return `${sets} logged sets, ${notes} notes` + (s.updatedAt ? `, saved ${s.updatedAt.slice(0,10)}` : "");
}

async function importData(text){
  let s;
  try{ s = JSON.parse(text); }
  catch(err){ alert("Import failed: the file isn't valid JSON."); return false; }
  if(!s || typeof s!=="object" || Array.isArray(s)){
    alert(`Import failed: expected a JSON object, got ${Array.isArray(s)?"an array":typeof s}.`); return false;
  }
  if(typeof s.schemaVersion!=="number"){
    alert("Import failed: no schemaVersion field — this doesn't look like a meso-tracker export."); return false;
  }
  if(s.schemaVersion > SCHEMA_VERSION){
    alert(`Import failed: the file is schema v${s.schemaVersion}, but this app only knows v${SCHEMA_VERSION}. Update the app, then import.`); return false;
  }
  if(!s.mesos || typeof s.mesos!=="object" || Array.isArray(s.mesos)){
    alert("Import failed: no mesos object — this doesn't look like a meso-tracker export."); return false;
  }
  for(let v=s.schemaVersion; v<SCHEMA_VERSION; v++){
    if(!MIGRATIONS[v]){ alert(`Import failed: no migration path from schema v${s.schemaVersion} to v${SCHEMA_VERSION}.`); return false; }
  }
  while(s.schemaVersion < SCHEMA_VERSION){
    s = MIGRATIONS[s.schemaVersion](s);
    s.schemaVersion++;
  }
  if(!confirm(`Replace what's on this device (${describeEnvelope(STORE)}) with the file (${describeEnvelope(s)})?\n\nThe current data is stashed under the backup key first.`)) return false;
  backupRaw(JSON.stringify(STORE));
  localStorage.setItem(STORE_KEY, JSON.stringify(s));
  await load();
  applyTheme();
  render();
  toastMsg("IMPORTED");
  return true;
}

$("importFile").addEventListener("change", async e=>{
  const f = e.target.files[0];
  e.target.value = "";
  if(f) importData(await f.text());
});

/* ---- reorder ----
   Opened from the card's grip, and it is the only way to reorder now. The old
   gesture held the card header for a third of a second and then dragged the
   real card; see the sheet's CSS for why that surface was the problem rather
   than the gesture. */
const scroller = () => document.querySelector(".wrap");
let ro = null;

function openReorderSheet(){
  $("swapTitle").textContent = `Reorder — ${dayObj().label}`;
  const list = exList();
  $("swapOpts").innerHTML =
    `<div class="rohint">Drag a handle, or use the arrows.</div>` +
    `<div id="roList">` + list.map((ex, i) => {
      const off = isSkipped(W, D, ex.id);
      return `<div class="rorow${off ? " ro-skip" : ""}" data-ex="${ex.programId}">
        <div class="rogrip"><svg viewBox="0 0 10 16">
          <circle cx="2.5" cy="2" r="1.6"/><circle cx="7.5" cy="2" r="1.6"/>
          <circle cx="2.5" cy="8" r="1.6"/><circle cx="7.5" cy="8" r="1.6"/>
          <circle cx="2.5" cy="14" r="1.6"/><circle cx="7.5" cy="14" r="1.6"/>
        </svg></div>
        <div class="roline">
          <div class="rotag">${off ? "Skipped" : ex.muscle} · ${ex.sets[W-1]}×${ex.reps}</div>
          <div class="roname">${ex.name}</div>
        </div>
        <button class="roup" type="button" aria-label="Move ${ex.name} earlier"${i === 0 ? " disabled" : ""}>
          <svg viewBox="0 0 16 16"><polyline points="3,10 8,5 13,10"/></svg>
        </button>
        <button class="rodown" type="button" aria-label="Move ${ex.name} later"${i === list.length-1 ? " disabled" : ""}>
          <svg viewBox="0 0 16 16"><polyline points="3,10 8,5 13,10"/></svg>
        </button>
      </div>`;
    }).join("") + `</div>` +
    `<button class="sheetDone" type="button">Done</button>`;
  $("swapSheet").hidden = false;
}

// The ends move as rows do, so the two arrows that cannot go anywhere have to
// be redisabled after every move however it was made.
function roEnds(){
  const rows = [...$("roList").children];
  rows.forEach((r, i) => {
    r.querySelector(".roup").disabled = i === 0;
    r.querySelector(".rodown").disabled = i === rows.length - 1;
  });
}

function roNudge(row, up){
  const sib = up ? row.previousElementSibling : row.nextElementSibling;
  if(!sib) return;
  if(up) sib.before(row); else sib.after(row);
  roStep(); roEnds(); roCommit();
}

/* Neighbour-relative, at most one place per call. Scanning every row for an
   absolute answer meant any layout shift could re-slot several positions at
   once, which is what made the old drag lurch and buzz while it settled.
   Steps cannot cascade, and cannot oscillate either: after a swap the row sits
   in the space the neighbour vacated, which is past that neighbour's new
   midpoint. Kept from the old implementation - the logic was sound, the
   surface it ran on was not. */
function roPlace(y){
  const rows = [...$("roList").children];
  const i = rows.indexOf(ro.row);
  if(i < 0) return;
  const prev = rows[i-1], next = rows[i+1];
  if(prev){
    const r = prev.getBoundingClientRect();
    if(y < r.top + r.height/2){ prev.before(ro.row); roStep(); roEnds(); return; }
  }
  if(next){
    const r = next.getBoundingClientRect();
    if(y > r.top + r.height/2){ next.after(ro.row); roStep(); roEnds(); return; }
  }
}

// One short blip per position crossed, paced by the finger.
function roStep(){ if(navigator.vibrate) navigator.vibrate(10); }

function roCommit(){
  const now = [...$("roList").children].map(r => r.dataset.ex);
  // Against programId, which is what LOG.order stores. The old commit compared
  // these ids to exList().map(x => x.id) - a different field on any swapped
  // exercise - so it wrote the order back on every drop, moved or not.
  if(now.join("|") !== exList().map(x => x.programId).join("|")){
    LOG.order[D] = now;
    save();
  }
}

function roMove(e){ if(ro && e.pointerId === ro.pid) roPlace(e.clientY); }

function roEnd(e){
  if(!ro || (e && e.pointerId !== ro.pid)) return;
  ro.row.classList.remove("ro-drag");
  document.removeEventListener("pointermove", roMove);
  document.removeEventListener("pointerup", roEnd);
  document.removeEventListener("pointercancel", roEnd);
  ro = null;
  roCommit();
}

/* No hold to wait out. Inside a sheet whose only purpose is reordering,
   touching the handle means dragging - and touch-action:none on the handle
   keeps the browser from claiming the gesture as a scroll, which is what the
   old code needed a non-passive touchmove listener to undo. */
$("swapOpts").addEventListener("pointerdown", e => {
  const grip = e.target.closest(".rogrip");
  if(!grip || !e.isPrimary || refuseIfClosed()) return;          // §13.6
  ro = {row: grip.closest(".rorow"), pid: e.pointerId};
  // Without capture the finger leaves the 40px handle on the first move and
  // the events go to whatever is under it instead.
  try{ grip.setPointerCapture(e.pointerId); }catch(err){}
  ro.row.classList.add("ro-drag");
  if(navigator.vibrate) navigator.vibrate(12);
  document.addEventListener("pointermove", roMove);
  document.addEventListener("pointerup", roEnd);
  document.addEventListener("pointercancel", roEnd);
});

/* ---- exercise swap sheet ----
   Tap the card's swap button to list same-slot library alternatives. Choosing
   one stores swaps[day][programId] = replacementId; choosing the original
   removes the override. Logged sets are never touched — each exercise's
   history lives under its own id, so swapping back restores it. */
function openSwapSheet(ex){
  $("swapTitle").textContent = `${LIBRARY.slots[ex.slot].label} — swap for`;
  // ex.slot is the slot being filled, so this still lists the neighbours after a
  // cross-slot swap - which is what makes leg_press -> leg_extension reversible.
  const declared = new Set((LIB_EX.get(ex.programId) || {}).subs || []);
  $("swapOpts").innerHTML = LIBRARY.exercises.filter(o=>o.slot===ex.slot || declared.has(o.id)).map(o=>{
    const spinal = o.spinalLoad !== ex.spinalLoad
      ? `<div class="ospinal">spinal load ${o.spinalLoad} (current: ${ex.spinalLoad})</div>` : "";
    return `<button class="opt" data-swap-to="${o.id}" data-program="${ex.programId}" aria-pressed="${o.id===ex.id}">
      <div class="oname">${o.name}</div>
      <div class="ometa">${o.equipment.join(" · ")}</div>
      ${spinal}
    </button>`;
  }).join("");
  // isSkipped() is true here for a day skip too, but toggling this exercise's
  // own key would not lift the blanket - so when the day is off, offer the undo
  // that actually works.
  const dayOff = dayIsSkipped(W, D);
  const skipped = !!LOG.skips[`${W}|${D}|${ex.id}`];
  $("swapOpts").insertAdjacentHTML("beforeend", dayOff
    ? `<button class="opt daySkipOpt" data-day-skip="${D}">
        <div class="oname">Put the whole day back</div>
        <div class="ometa">the entire day is set aside — this restores all of it</div>
      </button>`
    : `<button class="opt skipOpt" data-skip="${ex.programId}">
        <div class="oname">${skipped ? "Put it back" : "Skip it today"}</div>
        <div class="ometa">${skipped
          ? "counts toward the day again"
          : "stops counting toward the day; next week still reads your last real numbers"}</div>
      </button>`);
  $("swapSheet").hidden = false;
}

/* ---- setting a whole day aside ----
   Long-press a day tab. Stored as one blanket key rather than a skip written
   onto each exercise, which buys two things: putting the day back leaves any
   exercise you had already set aside on its own still set aside, and the
   blanket keeps covering an exercise you swap while the day is off.

   Nothing reaches the rule engine. A skipped day informs next week exactly as
   a skipped exercise does - by leaving no logged sets behind, so the reference
   week walks back past it (spec sec.1). No spec change, no new vectors. */
function openDaySheet(dayKey){
  const day = PROGRAM.days.find(x => x.key === dayKey);
  if(!day) return;
  const off = dayIsSkipped(W, dayKey);
  $("swapTitle").textContent = `${day.label} · week ${W} — whole day`;
  $("swapOpts").innerHTML =
    `<button class="opt daySkipOpt" data-day-skip="${dayKey}">
      <div class="oname">${off ? "Put the day back" : "Skip the whole day"}</div>
      <div class="ometa">${off
        ? "every exercise on it counts toward the day again"
        : "sets every exercise aside; next week still reads your last real numbers"}</div>
    </button>`;
  $("swapSheet").hidden = false;
}

function closeSwapSheet(){
  // Redraw only for the note sheet, whose card label is now stale. The swap
  // paths render themselves.
  const redraw = !!$("swapOpts").querySelector(".noteEdit, #roList");
  $("swapSheet").hidden = true;
  if(redraw) renderDay();
}

document.addEventListener("click", e=>{
  const sb = e.target.closest(".swapBtn");
  if(sb){ openSwapSheet(exList()[sb.dataset.e]); return; }
  if(refuseIfClosed() && e.target.closest(".daySkipOpt,.skipOpt,.opt")) return;   // §13.6
  if(e.target.closest("#startBtn")){ startSession(); return; }
  if(e.target.closest("#endBtn")){ endSession(); return; }
  if(e.target.closest("#reportBtn")){ reportSheet(); return; }
  const qEx = e.target.closest(".qEx");
  if(qEx){
    const ex = exList()[qEx.dataset.i];
    if(qEx.dataset.q === "off")
      finishSession(`${ex.name} felt worse than the numbers suggest. Worth changing something, or is one bad set just a bad set?`);
    else
      finishSession(`My tracker says "${suggestFor(ex).text}" for ${ex.name}. Does that look right given how the session went?`);
    return;
  }
  const qOpt = e.target.closest(".qOpt");
  if(qOpt){
    const q = qOpt.dataset.q;
    if(q === "off" || q === "sug"){ endExerciseSheet(q); return; }
    if(q === "time"){
      const n = prompt("About how many minutes will you have?");
      if(n && Number(n) > 0)
        finishSession(`Next session I'll have about ${Number(n)} minutes. Given how this one went, what would you cut and what has to stay?`);
      return;
    }
    if(q === "hurt"){
      const ex = exList().find(x => (LOG.feedback[`${W}|${D}|${x.id}`] || {}).pain);
      if(ex) finishSession(`${ex.name} produced a joint complaint, flagged above. What should I change before the next exposure?`);
      return;
    }
    const own = prompt("What do you want to ask?");
    if(own && own.trim()) finishSession(own.trim());
    return;
  }
  const dsb = e.target.closest(".daySkipOpt");
  if(dsb){
    const k = `${W}|${dsb.dataset.daySkip}`;
    if(LOG.daySkips[k]) delete LOG.daySkips[k]; else LOG.daySkips[k] = true;
    save(); closeSwapSheet(); render(); renderDash();
    return;
  }
  const skipBtn = e.target.closest(".skipOpt");
  if(skipBtn){
    const ex = exList().find(x => x.programId === skipBtn.dataset.skip);
    const k = `${W}|${D}|${ex.id}`;
    if(LOG.skips[k]) delete LOG.skips[k]; else LOG.skips[k] = true;
    save(); closeSwapSheet(); render(); renderDash();
    return;
  }
  const opt = e.target.closest(".opt");
  if(opt){
    const pid = opt.dataset.program, to = opt.dataset.swapTo;
    LOG.swaps[D] = LOG.swaps[D] || {};
    if(to === pid) delete LOG.swaps[D][pid];
    else LOG.swaps[D][pid] = to;
    if(!Object.keys(LOG.swaps[D]).length) delete LOG.swaps[D];
    save(); closeSwapSheet(); render();
    return;
  }
  if(e.target.closest(".sheetBack")){ closeSwapSheet(); return; }
});

document.addEventListener("click", e=>{
  const wb = e.target.closest("#weekSeg button");
  if(wb){ W = +wb.dataset.w; activeOverride = null; rememberPlace(); render(); scroller().scrollTo(0,0); return; }
  const db = e.target.closest("#daySeg button");
  if(db){
    // A hold has already opened the day sheet; do not also navigate there.
    if(daySegLongFired){ daySegLongFired = false; return; }
    D = db.dataset.d; activeOverride = null; rememberPlace(); render(); scroller().scrollTo(0,0); return;
  }
  // Session: tap cycles start / pause / resume. A long press zeroes it, and
  // swallows the click the browser fires afterwards.
  if(e.target.closest("#sessBtn")){
    if(sessLongFired){ sessLongFired = false; return; }
    sessionToggle(); return;
  }
  // Rest is binary — you are resting or you are not.
  if(e.target.closest("#restBtn")){
    STORE.timers.restStart = STORE.timers.restStart ? null : Date.now();
    save(); tickDash(); return;
  }
  // §13.6: everything below this line writes to the block.
  if(refuseIfClosed() && e.target.closest(".fb,.chk,.notebtn,.grip,.roup,.rodown")) return;
  const fbBtn = e.target.closest(".fb");
  if(fbBtn){
    const k = `${W}|${D}|${exList()[fbBtn.dataset.e].id}`;
    const cur = LOG.feedback[k] || {};
    const v = fbBtn.dataset.fb;
    if(v === "pain") cur.pain = !cur.pain;
    else if(cur.effort === v) delete cur.effort;   // tap active option again to clear
    else cur.effort = v;
    if(cur.effort === undefined && !cur.pain) delete LOG.feedback[k];
    else LOG.feedback[k] = cur;
    save(); renderDay();
    return;
  }
  if(e.target.closest(".grip")){ openReorderSheet(); return; }
  const arrow = e.target.closest(".roup,.rodown");
  if(arrow){ roNudge(arrow.closest(".rorow"), arrow.classList.contains("roup")); return; }
  const nb = e.target.closest(".notebtn");
  if(nb){ openNoteSheet(+nb.dataset.note); return; }
  if(e.target.closest(".sheetDone")){ closeSwapSheet(); return; }
  const chk = e.target.closest(".chk");
  if(chk){
    const ex = exList()[chk.dataset.e];
    const k = cell(W,D,ex.id,chk.dataset.s);
    LOG.sets[k] = LOG.sets[k] || {};
    const nowDone = !LOG.sets[k].done;
    /* Ticking a set means "this happened as shown", and the weight shown is the
       suggested one - so confirm it rather than leaving the field empty. This is
       the failure that cost a week of progressions: the suggestion sat greyed in
       the box looking like an entered value, reps got typed, the weight never
       did, and every one of those exercises read as MIXED the following week.

       Only fills an EMPTY field, so a typed weight always wins, and only on the
       way to done - unchecking is a correction and leaves the number alone,
       since by then it is recorded data. The suggested load is per exercise,
       not per set, which is the point: all the sets sat at one weight. */
    // "" means there was no load to suggest. Number("") is 0, not NaN, so the
    // empty case has to be caught before the cast or every unsuggestable set
    // gets recorded at zero - which is the fabrication this exists to avoid.
    // A literal 0 is meaningful (assist reaching unassisted) and is kept.
    const rawSug = chk.closest(".card").dataset.sugLoad;
    const sug = rawSug === "" ? NaN : Number(rawSug);
    if(nowDone && LOG.sets[k].weight == null && Number.isFinite(sug))
      LOG.sets[k].weight = sug;
    LOG.sets[k].done = nowDone;
    activeOverride = null;              // let the marker advance to the next set
    // Finishing a set is the moment rest begins, so it restarts from zero.
    // Unchecking is a correction, not a set, and starts nothing.
    if(nowDone) STORE.timers.restStart = Date.now();
    save(); renderDay(); renderDash();
    if(setsLeft() === 0){
      /* The last set ends the rest interval - there is nothing left to rest for -
         but NOT the session. End is the only thing that stops the clock now,
         because the clock measures time at the gym rather than time training,
         and the walk out is part of that. */
      STORE.timers.restStart = null; save(); tickDash();
    }
    return;
  }
  if(e.target.id==="themeBtn"){
    const cycle = ["auto","dark","light"];
    STORE.settings.theme = cycle[(cycle.indexOf(STORE.settings.theme)+1)%3];
    applyTheme(); save();
    return;
  }
  if(e.target.id==="exportBtn"){ exportData(); return; }
  if(e.target.id==="importBtn"){ $("importFile").click(); return; }
  if(e.target.id==="resetBtn"){
    if(confirm("Clear every logged weight, rep and note in this meso? The program itself stays.")){
      LOG.sets = {}; LOG.notes = {}; LOG.warmups = {}; LOG.skips = {}; LOG.daySkips = {};
      save(); render();
    }
  }
});

document.addEventListener("input", e=>{
  if(refuseIfClosed()) return;                                                   // §13.6
  const inp = e.target;
  if(inp.dataset.f){
    const k = cell(W,D,exList()[inp.dataset.e].id,inp.dataset.s);
    LOG.sets[k] = LOG.sets[k] || {};
    LOG.sets[k][inp.dataset.f==="w"?"weight":"reps"] = inp.value==="" ? null : Number(inp.value);
    save();
  }
  if(inp.dataset.note!==undefined){
    const k = `${W}|${D}|${exList()[inp.dataset.note].id}`;
    if(inp.value) LOG.notes[k] = inp.value; else delete LOG.notes[k];
    save();
  }
});

/* Which build is this phone actually running?

   The stamp is read from the served document's Last-Modified rather than a
   constant, because a constant is precisely the thing that goes stale - the
   engine's own header comment claimed v1.8 for a day after the spec moved to
   1.9. This cannot drift: it reports the file the browser is running, and when
   the service worker is still serving last week's copy it shows last week's
   date, which is the one question worth answering when the app looks wrong
   after a deploy. */
function buildStamp(){
  const d = new Date(document.lastModified);
  if(isNaN(d.getTime())) return "unknown";
  return d.toLocaleDateString("en-GB", {day:"numeric", month:"short"}) + " " +
         d.toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit", hour12:false});
}

function renderBuildLine(){
  $("buildLine").textContent =
    `build ${buildStamp()} · schema ${SCHEMA_VERSION} · spec ${SPEC_VERSION}`;
}

/* Tap the build line to pull a new build now, instead of relaunching until one
   happens to stick. The page cannot check for itself - the worker answers from
   cache and ignores query strings - so it asks the worker, which is not
   intercepted by its own fetch handler. See sw.js.

   Only reloads when the server's copy is genuinely newer, so a tap mid-session
   is a no-op rather than an interruption, and the pending save is flushed first
   either way. */
let checkingUpdate = false, checkTimer = null;

function onSwMessage(e){
  if(!checkingUpdate || !e.data || e.data.type !== "refreshed") return;
  checkingUpdate = false; clearTimeout(checkTimer);
  if(!e.data.ok){ renderBuildLine(); toastMsg("NO SIGNAL — KEPT THIS BUILD"); return; }
  const newer = e.data.lastModified &&
    new Date(e.data.lastModified) > new Date(document.lastModified);
  if(!newer){ renderBuildLine(); toastMsg("UP TO DATE"); return; }
  toastMsg("UPDATING…");
  (async ()=>{ try{ await storage.set(STORE); }catch(err){} location.reload(); })();
}
navigator.serviceWorker.addEventListener("message", onSwMessage);

$("buildLine").addEventListener("click", ()=>{
  if(checkingUpdate) return;
  const sw = navigator.serviceWorker.controller;
  if(!sw){ toastMsg("NO WORKER — RELAUNCH"); return; }
  checkingUpdate = true;
  $("buildLine").textContent = "checking for an update…";
  sw.postMessage("refresh");
  // An older worker has no message handler and will never answer.
  checkTimer = setTimeout(()=>{
    if(!checkingUpdate) return;
    checkingUpdate = false; renderBuildLine();
    toastMsg("RELAUNCH TO FINISH UPDATING");
  }, 8000);
});

(async ()=>{
  await load(); applyTheme(); openAtNextUnfinished(); render(); syncWakeLock();
  renderBuildLine();
})();

// Offline support. Serves from cache instantly, refreshes in the background;
// updates apply on the next launch. No-ops under file:// where SW is unsupported.
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

/* Keep the screen awake while the app is in front. The lock is released by
   the browser whenever the page hides, so it is re-taken on return; some
   browsers also want a user gesture, hence the retry on interaction.
   Unsupported browsers (Safari before 16.4) no-op rather than throw. */
let wakeLock = null;
async function keepAwake(){
  if(!("wakeLock" in navigator) || document.visibilityState !== "visible" || wakeLock) return;
  if(sessionState() !== "running") return;     // paused or idle: let the phone sleep
  try{
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
  }catch(e){ wakeLock = null; }
}
async function syncWakeLock(){
  if(sessionState() === "running") return keepAwake();
  if(wakeLock){ try{ await wakeLock.release(); }catch(e){} wakeLock = null; }
}
document.addEventListener("visibilitychange", keepAwake);
document.addEventListener("pointerdown", keepAwake);

/* Holding a day tab opens its sheet. Holding Wednesday while Monday is on
   screen sets Wednesday aside without navigating to it - the tab you held is
   the day you meant, whether or not you are standing on it. */
let daySegHold = null, daySegLongFired = false, daySegAt = null;
const cancelDaySegHold = () => { clearTimeout(daySegHold); daySegHold = null; };
$("daySeg").addEventListener("pointerdown", e => {
  const b = e.target.closest("button");
  if(!e.isPrimary || !b) return;
  daySegLongFired = false; daySegAt = {x: e.clientX, y: e.clientY};
  daySegHold = setTimeout(() => {
    daySegHold = null; daySegLongFired = true;
    openDaySheet(b.dataset.d);
    if(navigator.vibrate) navigator.vibrate(20);
  }, 550);
});
$("daySeg").addEventListener("pointermove", e => {
  if(daySegHold && daySegAt && Math.hypot(e.clientX-daySegAt.x, e.clientY-daySegAt.y) > 10) cancelDaySegHold();
});
["pointerup","pointerleave","pointercancel"].forEach(ev =>
  $("daySeg").addEventListener(ev, cancelDaySegHold));
// Android raises a context menu on long-press; keep it off the tabs.
$("daySeg").addEventListener("contextmenu", e => e.preventDefault());

/* Long press the session cell to zero it. Cancelled by lifting or by moving,
   so a scroll that starts on the dashboard cannot wipe your clock. */
let sessHold = null, sessLongFired = false, sessHoldAt = null;
const cancelSessHold = () => { clearTimeout(sessHold); sessHold = null; };
$("sessBtn").addEventListener("pointerdown", e => {
  if(!e.isPrimary) return;
  sessLongFired = false; sessHoldAt = {x:e.clientX, y:e.clientY};
  sessHold = setTimeout(() => {
    sessHold = null; sessLongFired = true;
    sessionZero();
    if(navigator.vibrate) navigator.vibrate(20);
  }, 550);
});
$("sessBtn").addEventListener("pointermove", e => {
  if(sessHold && sessHoldAt && Math.hypot(e.clientX-sessHoldAt.x, e.clientY-sessHoldAt.y) > 10) cancelSessHold();
});
["pointerup","pointerleave","pointercancel"].forEach(ev =>
  $("sessBtn").addEventListener(ev, cancelSessHold));
</script>
</body>
